oining the cluster"],"a":[0],"e":"Combined with the NodeRestriction admission plugin, the Node authorizer prevents a compromised node from reading or modifying objects belonging to other nodes."},{"id":"kcsa-comp11","d":"comp","q":"Why should the kube-controller-manager run with --use-service-account-credentials=true?","o":["So each controller uses its own ServiceAccount with scoped RBAC permissions instead of the controller manager's broad credentials","So it can pull images faster","So it can replace the API server","So it can bypass admission control"],"a":[0],"e":"Running every controller loop as a separate, least-privileged identity limits what a bug or compromise in one controller can do."},{"id":"kcsa-comp12","d":"comp","q":"Which statement about the kube-scheduler's security configuration is correct?","o":["It should authenticate to the API server with its own kubeconfig and least-privilege RBAC, bind only to localhost or secure ports, and not expose insecure profiling endpoints","It must run on every worker node","It stores Secrets locally","It needs cluster-admin permissions to function"],"a":[0],"e":"Control plane components are clients of the API server and should follow the same credential, TLS, and least-privilege discipline as any other client."},{"id":"kcsa-comp13","d":"comp","q":"What is the security relevance of the container runtime (for example containerd with runc)?","o":["It creates the container's namespaces, cgroups, seccomp and capability settings, so a vulnerability or misconfiguration there can lead to container escape","It is responsible for RBAC","It encrypts etcd","It manages Ingress certificates"],"a":[0],"e":"Runtime CVEs such as the historic runc file-descriptor escape show why runtimes must be kept patched and configured with secure defaults."},{"id":"kcsa-comp14","d":"comp","q":"Why are kube-proxy's kubeconfig file permissions and ownership part of the CIS benchmark?","o":["Because the kubeconfig contains credentials for the API server; world-readable files let any local process impersonate kube-proxy","Because kube-proxy stores Secrets","Because kube-proxy signs images","Because kube-proxy runs the scheduler"],"a":[0],"e":"File permission checks (typically 600 or stricter, owned by root) appear throughout the benchmark for every component's kubeconfig and certificate files."},{"id":"kcsa-comp15","d":"comp","q":"How does Pod Security Admission (PSA) apply policy?","o":["Through namespace labels such as pod-security.kubernetes.io/enforce: restricted, with separate enforce, audit, and warn modes","Through a cluster-wide PodSecurityPolicy object","Through NetworkPolicy annotations","Through kubelet flags only"],"a":[0],"e":"PSA replaced PodSecurityPolicy (removed in 1.25). Labels on a namespace select the profile and mode; audit and warn allow safe rollout before enforcing."},{"id":"kcsa-comp16","d":"comp","q":"Which Pod settings are prohibited by the Baseline Pod Security Standard? (Choose TWO.)","o":["privileged: true containers","hostNetwork, hostPID, or hostIPC sharing","Running as a non-root user","Dropping all capabilities","Setting a seccomp profile"],"a":[0,1],"e":"Baseline blocks known privilege escalations: privileged mode, host namespaces, hostPath volumes, most added capabilities, and unsafe sysctls. Restricted goes further by requiring non-root, dropped capabilities, and seccomp."},{"id":"kcsa-comp17","d":"comp","q":"Why is a default-deny NetworkPolicy a recommended starting point for cluster networking security?","o":["Kubernetes allows all Pod-to-Pod traffic by default, so explicit allow rules on top of default deny implement least privilege for the network","Because NetworkPolicies are enforced by the API server","Because it encrypts traffic","Because it blocks the kubelet"],"a":[0],"e":"A policy with an empty podSelector and policyTypes Ingress and Egress in a namespace denies everything, after which only needed flows are allowed."},{"id":"kcsa-comp18","d":"comp","q":"A cluster has NetworkPolicies defined, but traffic that should be blocked still flows. What is the MOST likely cause?","o":["The installed CNI plugin does not enforce NetworkPolicy (for example plain Flannel)","NetworkPolicies require a service mesh","The policies must be in kube-system","NetworkPolicies only apply to NodePort Services"],"a":[0],"e":"NetworkPolicy is an API; enforcement is the CNI's job. Calico, Cilium, and others enforce it; some simple plugins do not."},{"id":"kcsa-comp19","d":"comp","q":"Which practices protect kubectl client access to the cluster? (Choose TWO.)","o":["Use short-lived credentials (OIDC tokens or rotated certificates) instead of long-lived admin certificates","Protect kubeconfig files with strict permissions and never commit them to source control","Share a single cluster-admin kubeconfig across the team","Disable TLS verification in kubeconfig for convenience","Store kubeconfig in a public S3 bucket for easy access"],"a":[0,1],"e":"The kubeconfig is a credential. Individual identities with RBAC, short token lifetimes, and MFA at the identity provider give accountability and limit damage from leaks."},{"id":"kcsa-comp20","d":"comp","q":"What is a security concern with hostPath volumes?","o":["They expose node filesystem paths to a Pod, which can allow reading host secrets, tampering with the kubelet, or escaping the container","They are slower than emptyDir","They require a StorageClass","They cannot be mounted read-only"],"a":[0],"e":"hostPath is blocked by the Baseline profile. If unavoidable, use read-only mounts of narrowly scoped paths and admission policies limiting them."},{"id":"kcsa-comp21","d":"comp","q":"How can persistent storage be protected in a Kubernetes cluster? (Choose TWO.)","o":["Use CSI drivers or cloud storage that encrypt volumes at rest","Restrict access to PersistentVolumeClaims and StorageClasses with RBAC and prevent cross-namespace mounting","Mount all volumes with hostPath for performance","Disable encryption to allow snapshots","Store Secrets on the volume in plaintext for easy access"],"a":[0,1],"e":"Volume encryption, RBAC on storage objects, and careful reclaim policies (so deleted claims do not leave data behind) are the main storage controls."},{"id":"kcsa-comp22","d":"comp","q":"Why should ServiceAccount token automounting be disabled for Pods that do not call the Kubernetes API?","o":["An attacker who compromises the container could otherwise use the mounted token to query or modify the API with the ServiceAccount's permissions","Tokens slow down Pod startup","Tokens are needed only by DaemonSets","Automounting is required for networking"],"a":[0],"e":"Set automountServiceAccountToken: false on the ServiceAccount or Pod. Since 1.24, tokens are also projected and time-bound rather than long-lived Secrets."},{"id":"kcsa-comp23","d":"comp","q":"What does the NodeRestriction admission plugin prevent?","o":["A kubelet from modifying nodes or Pods other than its own, or from setting labels that would let it attract sensitive workloads","Users from creating Pods","Pods from using NodePort","Nodes from being drained"],"a":[0],"e":"NodeRestriction complements the Node authorizer by limiting which objects and labels a node identity can change, containing a compromised node."},{"id":"kcsa-comp24","d":"comp","q":"Which API server flags relate to protecting traffic in transit? (Choose TWO.)","o":["--tls-cert-file and --tls-private-key-file for serving TLS","--kubelet-client-certificate and --kubelet-client-key for authenticating to kubelets","--insecure-port=8080 to allow plain HTTP","--audit-log-maxage","--enable-admission-plugins"],"a":[0,1],"e":"All API server traffic should be TLS: clients to the API server and the API server to kubelets and etcd. The insecure port was removed in recent versions."},{"id":"kcsa-comp25","d":"comp","q":"What is the risk of exposing the Kubernetes dashboard or API server directly to the internet?","o":["Automated scanners constantly probe for exposed clusters; any authentication or RBAC weakness becomes immediately exploitable, as seen in cryptomining compromises","None, as TLS prevents all attacks","It only affects logging","It is required for kubectl to work"],"a":[0],"e":"Restrict the API server to private networks or allow-listed IPs, require strong authentication, and never run dashboards with privileged ServiceAccounts."},{"id":"kcsa-comp26","d":"comp","q":"What is the role of the certificate authority (CA) in cluster component security?","o":["The cluster CA signs certificates for the API server, kubelets, etcd, and clients, establishing mutual trust; compromise of the CA key allows forging any identity","The CA stores container images","The CA replaces RBAC","The CA runs admission webhooks"],"a":[0],"e":"CA private keys must be tightly protected and certificates rotated; tools like kubeadm and cert-manager help manage the cluster PKI."},{"id":"kcsa-fund01","d":"fund","q":"Which three profiles are defined by the Pod Security Standards?","o":["Privileged, Baseline, Restricted","Low, Medium, High","Default, Secure, Hardened","Open, Audit, Enforce"],"a":[0],"e":"Privileged is unrestricted, Baseline prevents known privilege escalations, and Restricted applies current hardening best practices such as non-root and dropped capabilities."},{"id":"kcsa-fund02","d":"fund","q":"A team wants to see which Pods would violate the Restricted profile before blocking them. Which Pod Security Admission mode should they use first?","o":["warn and audit modes, then switch to enforce once violations are fixed","enforce immediately","privileged mode","dry-run mode on the kubelet"],"a":[0],"e":"warn returns a warning to the user; audit records a violation in the audit log; enforce rejects the Pod. Rolling out through warn/audit avoids breaking workloads."},{"id":"kcsa-fund03","d":"fund","q":"Which securityContext settings are required by the Restricted Pod Security Standard? (Choose TWO.)","o":["allowPrivilegeEscalation: false","Dropping ALL capabilities (optionally adding back only NET_BIND_SERVICE)","privileged: true","hostNetwork: true","runAsUser: 0"],"a":[0,1],"e":"Restricted also requires runAsNonRoot: true, a seccomp profile of RuntimeDefault or Localhost, and only a limited set of volume types."},{"id":"kcsa-fund04","d":"fund","q":"What is the difference between a normal user and a ServiceAccount in Kubernetes authentication?","o":["Normal users are managed outside Kubernetes (certificates, OIDC) and have no API object; ServiceAccounts are Kubernetes objects used by Pods and processes","ServiceAccounts are for humans; users are for Pods","Both are stored as User objects in etcd","Users cannot be bound to RBAC roles"],"a":[0],"e":"Humans should authenticate through an identity provider; workloads use ServiceAccounts with namespaced tokens, each bound to least-privilege roles."},{"id":"kcsa-fund05","d":"fund","q":"In RBAC, what does a RoleBinding do?","o":["It grants the permissions defined in a Role (or ClusterRole) to subjects such as users, groups, or ServiceAccounts within a namespace","It creates a new Role","It denies permissions to a user","It defines network rules"],"a":[0],"e":"Roles and ClusterRoles define permissions; bindings attach them to subjects. RBAC is purely additive: there are no deny rules, so unbound means no access."},{"id":"kcsa-fund06","d":"fund","q":"Why are the RBAC verbs escalate, bind, and impersonate considered dangerous?","o":["They allow a subject to grant themselves or others more permissions than they hold, or act as another identity, enabling privilege escalation","They delete namespaces","They disable the API server","They are harmless aliases of get"],"a":[0],"e":"Granting create on rolebindings plus bind, or escalate on roles, or impersonate on users, effectively hands out cluster-admin. Audit these permissions closely."},{"id":"kcsa-fund07","d":"fund","q":"Which permission should be reviewed urgently because it allows reading every Secret in the cluster?","o":["A ClusterRole with get or list on secrets bound cluster-wide","A Role with get on pods in one namespace","A RoleBinding to the view ClusterRole","list on configmaps"],"a":[0],"e":"Secrets access is the most sensitive RBAC permission; even list returns the data. Scope Secrets access to specific namespaces and resourceNames."},{"id":"kcsa-fund08","d":"fund","q":"Why should wildcard permissions (verbs: ['*'], resources: ['*']) be avoided in RBAC Roles?","o":["They grant access to resources and verbs that do not exist yet, violating least privilege and making future additions automatically accessible","They are rejected by the API server","They only work for ServiceAccounts","They disable audit logging"],"a":[0],"e":"Explicit, minimal rules are easier to review and do not silently expand as new resource types and CRDs are added."},{"id":"kcsa-fund09","d":"fund","q":"What is the recommended way to handle Secrets that applications need, beyond the built-in Secret object? (Choose TWO.)","o":["Enable encryption at rest for Secrets in etcd","Integrate an external secret manager (for example HashiCorp Vault or a cloud KMS) through the Secrets Store CSI driver or External Secrets Operator","Put the Secrets in ConfigMaps for simplicity","Commit Secrets to the application Git repository in plaintext","Pass Secrets as command-line arguments visible in ps"],"a":[0,1],"e":"External managers centralize rotation and auditing. Also prefer mounting Secrets as files over environment variables, which leak into logs and child processes."},{"id":"kcsa-fund10","d":"fund","q":"What is the benefit of marking a Secret or ConfigMap as immutable?","o":["It prevents accidental or malicious changes after creation and reduces API server load because the kubelet no longer watches it","It encrypts the data","It makes the Secret readable by everyone","It allows the Secret to be shared across namespaces"],"a":[0],"e":"immutable: true locks the object; changes require creating a new one, which fits an immutable-infrastructure workflow."},{"id":"kcsa-fund11","d":"fund","q":"Which mechanisms provide isolation and segmentation between tenants in a shared cluster? (Choose TWO.)","o":["Namespaces with RBAC and ResourceQuotas scoping each team's resources","NetworkPolicies restricting traffic between namespaces, plus node isolation with taints and affinity for sensitive workloads","A single shared namespace with labels per team","Giving each tenant cluster-admin in their own namespace","Running all tenants' Pods on the same node for efficiency"],"a":[0,1],"e":"Soft multi-tenancy combines namespaces, RBAC, quotas, NetworkPolicies, Pod Security, and node separation. Hard multi-tenancy for hostile tenants usually needs separate clusters or sandboxed runtimes."},{"id":"kcsa-fund12","d":"fund","q":"What does Kubernetes audit logging record?","o":["A chronological record of requests to the API server, including who did what, when, and from where, at a configurable level of detail","Application container stdout","Node kernel messages","Network packets between Pods"],"a":[0],"e":"Audit logs are the primary forensic source for cluster activity and should be shipped off-cluster and protected from tampering."},{"id":"kcsa-fund13","d":"fund","q":"Which audit policy levels exist, from least to most detailed?","o":["None, Metadata, Request, RequestResponse","Debug, Info, Warn, Error","Low, Medium, High, Critical","Off, Basic, Full, Verbose"],"a":[0],"e":"Metadata logs who, what, and when; Request adds the request body; RequestResponse adds the response. Secrets should be logged at Metadata to avoid writing their contents."},{"id":"kcsa-fund14","d":"fund","q":"A NetworkPolicy should allow Pods labeled app=frontend to send traffic to Pods labeled app=backend on port 8080 and deny everything else to the backend. Which policy structure is correct?","o":["A policy selecting app=backend with policyTypes Ingress and an ingress rule from podSelector app=frontend on port 8080","A policy selecting app=frontend with an egress rule to 0.0.0.0/0","A policy with no podSelector and no rules","A Service of type LoadBalancer"],"a":[0],"e":"Policies are applied to the Pods in podSelector; selecting the backend with an ingress rule for the frontend allows only that path and implicitly denies other ingress."},{"id":"kcsa-fund15","d":"fund","q":"Why should egress NetworkPolicies be used in addition to ingress policies?","o":["To stop a compromised Pod from reaching external command-and-control servers, the cloud metadata endpoint, or other internal services it does not need","Because ingress policies are not supported","Because egress policies encrypt traffic","Because the kubelet requires them"],"a":[0],"e":"Egress control limits data exfiltration and lateral movement; blocking 169.254.169.254 from Pods is a well-known hardening step on cloud clusters."},{"id":"kcsa-fund16","d":"fund","q":"What does seccompProfile type RuntimeDefault do for a container?","o":["Applies the container runtime's default syscall filter, blocking dangerous or rarely used system calls to reduce the kernel attack surface","Runs the container in a VM","Disables all system calls","Grants all Linux capabilities"],"a":[0],"e":"seccomp filters syscalls; RuntimeDefault is required by the Restricted profile. Custom Localhost profiles can tighten further for specific apps."},{"id":"kcsa-fund17","d":"fund","q":"Which Linux capability is commonly needed to bind to ports below 1024 and can be added back after dropping ALL under the Restricted profile?","o":["NET_BIND_SERVICE","SYS_ADMIN","NET_RAW","SYS_PTRACE"],"a":[0],"e":"SYS_ADMIN is close to root and should never be granted; NET_RAW enables packet spoofing. Better still, run services on unprivileged ports."},{"id":"kcsa-fund18","d":"fund","q":"What are AppArmor and SELinux in the context of container security?","o":["Linux Security Modules that enforce mandatory access control profiles on what a container process may access, applied via Pod securityContext or annotations","Container image scanners","Kubernetes admission controllers","Network plugins"],"a":[0],"e":"LSMs add a kernel-level policy layer beyond discretionary permissions; Kubernetes can apply AppArmor profiles (securityContext.appArmorProfile) and SELinux options to containers."},{"id":"kcsa-fund19","d":"fund","q":"Why is sharing the host PID namespace (hostPID: true) dangerous?","o":["The container can see and interact with all processes on the node, enabling credential theft and attacks on the kubelet or other containers","It slows down the Pod","It prevents logging","It disables liveness probes"],"a":[0],"e":"hostPID, hostNetwork, and hostIPC break the isolation boundary and are all blocked by the Baseline profile."},{"id":"kcsa-fund20","d":"fund","q":"What should be used to prevent Pods from pulling images from untrusted registries?","o":["An admission policy (for example Kyverno, Gatekeeper, or ImagePolicyWebhook) that allows only approved registries and verifies signatures","A NetworkPolicy on the kubelet","A LimitRange","Disabling imagePullSecrets"],"a":[0],"e":"Registry allow-lists and signature verification at admission stop unapproved images before they run, regardless of who applied the manifest."},{"id":"kcsa-fund21","d":"fund","q":"Which Kubernetes feature grants a Pod a cryptographically verifiable identity usable for authenticating to external services such as a cloud IAM?","o":["Projected ServiceAccount tokens with a specific audience (OIDC-federated workload identity)","The Pod IP address","The node's SSH key","A ConfigMap containing a password"],"a":[0],"e":"Bound ServiceAccount tokens are short-lived JWTs with audience and expiry; cloud providers federate them to IAM roles, removing static credentials from Pods."},{"id":"kcsa-fund22","d":"fund","q":"A developer needs to debug a Pod and asks for exec permissions. What is the security consideration?","o":["pods/exec gives interactive access inside containers (including to mounted Secrets and tokens), so it should be granted narrowly and audited","Exec is read-only and safe to grant broadly","Exec requires cluster-admin anyway","Exec bypasses audit logging"],"a":[0],"e":"Exec, attach, and port-forward are sensitive subresources; prefer ephemeral debug containers in non-production and log every use."},{"id":"kcsa-fund23","d":"fund","q":"What does the Kubernetes built-in ClusterRole named view allow?","o":["Read-only access to most namespaced objects, excluding Secrets","Full access to all resources","Read and write access to Pods only","Access to nodes and PersistentVolumes"],"a":[0],"e":"The default aggregated roles are view, edit, admin, and cluster-admin. view deliberately excludes Secrets; edit can read Secrets, so it is more powerful than it sounds."},{"id":"kcsa-fund24","d":"fund","q":"Which statement about Kubernetes ServiceAccount tokens since version 1.24 is correct?","o":["Tokens are no longer auto-created as long-lived Secrets; Pods receive time-bound, projected tokens that are automatically rotated","Every ServiceAccount still gets a permanent Secret token by default","Tokens never expire","Tokens are stored in ConfigMaps"],"a":[0],"e":"Bound tokens reduce the damage from leaks. Long-lived tokens can still be created manually but should be avoided."},{"id":"kcsa-fund25","d":"fund","q":"Why is it important to set resource requests and limits from a security perspective?","o":["Without limits, a compromised or buggy Pod can exhaust node CPU or memory and cause a denial of service for other workloads","Limits encrypt container memory","Requests prevent image pulls","They are required for RBAC"],"a":[0],"e":"Resource exhaustion is part of the Kubernetes threat model; LimitRanges and ResourceQuotas enforce bounds even when developers forget them."},{"id":"kcsa-fund26","d":"fund","q":"Which approach provides isolation for a workload that must handle untrusted user-submitted code?","o":["Run it with a sandboxed RuntimeClass (gVisor or Kata), the Restricted profile, strict NetworkPolicies, and on dedicated nodes","Run it as a privileged Pod on a shared node","Disable seccomp for compatibility","Mount the host filesystem read-only"],"a":[0],"e":"Untrusted code is where the container boundary is weakest; combine a stronger runtime boundary with node and network isolation."},{"id":"kcsa-threat01","d":"threat","q":"What is a trust boundary in a Kubernetes threat model?","o":["A point where data or control passes between components with different levels of trust, such as from an untrusted user to the API server or from a Pod to the kubelet","A physical firewall between datacenters","The edge of a namespace's ResourceQuota","The expiry time of a certificate"],"a":[0],"e":"Threat modelling maps data flows and trust boundaries (external, control plane, node, Pod) to find where authentication, authorization, and validation must happen."},{"id":"kcsa-threat02","d":"threat","q":"An attacker gains code execution in a Pod and reads the mounted ServiceAccount token bound to a role that can create Pods in kube-system. Which threat does this represent?","o":["Privilege escalation leading to cluster compromise, by creating a privileged Pod with hostPath to the node","Denial of service","Network sniffing","Image tampering"],"a":[0],"e":"Pod-creation rights in a privileged namespace are effectively node and cluster takeover. Least-privilege ServiceAccounts and Pod Security enforcement break this chain."},{"id":"kcsa-threat03","d":"threat","q":"Which technique allows an attacker in a privileged container to escape to the host?","o":["Mounting the host's block devices or filesystem, since privileged containers have all capabilities and device access","Reading a ConfigMap","Using a ClusterIP Service","Listing Pods with kubectl"],"a":[0],"e":"privileged: true removes almost every isolation control. Blocking it via Pod Security Admission or policy engines is the primary mitigation."},{"id":"kcsa-threat04","d":"threat","q":"What is the MITRE ATT&CK framework for containers used for?","o":["Cataloguing adversary tactics and techniques (initial access, execution, persistence, privilege escalation, and so on) specific to container and Kubernetes environments, to guide detection and defense","Scanning images for CVEs","Defining Kubernetes API versions","Benchmarking cluster performance"],"a":[0],"e":"Mapping controls and detections to ATT&CK techniques helps teams find coverage gaps across the attack lifecycle."},{"id":"kcsa-threat05","d":"threat","q":"Which of the following are persistence techniques an attacker might use after compromising a cluster? (Choose TWO.)","o":["Creating a CronJob or DaemonSet that re-launches a malicious Pod","Adding a backdoor to a container image in the registry or creating a hidden ClusterRoleBinding","Running kubectl get pods","Reading the cluster version","Deleting their own Pod"],"a":[0,1],"e":"Persistence abuses legitimate Kubernetes features. Monitoring for unexpected workloads, RBAC changes, and image changes (with signing) detects it."},{"id":"kcsa-threat06","d":"threat","q":"How can an attacker cause denial of service in a Kubernetes cluster without any exploit?","o":["By launching Pods without resource limits or large numbers of objects that exhaust node resources or API server and etcd capacity","By reading audit logs","By listing namespaces","By using a ClusterIP Service"],"a":[0],"e":"ResourceQuotas, LimitRanges, API priority and fairness, and rate limiting at ingress mitigate resource-exhaustion DoS."},{"id":"kcsa-threat07","d":"threat","q":"A vulnerable web application in a Pod is exploited and the attacker runs commands inside the container. Which controls limit what the attacker can do next? (Choose TWO.)","o":["Running the container as non-root with a read-only root filesystem and minimal capabilities","Egress NetworkPolicies and no automounted ServiceAccount token","Giving the Pod hostNetwork for faster response","Mounting the Docker socket into the Pod","Using the latest image tag"],"a":[0,1],"e":"Hardened containers and restricted network and API access confine the compromise; a mounted container-runtime socket would instead hand over the whole node."},{"id":"kcsa-threat08","d":"threat","q":"What threat does an attacker with access to the cluster network (but not to any Pod) pose?","o":["Probing unauthenticated endpoints such as the kubelet API, metrics, dashboards, or etcd, and sniffing unencrypted Pod-to-Pod traffic","None, because the network is inside the cluster","Only reading public container images","Only increasing latency"],"a":[0],"e":"The threat model assumes a hostile network. TLS everywhere, mTLS between workloads, and authenticated component APIs are the countermeasures."},{"id":"kcsa-threat09","d":"threat","q":"Where might sensitive data be unintentionally exposed in a Kubernetes environment? (Choose TWO.)","o":["Secrets passed as environment variables, which appear in process listings, crash dumps, and logs","etcd backups and audit logs at RequestResponse level that capture Secret contents","Immutable ConfigMaps","Readiness probes","The kube-scheduler profiling endpoint"],"a":[0,1],"e":"Treat backups and logs as sensitive as the cluster itself, mount Secrets as files, and set audit level Metadata for Secrets."},{"id":"kcsa-threat10","d":"threat","q":"What is lateral movement in a Kubernetes attack?","o":["Moving from an initial compromised Pod to other Pods, nodes, or cloud resources using network access, stolen tokens, or node credentials","Scaling a Deployment horizontally","Moving Pods between namespaces with kubectl","Rolling update of a DaemonSet"],"a":[0],"e":"Flat networks and over-privileged ServiceAccounts make lateral movement easy; NetworkPolicy, mTLS, and least-privilege identities constrain it."},{"id":"kcsa-threat11","d":"threat","q":"Why is the cloud instance metadata endpoint (169.254.169.254) a target for an attacker inside a Pod?","o":["It can return the node's cloud IAM credentials, which may grant access to storage, registries, or even the Kubernetes API","It hosts the container images","It controls the kube-scheduler","It stores application Secrets"],"a":[0],"e":"Block metadata access from Pods with NetworkPolicy or provider features (IMDSv2 hop limits, GKE metadata concealment) and use workload identity instead of node roles."},{"id":"kcsa-threat12","d":"threat","q":"Which supply chain attack scenario is specific to container workloads?","o":["A malicious or vulnerable base image or dependency is pulled into the build and deployed to production through a trusted pipeline","A DDoS against the ingress","A brute-force attack on SSH","A phishing email to an administrator"],"a":[0],"e":"Supply chain controls include pinning by digest, scanning, SBOMs, signing and verifying images, and hardening the CI system itself."},{"id":"kcsa-threat13","d":"threat","q":"What is the risk of a compromised CI/CD system in a GitOps or pipeline-based deployment?","o":["It can inject malicious images or manifests that the cluster deploys with full trust, bypassing many runtime controls","It only affects build speed","It cannot reach the cluster","It affects only the test environment"],"a":[0],"e":"Pipelines hold powerful credentials. Protect them with least privilege, signed commits and artifacts, and admission-time verification so the cluster does not blindly trust the pipeline."},{"id":"kcsa-threat14","d":"threat","q":"Which Kubernetes feature could an attacker abuse to run code on every node at once if they can create workloads in a privileged namespace?","o":["A DaemonSet with a privileged container","A ConfigMap","A ClusterIP Service","A ResourceQuota"],"a":[0],"e":"DaemonSets schedule onto all nodes by design; combined with privileged mode or hostPath they give node-wide compromise, which is why workload creation rights must be guarded."},{"id":"kcsa-threat15","d":"threat","q":"What is a container breakout?","o":["An attack where a process escapes the container's isolation and gains access to the host operating system or other containers","A container that restarts repeatedly","A container with too many replicas","A Pod evicted from a node"],"a":[0],"e":"Breakouts exploit kernel or runtime vulnerabilities or misconfigurations (privileged, hostPath, dangerous capabilities). Keeping kernels and runtimes patched and using sandboxes reduces the risk."},{"id":"kcsa-threat16","d":"threat","q":"A ServiceAccount token stolen from a Pod is being used from outside the cluster. Which controls reduce this risk? (Choose TWO.)","o":["Short-lived, audience-bound projected tokens so stolen tokens expire quickly","Restricting API server network access and monitoring audit logs for unusual source IPs or user agents","Granting the ServiceAccount cluster-admin so it can respond faster","Disabling TLS on the API server","Using long-lived tokens stored in Git"],"a":[0,1],"e":"Token lifetime, network reachability of the API, and anomaly detection in audit logs are the main defenses against credential theft."},{"id":"kcsa-threat17","d":"threat","q":"What is the security concern with a Pod that mounts the container runtime socket (for example /run/containerd/containerd.sock)?","o":["Access to the runtime socket allows starting arbitrary privileged containers on the node, which is equivalent to root on the host","The socket slows down networking","The socket is read-only and harmless","It only affects logging"],"a":[0],"e":"CI runners and some tools request this mount; treat it as granting node root and isolate such workloads strictly."},{"id":"kcsa-threat18","d":"threat","q":"How does STRIDE help in threat modelling a Kubernetes application?","o":["It provides categories (Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege) to systematically identify threats at each trust boundary","It scans images for malware","It replaces RBAC","It defines Pod Security profiles"],"a":[0],"e":"STRIDE is a general threat-modelling framework; MITRE ATT&CK for Containers complements it with concrete adversary techniques."},{"id":"kcsa-threat19","d":"threat","q":"Which indicator in audit logs or runtime monitoring most strongly suggests a compromised workload?","o":["A Pod spawning an unexpected shell, reading /var/run/secrets, or calling the API to create a privileged Pod","A liveness probe failing once","A normal rolling update","A ConfigMap being read at startup"],"a":[0],"e":"Runtime security tools such as Falco and audit log analysis flag anomalous process, file, and API activity that matches known attack techniques."},{"id":"kcsa-plat01","d":"plat","q":"What is a Software Bill of Materials (SBOM)?","o":["A machine-readable inventory of the components, libraries, and versions inside a software artifact such as a container image, used for vulnerability tracking and compliance","A list of Kubernetes nodes","A Helm values file","A cost report"],"a":[0],"e":"SBOM formats include SPDX and CycloneDX; tools like Syft generate them and scanners like Grype or Trivy match them against vulnerability databases."},{"id":"kcsa-plat02","d":"plat","q":"What is SLSA (Supply-chain Levels for Software Artifacts)?","o":["A framework of graded levels describing how trustworthy a build process is, based on provenance, build integrity, and source controls","A container runtime","A Kubernetes admission controller","A network encryption protocol"],"a":[0],"e":"Higher SLSA levels require signed, verifiable provenance from hardened, isolated builds so consumers can trust where an artifact came from."},{"id":"kcsa-plat03","d":"plat","q":"Which tool from the Sigstore project is used to sign and verify container images?","o":["Cosign","Trivy","Falco","kube-bench"],"a":[0],"e":"Cosign signs images and stores signatures in the registry; keyless signing uses Fulcio certificates and the Rekor transparency log. Admission policies can require valid signatures."},{"id":"kcsa-plat04","d":"plat","q":"How is image signature verification enforced so that unsigned images cannot run in the cluster?","o":["Through an admission controller or policy engine (for example Kyverno verifyImages or the Sigstore policy-controller) that checks signatures before Pods are admitted","By the kubelet refusing images without a tag","By the container registry rejecting pulls","By NetworkPolicy"],"a":[0],"e":"Signing is only useful with verification at the point of deployment; admission control is where that gate lives."},{"id":"kcsa-plat05","d":"plat","q":"Which open source tools scan container images for known vulnerabilities? (Choose TWO.)","o":["Trivy","Grype (with Syft for SBOMs) or Clair","Falco","kube-bench","Istio"],"a":[0,1],"e":"Image scanners compare packages in image layers against CVE databases and should run in CI, in the registry, and periodically for already-deployed images."},{"id":"kcsa-plat06","d":"plat","q":"What is Falco?","o":["A CNCF runtime security tool that detects anomalous behavior in containers and nodes, such as shells spawned in containers or sensitive file reads, using kernel-level events","An image scanner","A GitOps controller","A service mesh"],"a":[0],"e":"Falco uses eBPF or a kernel module to observe syscalls and matches them against rules, providing detection after a workload is running."},{"id":"kcsa-plat07","d":"plat","q":"How does a service mesh improve platform security?","o":["It provides mutual TLS between services with cryptographic workload identities, fine-grained authorization policies, and telemetry, without changing application code","It scans images","It replaces NetworkPolicy entirely","It manages etcd encryption"],"a":[0],"e":"Meshes such as Istio and Linkerd encrypt and authenticate east-west traffic (zero trust); they complement rather than replace network-layer policies."},{"id":"kcsa-plat08","d":"plat","q":"What is the role of PKI in a Kubernetes platform?","o":["Issuing and rotating TLS certificates for control plane components, workloads, and ingress so that identities can be verified and traffic encrypted","Storing container images","Scheduling Pods","Managing resource quotas"],"a":[0],"e":"cert-manager automates certificate issuance from internal CAs or public issuers like Let's Encrypt, and short lifetimes with rotation limit the impact of key compromise."},{"id":"kcsa-plat09","d":"plat","q":"Which CNCF project automates the issuance and renewal of TLS certificates in Kubernetes?","o":["cert-manager","Cosign","Kyverno","Harbor"],"a":[0],"e":"cert-manager uses Issuer and Certificate CRDs to obtain certificates (ACME, Vault, internal CA) and stores them in Secrets for Ingress and workloads."},{"id":"kcsa-plat10","d":"plat","q":"What is the purpose of admission controllers such as OPA Gatekeeper or Kyverno in platform security?","o":["To enforce organization policies on every resource at admission time, such as requiring labels, blocking privileged containers, restricting registries, or mutating defaults","To scan nodes for malware","To encrypt Secrets","To provide DNS"],"a":[0],"e":"Policy-as-code at admission is the enforcement point for guardrails that Pod Security Admission alone does not cover."},{"id":"kcsa-plat11","d":"plat","q":"Which secret management practices strengthen a Kubernetes platform? (Choose TWO.)","o":["Using an external secret store (Vault, cloud secret managers) with the Secrets Store CSI driver or External Secrets Operator","Encrypting Secrets at rest with a KMS provider and rotating credentials regularly","Storing Secrets in container images","Granting all ServiceAccounts read access to Secrets","Logging Secret values for debugging"],"a":[0,1],"e":"Centralized stores give rotation, auditing, and dynamic credentials; KMS-backed encryption protects what remains in etcd."},{"id":"kcsa-plat12","d":"plat","q":"What is the security purpose of an ingress controller's TLS termination and WAF integration?","o":["To encrypt north-south traffic, present trusted certificates, and filter malicious HTTP requests before they reach workloads","To replace NetworkPolicy","To provide Pod-to-Pod encryption","To authenticate kubelets"],"a":[0],"e":"The ingress is the primary external attack surface; TLS, rate limiting, authentication, and WAF rules there protect every application behind it."},{"id":"kcsa-plat13","d":"plat","q":"How does observability support platform security?","o":["Centralized logs, metrics, traces, and audit events let teams detect anomalies, investigate incidents, and prove compliance","It prevents all attacks","It replaces encryption","It is only for performance tuning"],"a":[0],"e":"Shipping audit logs and Falco alerts to a SIEM, with alerting on suspicious patterns, turns telemetry into detection and response capability."},{"id":"kcsa-plat14","d":"plat","q":"What is the benefit of keyless signing with Sigstore in CI pipelines?","o":["Builds sign artifacts using short-lived certificates tied to the CI identity (OIDC), recorded in a public transparency log, so no long-lived signing keys need to be stored","It removes the need for verification","It encrypts the image contents","It makes images smaller"],"a":[0],"e":"Keyless signing eliminates key management risk and produces auditable provenance linking an artifact to the workflow that built it."},{"id":"kcsa-plat15","d":"plat","q":"What is a private, hardened container registry such as Harbor used for in platform security?","o":["Hosting images with access control, vulnerability scanning, signing, replication, and retention policies under the organization's control","Running containers","Enforcing NetworkPolicy","Storing etcd backups"],"a":[0],"e":"Harbor (a CNCF graduated project) integrates scanning (Trivy) and signature verification, and can block pulls of images that fail policy."},{"id":"kcsa-plat16","d":"plat","q":"Which approach gives workloads a verifiable identity across clusters and clouds, often used by service meshes?","o":["SPIFFE identities (SPIFFE IDs issued as SVIDs by SPIRE)","Static API keys in ConfigMaps","Node IP addresses","Pod names"],"a":[0],"e":"SPIFFE/SPIRE provide a standard for workload identity and short-lived X.509 or JWT SVIDs, enabling mTLS and zero-trust authorization independent of network location."},{"id":"kcsa-plat17","d":"plat","q":"What is the purpose of a RuntimeClass?","o":["To select a different container runtime handler for a Pod, such as gVisor or Kata, to apply stronger sandboxing to specific workloads","To set the kubelet version","To choose the Ingress controller","To pick a StorageClass"],"a":[0],"e":"RuntimeClass lets platform teams offer sandboxed runtimes alongside runc and assign them per workload via the Pod spec."},{"id":"kcsa-plat18","d":"plat","q":"Why should egress traffic from the cluster to the internet be controlled at the platform level?","o":["To prevent data exfiltration and command-and-control communication from compromised workloads, allowing only approved destinations","To speed up image pulls","Because Kubernetes requires it","To replace ingress TLS"],"a":[0],"e":"Egress gateways, NetworkPolicies with CIDR or FQDN rules, and DNS filtering implement outbound control."},{"id":"kcsa-plat19","d":"plat","q":"What is the difference between vulnerability scanning and runtime security?","o":["Scanning finds known weaknesses in images and configurations before or after deployment; runtime security detects actual malicious behavior while workloads are running","They are the same activity","Runtime security only applies to nodes","Scanning only works on source code"],"a":[0],"e":"Both are needed: scanners cannot catch zero-days or misuse of legitimate tools, and runtime tools cannot prevent a vulnerable image from being deployed."},{"id":"kcsa-compl01","d":"compl","q":"What is the CIS Kubernetes Benchmark?","o":["A consensus-based set of configuration recommendations for securing Kubernetes control plane, node, and policy settings, with scored checks","A performance benchmark for clusters","A certification exam","A list of CVEs"],"a":[0],"e":"The benchmark covers API server flags, etcd, kubelet, file permissions, RBAC, and policies; managed-service variants exist for EKS, GKE, and AKS."},{"id":"kcsa-compl02","d":"compl","q":"Which tool automates checking a cluster against the CIS Kubernetes Benchmark?","o":["kube-bench","kube-hunter","Trivy","Falco"],"a":[0],"e":"kube-bench runs the benchmark tests on nodes and reports pass, fail, and warn results. kube-hunter instead probes for exploitable weaknesses from an attacker's view."},{"id":"kcsa-compl03","d":"compl","q":"What does NIST Special Publication 800-190 cover?","o":["Application container security: risks and countermeasures for images, registries, orchestrators, containers, and host operating systems","Cloud cost management","Kubernetes networking internals","The OCI image format"],"a":[0],"e":"NIST SP 800-190 is a commonly referenced guide that organizes container security by component and aligns well with the 4Cs model."},{"id":"kcsa-compl04","d":"compl","q":"How does the NIST Cybersecurity Framework (CSF) relate to Kubernetes security operations?","o":["Its functions (Govern, Identify, Protect, Detect, Respond, Recover) provide an organizing structure for cluster security controls, monitoring, and incident response","It mandates specific kubelet flags","It is a Kubernetes admission controller","It only applies to on-premises datacenters"],"a":[0],"e":"The CSF is technology-neutral; mapping Kubernetes controls (RBAC, scanning, Falco, backups) to its functions shows coverage and gaps."},{"id":"kcsa-compl05","d":"compl","q":"A company processing credit card data runs workloads on Kubernetes. Which compliance framework defines the controls it must meet, and how does this affect the cluster?","o":["PCI DSS; it requires network segmentation, access control, logging, vulnerability management, and encryption, which map to NetworkPolicies, RBAC, audit logs, scanning, and TLS","GDPR; it requires all Pods to run as root","SOC 2; it prohibits containers","HIPAA; it only applies to nodes"],"a":[0],"e":"Compliance frameworks do not name Kubernetes features; teams must map requirements to cluster controls and provide evidence."},{"id":"kcsa-compl06","d":"compl","q":"Which practice supports proving compliance over time rather than at a single audit?","o":["Continuous, automated checks (kube-bench, policy engines in audit mode, Config-style scanners) with reports and audit logs retained as evidence","A one-time manual review of the cluster","Disabling audit logging to save storage","Relying on screenshots of the dashboard"],"a":[0],"e":"Automation turns compliance into a continuous control: drift is detected quickly and evidence is generated as a by-product."},{"id":"kcsa-compl07","d":"compl","q":"What is supply chain compliance in the context of SLSA and SBOMs?","o":["Demonstrating that artifacts were built from known sources by a trusted process, with provenance and component inventories available for verification and vulnerability response","Paying for container registry subscriptions","Using only images smaller than 100 MB","Running builds on developer laptops"],"a":[0],"e":"Regulations and customer requirements increasingly demand SBOMs and provenance, especially after high-profile supply chain attacks."},{"id":"kcsa-compl08","d":"compl","q":"Which tool simulates an attacker to find exploitable weaknesses in a running cluster, such as exposed dashboards or unauthenticated kubelet access?","o":["kube-hunter","kube-bench","Cosign","cert-manager"],"a":[0],"e":"kube-hunter performs active and passive hunting from inside or outside the cluster; it complements configuration benchmarking with an adversarial view."},{"id":"kcsa-compl09","d":"compl","q":"Why is audit log retention and integrity important for compliance?","o":["Auditors and incident responders need a tamper-evident record of who changed what in the cluster; logs must be shipped off-cluster, protected, and kept for the required period","Logs are needed to pull images","Audit logs speed up the scheduler","They replace RBAC"],"a":[0],"e":"Audit policies, log forwarding to immutable storage, and retention aligned with regulatory requirements are standard evidence controls."},{"id":"kcsa-compl10","d":"compl","q":"What is threat modelling, and when should it be done for a Kubernetes platform?","o":["A structured process to identify assets, trust boundaries, threats, and mitigations; it should be done during design and revisited when the architecture changes","A penetration test performed once a year","A vulnerability scan of images","A performance test of the API server"],"a":[0],"e":"Frameworks such as STRIDE and MITRE ATT&CK for Containers guide the exercise; the Kubernetes project itself publishes a threat model and security audit."},{"id":"kcsa-compl11","d":"compl","q":"Which statement about SOC 2 in relation to a Kubernetes platform is correct?","o":["SOC 2 reports on controls for security, availability, processing integrity, confidentiality, and privacy; cluster controls such as access management, change management, and monitoring provide the supporting evidence","SOC 2 requires a specific Kubernetes version","SOC 2 prohibits the use of managed Kubernetes services","SOC 2 only covers physical security"],"a":[0],"e":"Like other frameworks, SOC 2 is control-oriented; GitOps history, RBAC reviews, and audit logs commonly serve as evidence."},{"id":"kcsa-compl12","d":"compl","q":"How do policy-as-code tools help with both security and compliance?","o":["The same policies can be enforced at admission and evaluated in audit mode to produce compliance reports, and they can be version-controlled and reviewed like code","They encrypt data at rest","They replace vulnerability scanners","They are only useful during audits"],"a":[0],"e":"Kyverno and Gatekeeper produce policy reports; OPA policies can also run in CI, giving consistent rules from pipeline to cluster."},{"id":"kcsa-compl13","d":"compl","q":"What is Kubernetes Security Posture Management (KSPM)?","o":["Continuous assessment of cluster configuration against benchmarks and best practices, identifying misconfigurations, risky RBAC, and compliance gaps across clusters","A scheduler plugin","A type of container runtime","An image build tool"],"a":[0],"e":"KSPM tools aggregate benchmark results, RBAC analysis, and policy violations into a posture view, often alongside CSPM for the cloud layer."}]};</script>

<script>

// ---------- exam catalogue ----------
const EXAMS = [
  { code:'clf', vendor:'AWS', short:'CLF-C02', name:'Cloud Practitioner', n:65, minutes:90, passPct:70, file:'banks/clf.json',
    scoreNote:'AWS reports a scaled score from 100 to 1000 with 700 to pass and does not publish the mapping from raw answers. Treat 70% raw as the line and 80%+ as a comfortable margin.',

    domains:[ {key:'cc',name:'Cloud Concepts',short:'Cloud Concepts',weight:24},{key:'sec',name:'Security and Compliance',short:'Security',weight:30},{key:'tech',name:'Cloud Technology and Services',short:'Technology',weight:34},{key:'bill',name:'Billing, Pricing, and Support',short:'Billing',weight:12} ] },
  { code:'saa', vendor:'AWS', short:'SAA-C03', name:'Solutions Architect – Associate', n:65, minutes:130, passPct:72, file:'banks/saa.json',
    scoreNote:'AWS reports a scaled score from 100 to 1000 with 720 to pass and does not publish the mapping from raw answers. Treat 72% raw as the line and 80%+ as a comfortable margin.',

    domains:[ {key:'sec',name:'Design Secure Architectures',short:'Secure',weight:30},{key:'res',name:'Design Resilient Architectures',short:'Resilient',weight:26},{key:'perf',name:'Design High-Performing Architectures',short:'Performing',weight:24},{key:'cost',name:'Design Cost-Optimized Architectures',short:'Cost',weight:20} ] },
  { code:'soa', vendor:'AWS', short:'SOA-C03', name:'CloudOps Engineer – Associate', n:65, minutes:130, passPct:72, file:'banks/soa.json',
    scoreNote:'AWS reports a scaled score from 100 to 1000 with 720 to pass and does not publish the mapping from raw answers. Treat 72% raw as the line and 80%+ as a comfortable margin.',
    format:'65 questions (50 scored + 15 unscored) · 130 min · 720/1000 to pass',
    domains:[ {key:'mon',name:'Monitoring, Logging, Analysis, Remediation, and Performance Optimization',short:'Monitoring',weight:22},{key:'rel',name:'Reliability and Business Continuity',short:'Reliability',weight:22},{key:'dep',name:'Deployment, Provisioning, and Automation',short:'Deployment',weight:22},{key:'sec',name:'Security and Compliance',short:'Security',weight:16},{key:'net',name:'Networking and Content Delivery',short:'Networking',weight:18} ] },
  { code:'kcna', vendor:'CNCF', short:'KCNA', name:'Kubernetes and Cloud Native Associate', n:60, minutes:90, passPct:75, file:'banks/kcna.json',
    scoreNote:'The Linux Foundation scores KCNA as a raw percentage with 75% to pass, so this line is the real one. The exam is multiple choice only; hands-on tasks start at CKA.',
    format:'60 questions · 90 min · 75% to pass',
    domains:[ {key:'fund',name:'Kubernetes Fundamentals',short:'Fundamentals',weight:44},{key:'orch',name:'Container Orchestration',short:'Orchestration',weight:28},{key:'deliv',name:'Cloud Native Application Delivery',short:'Delivery',weight:16},{key:'arch',name:'Cloud Native Architecture',short:'Architecture',weight:12} ] },
  { code:'kcsa', vendor:'CNCF', short:'KCSA', name:'Kubernetes and Cloud Native Security Associate', n:60, minutes:90, passPct:75, file:'banks/kcsa.json',

    format:'60 questions · 90 min · 75% to pass',
    domains:[ {key:'over',name:'Overview of Cloud Native Security',short:'Overview',weight:14},{key:'comp',name:'Kubernetes Cluster Component Security',short:'Components',weight:22},{key:'fund',name:'Kubernetes Security Fundamentals',short:'Fundamentals',weight:22},{key:'threat',name:'Kubernetes Threat Model',short:'Threats',weight:16},{key:'plat',name:'Platform Security',short:'Platform',weight:16},{key:'compl',name:'Compliance and Security Frameworks',short:'Compliance',weight:10} ] }
];
EXAMS.forEach(ex => ex.domains.forEach((d,i) => { d.css = 'var(--d'+(i+1)+')'; }));
const EX = {}; EXAMS.forEach(e => EX[e.code] = e);

const BANKS = {};   // code -> array of questions
const QBY = {};     // code -> id -> question
const LETTERS = 'ABCDE';
const LS_KEY = 'cert-mock-state-v2';

let state = { view:'hub', exam:null, attempts:{}, history:{}, lastUsed:{}, reviewing:false, confirming:false, filter:'all', startMode:'exam', avoidRepeat:true };
let timerId = null;
const app = document.getElementById('app');

// ---------- storage ----------
function lsGet(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function persist(){
  const attempts = {}; for (const c in state.attempts){ const a = state.attempts[c]; if (a && !a.submittedAt) attempts[c] = a; }
  lsSet(LS_KEY, { attempts, history:state.history, lastUsed:state.lastUsed, startMode:state.startMode, avoidRepeat:state.avoidRepeat });
}
function migrateV1(){
  // carry over the first version's Cloud Practitioner history
  const h = lsGet('cp-mock-history-v1'); if (Array.isArray(h) && h.length && !(state.history.clf||[]).length) state.history.clf = h;
}

// ---------- helpers ----------
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtClock(ms){ const s = Math.max(0, Math.round(ms/1000)); return pad(Math.floor(s/3600)*60 + Math.floor((s%3600)/60)) + ':' + pad(s%60); }
function fmtDur(ms){ const s = Math.max(0, Math.round(ms/1000)); const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60; return h ? (h+'h '+m+'m') : (m+'m '+pad(sec)+'s'); }
function fmtDate(ts){ const d = new Date(ts); return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function sameSet(a,b){ if(a.length!==b.length) return false; const x=[...a].sort(), y=[...b].sort(); return x.every((v,i)=>v===y[i]); }
function shuffle(arr){ const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function exam(){ return EX[state.exam]; }
function attempt(){ return state.attempts[state.exam] || null; }
function dom(ex, key){ return ex.domains.find(d=>d.key===key) || ex.domains[0]; }
function qById(code, id){ return QBY[code][id]; }
function qAt(i){ return qById(state.exam, attempt().qids[i]); }
function total(){ return attempt().qids.length; }
function selOf(q){ return attempt().answers[q.id] || []; }
function answeredCount(){ const a = attempt(); return a.qids.filter(id => (a.answers[id]||[]).length>0).length; }
function flaggedCount(){ return Object.keys(attempt().flags).length; }
function isCorrect(q){ return sameSet(selOf(q), q.a); }
function histOf(code){ return state.history[code] || []; }
function bestOf(code){ const h = histOf(code); return h.length ? Math.max(...h.map(x=>x.pct)) : null; }

// ---------- sampling ----------
function allocate(domains, N){
  const raw = domains.map(d => d.weight/100*N), base = raw.map(Math.floor);
  let rem = N - base.reduce((s,v)=>s+v,0);
  const order = raw.map((v,i)=>({i, frac:v-base[i]})).sort((x,y)=>y.frac-x.frac);
  for (let k=0;k<rem;k++) base[order[k%order.length].i]++;
  const out = {}; domains.forEach((d,i)=>out[d.key]=base[i]); return out;
}
function sampleIds(ex, avoid){
  const bank = BANKS[ex.code]; const counts = allocate(ex.domains, ex.n);
  const used = new Set(avoid ? (state.lastUsed[ex.code]||[]) : []);
  let picked = [];
  for (const d of ex.domains){
    const pool = shuffle(bank.filter(q=>q.d===d.key));
    const fresh = pool.filter(q=>!used.has(q.id)), seen = pool.filter(q=>used.has(q.id));
    picked = picked.concat(fresh.concat(seen).slice(0, counts[d.key]));
  }
  return shuffle(picked).map(q=>q.id);
}
function newAttempt(ex, mode){
  const now = Date.now();
  const qids = sampleIds(ex, state.avoidRepeat);
  const perm = {}; qids.forEach(id => { perm[id] = shuffle(qById(ex.code, id).o.map((_,i)=>i)); });   // options are shown in a fresh order each attempt
  return { exam:ex.code, mode, qids, perm, answers:{}, flags:{}, checked:{}, cur:0, startedAt:now, endsAt: mode==='exam' ? now + ex.minutes*60000 : null, submittedAt:null, result:null };
}
function permOf(a, q){ return (a.perm && a.perm[q.id]) || q.o.map((_,i)=>i); }
function answerLetters(a, q){ const p = permOf(a, q); return q.a.map(orig => LETTERS[p.indexOf(orig)]).sort().join(' and '); }
function grade(a){
  const ex = EX[a.exam]; const perDomain = {}; ex.domains.forEach(d => perDomain[d.key] = {correct:0,total:0});
  let correct = 0, answered = 0;
  for (const id of a.qids){ const q = qById(a.exam, id); const sel = a.answers[id]||[]; const ok = sameSet(sel, q.a);
    perDomain[q.d].total++; if (sel.length) answered++; if (ok){ correct++; perDomain[q.d].correct++; } }
  return { correct, answered, total:a.qids.length, pct: Math.round(correct/a.qids.length*100), perDomain, timeUsed: a.submittedAt - a.startedAt };
}

// ---------- rendering ----------
function render(){
  stopTimer();
  if (state.view==='hub') renderHub();
  else if (state.view==='start') renderStart();
  else if (state.view==='exam') { state.reviewing ? renderReview() : renderExam(); }
  else renderResults();
}

}

function topbarHTML(){

  const i = a.cur, q = qAt(i), d = dom(ex, q.d);
  const flagged = !!a.flags[q.id];
  return `
  <div class="topbar-in">
    <span class="counter"><span class="hide-sm">${esc(ex.short)} · </span>Q ${pad(i+1)} <small>/ ${total()}</small></span>
    <span class="chip d hide-sm" style="--dc:${d.css}">${esc(d.short)}</span>
    <span class="grow"></span>
    <span class="timer" id="timer" aria-live="off">${a.mode==='exam' ? fmtClock(a.endsAt-Date.now()) : fmtClock(Date.now()-a.startedAt)}</span>
    <button class="btn sm ${flagged?'on':''}" data-act="flag" id="flagbtn" aria-pressed="${flagged}">${flagged?'Flagged':'Flag'}</button>

  </div>
  <div class="progress"><i style="width:${Math.round(answeredCount()/total()*100)}%"></i></div>`;
}

function optionsHTML(q, sel, mode, perm){
  const multi = q.a.length>1; perm = perm || q.o.map((_,i)=>i);
  return `<div class="opts" role="${multi?'group':'radiogroup'}">${perm.map((orig,j)=>{
    const o = q.o[orig], picked = sel.includes(orig), right = q.a.includes(orig);
    let cls = 'opt', tag = '';
    if (mode==='checked'){ cls += ' lock'; if (right){ cls+=' good'; tag = picked ? 'Correct' : 'Answer'; } else if (picked){ cls+=' bad'; tag='Your pick'; } }
    else if (picked) cls += ' sel';
    return `<button type="button" class="${cls}" data-opt="${orig}" role="${multi?'checkbox':'radio'}" aria-checked="${picked}" ${mode==='checked'?'disabled':''}><span class="k">${LETTERS[j]}</span><span>${esc(o)}</span>${tag?`<span class="tag">${tag}</span>`:''}</button>`;
  }).join('')}</div>`;
}

function qcardHTML(){
  const a = attempt(), ex = exam(), i = a.cur, q = qAt(i), sel = selOf(q), d = dom(ex, q.d);
  const multi = q.a.length>1, checked = a.mode==='practice' && a.checked[q.id];
  const ok = checked && isCorrect(q);
  return `
  <div class="qmeta">
    <span class="chip">Question ${i+1} of ${total()}</span>
    <span class="chip d" style="--dc:${d.css}">${esc(d.name)}</span>
    ${multi ? `<span class="chip warn">Choose ${q.a.length===2?'TWO':'THREE'}</span>` : ''}
  </div>
  <p class="stem">${esc(q.q)}</p>
  ${optionsHTML(q, sel, checked ? 'checked' : 'live', permOf(a, q))}
  ${checked ? `<div class="expl ${ok?'ok':'miss'}"><p class="eyebrow">${ok?'Correct':'Not quite'} · correct answer ${answerLetters(a, q)}</p><p>${esc(q.e)}</p></div>` : ''}
  <div class="actions">
    <button class="btn" data-act="prev" ${i===0?'disabled':''}>Previous</button>
    ${a.mode==='practice' && !checked ? `<button class="btn primary" data-act="check" id="checkbtn" ${sel.length? '' : 'disabled'}>Check answer</button>` : ''}
    <span class="grow"></span>
    ${i<total()-1 ? `<button class="btn ${a.mode==='exam'||checked?'primary':''}" data-act="next">Next</button>` : `<button class="btn primary" data-act="review">${a.mode==='exam'?'Review & submit':'Finish'}</button>`}
  </div>`;
}

function mapHTML(){
  const a = attempt();
  return a.qids.map((id,i)=>{
    const q = qById(a.exam, id); const sel = a.answers[id]||[]; let cls = 'cell';
    if (a.mode==='practice' && a.checked[id]) cls += sameSet(sel,q.a) ? ' good' : ' bad';
    else if (sel.length) cls += ' ans';
    if (a.flags[id]) cls += ' flag';
    if (i===a.cur && !state.reviewing) cls += ' cur';
    return `<button type="button" class="${cls}" data-goto="${i}" aria-label="Question ${i+1}${sel.length?', answered':''}${a.flags[id]?', flagged':''}" ${i===a.cur?'aria-current="true"':''}>${i+1}</button>`;
  }).join('');
}

function ringHTML(pct, pass, passPct){
  const r = 70, C = 2*Math.PI*r, off = C*(1-pct/100);
  const th = (-90 + passPct/100*360) * Math.PI/180;
  const x1 = 80 + (r-9)*Math.cos(th), y1 = 80 + (r-9)*Math.sin(th), x2 = 80 + (r+9)*Math.cos(th), y2 = 80 + (r+9)*Math.sin(th);
  return `<svg class="ring" viewBox="0 0 160 160" width="168" height="168" role="img" aria-label="Score ${pct} percent">
    <circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
    <circle cx="80" cy="80" r="${r}" fill="none" stroke="${pass?'var(--good)':'var(--bad)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 80 80)"/>
    <line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--fg)" stroke-width="2" opacity=".6"/>
    <text x="80" y="78" text-anchor="middle" font-size="36" font-weight="600" fill="var(--fg)" font-family="IBM Plex Mono, ui-monospace, monospace">${pct}%</text>
    <text x="80" y="102" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="IBM Plex Sans, system-ui, sans-serif">pass line ${passPct}%</text>
  </svg>`;
}

  window.scrollTo({top:0});
}

// ---------- timer ----------
function startTimer(){ stopTimer(); tick(); timerId = setInterval(tick, 1000); }
function stopTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }
function tick(){
  const a = attempt(); if (!a || a.submittedAt) return;
  const el = document.getElementById('timer'); if (!el) return;
  if (a.mode==='exam'){ const rem = a.endsAt - Date.now(); el.textContent = fmtClock(rem); el.classList.toggle('low', rem < 10*60000); if (rem <= 0) submit(); }
  else el.textContent = fmtClock(Date.now() - a.startedAt);
}

// ---------- actions ----------
function openExam(code){ if (!EX[code] || !BANKS[code]) return; state.exam = code; state.view = 'start'; state.reviewing = false; state.confirming = false; render(); window.scrollTo({top:0}); }
function goto(i){ const a = attempt(); a.cur = Math.max(0, Math.min(total()-1, i)); state.reviewing = false; persist(); render(); window.scrollTo({top:0}); }
function toggleOpt(i){
  const a = attempt(), q = qAt(a.cur); if (a.mode==='practice' && a.checked[q.id]) return;
  if (i >= q.o.length) return;
  let sel = selOf(q).slice();
  if (q.a.length>1){ if (sel.includes(i)) sel = sel.filter(x=>x!==i); else { sel.push(i); if (sel.length > q.a.length) sel.shift(); } }
  else sel = [i];
  a.answers[q.id] = sel; persist(); refreshExamBits();
}
function toggleFlag(){ const a = attempt(), q = qAt(a.cur); if (a.flags[q.id]) delete a.flags[q.id]; else a.flags[q.id] = true; persist(); refreshExamBits(); }
function checkAnswer(){ const a = attempt(), q = qAt(a.cur); if (!selOf(q).length) return; a.checked[q.id] = true; persist(); render(); }
function submit(){
  const a = attempt(); if (!a || a.submittedAt) return;
  a.submittedAt = Date.now(); if (a.mode==='exam' && a.submittedAt > a.endsAt) a.submittedAt = a.endsAt;
  a.result = grade(a);
  const h = histOf(a.exam); h.push({ date:a.submittedAt, mode:a.mode, correct:a.result.correct, total:a.result.total, pct:a.result.pct, timeUsed:a.result.timeUsed });
  state.history[a.exam] = h.slice(-30);
  state.lastUsed[a.exam] = a.qids.slice();
  state.view = 'results'; state.reviewing = false; state.confirming = false; state.filter = 'all';
  persist(); render();
}
function start(){
  const ex = exam();
  const modeEl = document.querySelector('input[name="mode"]:checked'); const mode = modeEl ? modeEl.value : 'exam';
  const av = document.getElementById('avoid'); state.avoidRepeat = av ? av.checked : true; state.startMode = mode;
  state.attempts[ex.code] = newAttempt(ex, mode); state.view = 'exam'; state.reviewing = false; state.confirming = false;
  persist(); render(); window.scrollTo({top:0});
}
function leaveToStart(){ delete state.attempts[state.exam]; state.view = 'start'; persist(); render(); window.scrollTo({top:0}); }

app.addEventListener('click', e => {
  const opt = e.target.closest('[data-opt]'); if (opt && opt.closest('#qcard')) { toggleOpt(+opt.dataset.opt); return; }
  const cell = e.target.closest('[data-goto]'); if (cell) { goto(+cell.dataset.goto); return; }
  const fb = e.target.closest('[data-filter]'); if (fb) { state.filter = fb.dataset.filter; render(); return; }
  const oc = e.target.closest('[data-open]'); if (oc) { openExam(oc.dataset.open); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act==='start') start();
  else if (act==='hub'){ state.view='hub'; state.exam=null; render(); window.scrollTo({top:0}); }
  else if (act==='resume'){ state.view='exam'; state.reviewing=false; render(); }
  else if (act==='discard'){ delete state.attempts[state.exam]; persist(); render(); }
  else if (act==='prev') goto(attempt().cur-1);
  else if (act==='next') goto(attempt().cur+1);
  else if (act==='flag') toggleFlag();
  else if (act==='check') checkAnswer();
  else if (act==='review'){ state.reviewing=true; state.confirming=false; render(); window.scrollTo({top:0}); }
  else if (act==='back'){ state.reviewing=false; state.confirming=false; render(); }
  else if (act==='confirm'){ state.confirming=true; render(); }
  else if (act==='cancel'){ state.confirming=false; render(); }
  else if (act==='submit') submit();
  else if (act==='retake' || act==='home') leaveToStart();
});
app.addEventListener('change', e => {
  if (e.target.name==='mode'){ state.startMode = e.target.value; const b = app.querySelector('[data-act="start"]'); if (b) b.textContent = 'Start ' + (state.startMode==='exam'?'exam':'practice'); }
  if (e.target.id==='avoid') state.avoidRepeat = e.target.checked;
});
document.addEventListener('keydown', e => {
  if (state.view!=='exam' || state.reviewing || !attempt()) return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = (e.target.tagName||'').toLowerCase(); if (tag==='input' || tag==='textarea') return;
  if (e.key==='ArrowRight') { goto(attempt().cur+1); e.preventDefault(); }
  else if (e.key==='ArrowLeft') { goto(attempt().cur-1); e.preventDefault(); }
  else if (/^[a-eA-E]$/.test(e.key) || /^[1-5]$/.test(e.key)) {
    const j = /^[1-5]$/.test(e.key) ? +e.key-1 : LETTERS.indexOf(e.key.toUpperCase());
    const p = permOf(attempt(), qAt(attempt().cur)); if (j < p.length) toggleOpt(p[j]);
  }
  else if (e.key==='f' || e.key==='F') { toggleFlag(); }
});
window.addEventListener('hashchange', () => {
  const h = location.hash.replace('#',''); if (state.view==='exam') return;
  if (EX[h] && BANKS[h]) openExam(h); else if (!h && state.view!=='hub'){ state.view='hub'; state.exam=null; render(); }
});

// ---------- boot ----------
async function loadBanks(){
  const inline = window.__BANKS || null;   // the standalone (downloaded) copy carries the banks inline
  const results = await Promise.all(EXAMS.map(async ex => { if (inline && inline[ex.code]) return [ex.code, inline[ex.code]]; try { const r = await fetch(ex.file, {cache:'no-cache'}); if (!r.ok) throw new Error(r.status); return [ex.code, await r.json()]; } catch(e){ return [ex.code, null]; } }));
  for (const [code, bank] of results){ if (Array.isArray(bank) && bank.length){ BANKS[code] = bank; QBY[code] = {}; bank.forEach(q => QBY[code][q.id] = q); } }
}
function restore(hot){
  if (hot && hot.state){ state = hot.state; return; }
  const saved = lsGet(LS_KEY) || {};
  state.history = saved.history || {}; state.lastUsed = saved.lastUsed || {};
  if (saved.startMode) state.startMode = saved.startMode; if (typeof saved.avoidRepeat==='boolean') state.avoidRepeat = saved.avoidRepeat;
  migrateV1();
  const attempts = saved.attempts || {};
  for (const code in attempts){ const a = attempts[code]; if (!a || a.submittedAt || !BANKS[code]) continue;
    if (!a.qids || !a.qids.every(id => QBY[code][id])) continue;   // bank changed under it
    state.attempts[code] = a; }
  const h = location.hash.replace('#','');
  if (EX[h] && BANKS[h]){ state.exam = h; state.view = 'start'; }
}
async function boot(hot){
  await loadBanks();
  restore(hot);
  const missing = EXAMS.filter(ex => !BANKS[ex.code]).map(ex => ex.short);
  if (missing.length === EXAMS.length){ app.innerHTML = '<div class="loading">The question banks could not be loaded. Reload the page to try again.</div>'; return; }
  // an exam-mode attempt that ran out while the page was closed is submitted on return
  for (const code in state.attempts){ const a = state.attempts[code]; if (a.mode==='exam' && !a.submittedAt && Date.now() >= a.endsAt){ state.exam = code; submit(); return; } }
  if (state.view==='exam' && !attempt()) state.view = 'start';
  render();
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({state})); } catch(e){}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>

    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function(){});
