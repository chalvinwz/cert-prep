vice. Which service should it use?","o":["Amazon WorkSpaces","Amazon AppStream 2.0","Amazon Lightsail","AWS Outposts"],"a":[0],"e":"WorkSpaces is the managed desktop-as-a-service offering. AppStream 2.0 streams individual applications rather than full desktops."},{"id":"tech50","d":"tech","q":"A company has a large, sporadically used dataset in S3 and wants to allow users to query only the portion they need without the cost of running a cluster. A different team instead needs to run Apache Spark jobs on petabytes of data on demand. Which services match these two needs, respectively?","o":["Amazon Athena and Amazon EMR","Amazon Redshift and AWS Glue","Amazon RDS and AWS Batch","Amazon QuickSight and Amazon Kinesis"],"a":[0],"e":"Athena queries S3 serverlessly per query; EMR runs managed Hadoop and Spark clusters for heavy distributed processing."},{"id":"bill09","d":"bill","q":"Which types of offers make up the AWS Free Tier? (Choose TWO.)","o":["Always free offers, such as 1 million Lambda requests per month","12 months free offers that start when the account is created","Unlimited free use of any service for one year","Free use of all Enterprise Support features","Free Reserved Instances for new customers"],"a":[0,1],"e":"The Free Tier has three kinds of offers: always free, 12 months free from sign-up, and short-term trials. It never covers all services or support plans."},{"id":"bill10","d":"bill","q":"A FinOps team needs the most granular raw billing data available, with hourly line items and resource IDs, to load into its own analytics tools. What should it use?","o":["AWS Cost and Usage Report (AWS CUR)","AWS Cost Explorer","AWS Budgets","AWS Pricing Calculator"],"a":[0],"e":"The CUR is the most detailed billing dataset AWS provides, delivered to S3 for use with Athena, Redshift, or QuickSight. Cost Explorer is the visual, interactive view of the same data."},{"id":"bill11","d":"bill","q":"A company wants machine learning-based recommendations for right-sizing its EC2 instances, EBS volumes, and Lambda functions based on actual utilization. Which service provides this?","o":["AWS Compute Optimizer","AWS Trusted Advisor","AWS Budgets","AWS Cost Explorer"],"a":[0],"e":"Compute Optimizer analyzes CloudWatch utilization and recommends optimal resource configurations. Trusted Advisor flags idle or underutilized resources but gives less detailed sizing guidance."},{"id":"bill12","d":"bill","q":"A company wants a discount that applies flexibly across EC2 instance families, sizes, and Regions, and also to AWS Fargate and AWS Lambda usage, in exchange for a commitment to a consistent hourly spend. Which option should it choose?","o":["Compute Savings Plans","EC2 Instance Savings Plans","Standard Reserved Instances","Spot Instances"],"a":[0],"e":"Compute Savings Plans are the most flexible commitment-based discount, covering EC2 across families and Regions plus Fargate and Lambda. EC2 Instance Savings Plans are tied to one instance family in one Region."},{"id":"bill13","d":"bill","q":"A company must use its existing per-socket and per-core Windows Server licenses on AWS and needs visibility into the physical server for licensing compliance. Which EC2 purchasing option should it use?","o":["Dedicated Hosts","Dedicated Instances","Spot Instances","On-Demand Instances"],"a":[0],"e":"Dedicated Hosts give you a physical server with visibility of sockets and cores, which is what bring-your-own-license terms usually require. Dedicated Instances run on single-tenant hardware but do not expose host details."},{"id":"bill14","d":"bill","q":"Which Reserved Instance payment option gives the LARGEST discount?","o":["All Upfront","Partial Upfront","No Upfront","Monthly billing"],"a":[0],"e":"The more you pay up front, the bigger the discount: All Upfront is cheapest, then Partial Upfront, then No Upfront. A 3-year term also beats a 1-year term."},{"id":"bill15","d":"bill","q":"A startup needs 24/7 phone and chat support, a response time of under one hour for production system outages, and access to the full set of Trusted Advisor checks, at the lowest-cost plan that provides these. Which AWS Support plan should it choose?","o":["Business","Developer","Enterprise On-Ramp","Basic"],"a":[0],"e":"Business Support is the lowest tier with 24/7 phone and chat, a 1-hour response for production-down cases, and full Trusted Advisor checks. Developer offers business-hours email only; Basic has no technical support cases."},{"id":"bill16","d":"bill","q":"A company wants to buy a third-party software product, such as a firewall appliance or a licensed database, and have the charges appear on its regular AWS bill. Where should it look?","o":["AWS Marketplace","AWS Service Catalog","AWS Partner Network","AWS re:Post"],"a":[0],"e":"AWS Marketplace is a curated catalog of third-party software and SaaS that can be deployed quickly and billed through AWS. Service Catalog is for curating your own organization's approved products."}],"saa":[{"id":"saa-sec01","d":"sec","q":"A company runs an application in Account A that must read objects from an Amazon S3 bucket owned by Account B. The security team prohibits long-lived access keys. What is the MOST secure way to grant this access?","o":["Create an IAM user in Account B and embed its access keys in the application in Account A","Create an IAM role in Account B that trusts Account A, grant it read access to the bucket, and have the application assume the role","Make the bucket public and restrict access with a Network ACL","Enable S3 Transfer Acceleration on the bucket"],"a":[1],"e":"Cross-account access should use an IAM role with a trust policy for the other account. AWS STS issues temporary credentials when the role is assumed, so no long-lived keys exist."},{"id":"saa-sec02","d":"sec","q":"A company stores sensitive reports in Amazon S3. Compliance requires that the company controls the encryption keys, can rotate them, and can audit every use of a key in AWS CloudTrail. Which encryption option meets these requirements?","o":["Server-side encryption with Amazon S3 managed keys (SSE-S3)","Server-side encryption with AWS KMS keys (SSE-KMS) using a customer managed key","Client-side encryption with keys generated by the application and stored on EC2","No encryption, with access restricted by bucket policy"],"a":[1],"e":"SSE-KMS with a customer managed key gives the company control over the key policy and rotation, and every encrypt/decrypt call is logged in CloudTrail. SSE-S3 keys are managed entirely by S3 and are not auditable per use."},{"id":"saa-sec03","d":"sec","q":"A company has an unencrypted Amazon RDS for PostgreSQL instance in production. A new policy requires encryption at rest for all databases. How can the company encrypt this database?","o":["Modify the instance and enable encryption in the console","Take a snapshot, copy the snapshot with encryption enabled, and restore a new instance from the encrypted copy","Enable encryption on the underlying EBS volumes using the EC2 console","Create an encrypted read replica and promote it"],"a":[1],"e":"RDS encryption can only be set at creation. The supported path is snapshot, encrypted copy, restore, then repoint the application. An encrypted read replica cannot be created from an unencrypted source."},{"id":"saa-sec04","d":"sec","q":"A static website is hosted in an Amazon S3 bucket and served through Amazon CloudFront. The security team requires that users can only reach the content through CloudFront, never directly from the S3 URL. What should a solutions architect do?","o":["Enable S3 static website hosting and make the bucket public","Configure CloudFront origin access control (OAC) and update the bucket policy to allow only the CloudFront distribution","Attach a security group to the S3 bucket allowing only CloudFront IP ranges","Enable S3 Block Public Access and use signed URLs on S3 directly"],"a":[1],"e":"Origin access control lets CloudFront sign requests to S3 with SigV4; the bucket policy then allows only that distribution's service principal. The bucket stays private and direct access is denied."},{"id":"saa-sec05","d":"sec","q":"A media company sells premium video content through Amazon CloudFront. Only paying subscribers should be able to download files, and links must expire after a set time. Which approach should the architect recommend?","o":["Use CloudFront signed URLs or signed cookies generated by the application after login","Make the content public and rely on obscure file names","Use AWS WAF to allow only subscriber IP addresses","Store the content in S3 Glacier so it cannot be downloaded directly"],"a":[0],"e":"CloudFront signed URLs and signed cookies restrict access to private content with an expiry time and optional IP conditions, issued by a trusted key pair the application holds."},{"id":"saa-sec06","d":"sec","q":"A web application behind an Application Load Balancer is receiving large bursts of requests from a small set of IP addresses, degrading performance for other users. Which solution blocks this traffic with the LEAST operational effort?","o":["Add a rate-based rule in AWS WAF associated with the ALB","Add deny entries for each IP to the security group of the ALB","Deploy a third-party firewall appliance in front of the ALB","Enable AWS Shield Standard on the ALB"],"a":[0],"e":"A WAF rate-based rule automatically blocks IPs that exceed a request threshold in a 5-minute window. Security groups cannot deny traffic, and Shield Standard is already on but does not do layer-7 rate limiting."},{"id":"saa-sec07","d":"sec","q":"A financial services company is concerned about large, sophisticated DDoS attacks against its public applications. It wants 24/7 access to the AWS DDoS response team and protection against scaling charges that result from an attack. Which service should it use?","o":["AWS Shield Standard","AWS Shield Advanced","AWS WAF","Amazon GuardDuty"],"a":[1],"e":"Shield Advanced adds advanced DDoS detection, access to the Shield Response Team, and DDoS cost protection for scaling charges on protected resources. Shield Standard is free but has no SRT access or cost protection."},{"id":"saa-sec08","d":"sec","q":"A security team must block all inbound traffic from a specific malicious IP range to every EC2 instance in a subnet. Which action meets the requirement?","o":["Add an inbound deny rule for the range to the subnet's network ACL","Add an inbound deny rule for the range to each instance's security group","Remove the internet gateway from the VPC","Add the range to an S3 bucket policy"],"a":[0],"e":"Network ACLs support explicit deny rules and are evaluated at the subnet boundary. Security groups only have allow rules, so they cannot block a specific source that is otherwise permitted."},{"id":"saa-sec09","d":"sec","q":"A three-tier application has web servers in public subnets and an Amazon RDS database in private subnets. The database must accept connections only from the web servers. Which security group configuration is the MOST appropriate?","o":["Allow inbound port 3306 on the database security group from the CIDR 0.0.0.0/0","Allow inbound port 3306 on the database security group with the web tier security group ID as the source","Allow inbound port 3306 from the VPC CIDR range on the database network ACL only","Place the database in a public subnet and restrict access with a bucket policy"],"a":[1],"e":"Referencing the web tier's security group as the source means only instances that carry that group can connect, regardless of their IP addresses, and the rule keeps working as the web tier scales."},{"id":"saa-sec10","d":"sec","q":"EC2 instances in private subnets need to upload objects to Amazon S3. The security team requires that this traffic never traverses the public internet, and the solution should add no data-processing charges. What should the architect configure?","o":["A NAT gateway in a public subnet","A gateway VPC endpoint for Amazon S3 with a route in the private subnet route tables","An interface VPC endpoint for Amazon S3 in each Availability Zone","An internet gateway attached to the private subnets"],"a":[1],"e":"Gateway endpoints for S3 and DynamoDB route traffic privately over the AWS network at no additional cost. Interface endpoints also work but carry hourly and data charges; a NAT gateway sends traffic to public S3 endpoints and bills for processing."},{"id":"saa-sec11","d":"sec","q":"A company offers a SaaS API running behind a Network Load Balancer. Customers in other AWS accounts must reach the API privately from their own VPCs without VPC peering and without exposing it to the internet. Which solution should the architect recommend?","o":["AWS PrivateLink: create a VPC endpoint service backed by the NLB and have customers create interface endpoints","VPC peering with every customer VPC","A Transit Gateway shared with every customer account","A public API Gateway endpoint restricted by IP"],"a":[0],"e":"PrivateLink exposes a service through an endpoint service; consumers create interface endpoints in their VPCs. Traffic stays on the AWS network, IP ranges never need to be non-overlapping, and no routing is shared."},{"id":"saa-sec12","d":"sec","q":"A company lets development team leads create IAM roles for their applications, but the security team must guarantee that those roles can never gain permissions beyond a defined maximum, such as access to billing or IAM. Which IAM feature enforces this?","o":["Permissions boundaries attached to the roles that team leads create","Resource-based policies on every resource","IAM groups for each team","AWS Organizations consolidated billing"],"a":[0],"e":"A permissions boundary sets the maximum permissions an identity-based policy can grant. Requiring the boundary on every role created by delegated administrators caps what they can hand out."},{"id":"saa-sec13","d":"sec","q":"A company uses AWS Organizations. For data residency reasons, member accounts must be prevented from creating resources in any Region other than ap-southeast-3 and ap-southeast-1, even if an account administrator tries. What should the architect implement?","o":["A service control policy (SCP) that denies actions when aws:RequestedRegion is not one of the approved Regions","An IAM policy attached to each administrator user","AWS Config rules in each account","A CloudFront geo restriction"],"a":[0],"e":"SCPs are organization-level guardrails that apply even to account administrators. A deny with a condition on aws:RequestedRegion (with exceptions for global services) is the standard pattern."},{"id":"saa-sec14","d":"sec","q":"A company wants employees to use their existing Microsoft Entra ID (Azure AD) credentials to access the AWS Management Console across 30 AWS accounts, with permissions assigned per account. Which solution requires the LEAST operational overhead?","o":["Create IAM users in every account and synchronize passwords","Use AWS IAM Identity Center connected to the external identity provider via SAML 2.0, with permission sets assigned to accounts","Use Amazon Cognito user pools in each account","Share a single IAM role's credentials with all employees"],"a":[1],"e":"IAM Identity Center federates with an external IdP once, then assigns permission sets to users and groups across all Organization accounts. Cognito is for application end users, not workforce console access."},{"id":"saa-sec15","d":"sec","q":"A mobile app lets users upload photos directly to an S3 bucket. Users sign in with Google or with a username and password. Each user may access only their own objects. Which combination provides this with temporary credentials? (Choose TWO.)","o":["Amazon Cognito user pools for sign-in","Amazon Cognito identity pools to exchange tokens for temporary AWS credentials scoped by a policy variable","An IAM user per app user with access keys embedded in the app","AWS IAM Identity Center permission sets for each user","An S3 bucket policy making the bucket public"],"a":[0,1],"e":"User pools authenticate users (including social providers); identity pools issue temporary credentials via STS with policies that can use ${cognito-identity.amazonaws.com:sub} to limit each user to their own prefix."},{"id":"saa-sec16","d":"sec","q":"A third-party monitoring vendor needs read-only access to resources in a company's AWS account. The company wants to prevent the confused deputy problem, where the vendor's role could be used on behalf of another customer. Which configuration addresses this?","o":["Create a cross-account IAM role trusted by the vendor's account and require a unique external ID in the trust policy","Create an IAM user for the vendor and share its access keys","Grant the vendor the root user password","Create a VPC peering connection with the vendor"],"a":[0],"e":"Cross-account roles with an external ID condition ensure the vendor can only assume the role when it passes the ID the company issued, which prevents a different customer of the vendor from tricking it into using this role."},{"id":"saa-sec17","d":"sec","q":"A company must retain financial records in Amazon S3 for seven years in a write-once-read-many (WORM) model. No user, including the root user, may delete or overwrite objects during that period. Which feature should be used?","o":["S3 Object Lock in compliance mode with a seven-year retention period","S3 Object Lock in governance mode","S3 Versioning with MFA Delete","An S3 Lifecycle rule that transitions to Glacier Deep Archive"],"a":[0],"e":"Compliance mode retention cannot be shortened or removed by any user, including root, until it expires. Governance mode can be overridden by users with special permissions."},{"id":"saa-sec18","d":"sec","q":"A company must find out whether any of its hundreds of S3 buckets contain unencrypted personally identifiable information such as national ID numbers, and be alerted when new sensitive objects appear. Which service should the architect recommend?","o":["Amazon Macie","Amazon GuardDuty","Amazon Inspector","AWS Config"],"a":[0],"e":"Macie uses machine learning and pattern matching to discover and classify sensitive data in S3 and raises findings for new objects. GuardDuty detects threats; Inspector finds software vulnerabilities."},{"id":"saa-sec19","d":"sec","q":"A company with many AWS accounts wants a single, tamper-evident record of all API activity across the organization, stored centrally so that account administrators cannot alter their own account's logs. Which solution should the architect implement?","o":["An organization trail in AWS CloudTrail delivering to a central S3 bucket in a dedicated log-archive account, with log file validation enabled","A CloudTrail trail in each account writing to a local bucket","CloudWatch Logs in each account with 1-day retention","AWS Config aggregator with a 30-day retention"],"a":[0],"e":"An organization trail is created once in the management account and applies to all member accounts; members cannot modify it. Log file validation produces digest files that prove integrity."},{"id":"saa-sec20","d":"sec","q":"An EC2 instance is launched in a private subnet without a key pair, and the company forbids opening port 22 or running a bastion host. Administrators still need interactive shell access with session logging. Which solution meets these requirements?","o":["AWS Systems Manager Session Manager with the SSM Agent and an instance role, logging sessions to S3 or CloudWatch Logs","An Elastic IP with SSH restricted to the office IP","A bastion host in a public subnet","AWS Direct Connect"],"a":[0],"e":"Session Manager provides browser or CLI shell access through the SSM Agent over the AWS network, needing no inbound ports or keys, with IAM-controlled access and full session logging."},{"id":"saa-sec21","d":"sec","q":"A company's web application runs behind an Application Load Balancer and uses Amazon CloudFront in front of it. The company needs a free, automatically renewing public TLS certificate for both. Which approach is correct?","o":["Request a certificate in AWS Certificate Manager in us-east-1 for CloudFront and one in the ALB's Region for the ALB","Upload a self-signed certificate to both services","Purchase a certificate and install it manually on each EC2 instance","Use AWS Secrets Manager to store the private key and attach it to CloudFront"],"a":[0],"e":"ACM certificates are regional and free for integrated services. CloudFront is a global service and reads certificates only from us-east-1; the ALB needs one in its own Region."},{"id":"saa-sec22","d":"sec","q":"An Amazon API Gateway REST API must authorize requests using tokens issued by an existing third-party OAuth provider that is not Amazon Cognito. The validation logic is custom. Which API Gateway authorizer should be used?","o":["A Lambda authorizer","An Amazon Cognito user pool authorizer","IAM authorization with SigV4","An API key only"],"a":[0],"e":"Lambda authorizers run custom code to validate bearer tokens or request parameters and return an IAM policy. Cognito authorizers only validate Cognito-issued tokens, and API keys are for usage plans, not authentication."},{"id":"saa-sec23","d":"sec","q":"A company requires that all requests to a particular S3 bucket use HTTPS, and that no object can ever be made public. Which combination meets both requirements? (Choose TWO.)","o":["A bucket policy that denies requests where aws:SecureTransport is false","Enabling S3 Block Public Access on the bucket","Enabling S3 Transfer Acceleration","Enabling S3 Versioning","Attaching a security group to the bucket"],"a":[0,1],"e":"The aws:SecureTransport condition rejects plain HTTP requests, and Block Public Access prevents any ACL or policy from granting public access. Versioning and Transfer Acceleration are unrelated to these controls."},{"id":"saa-sec24","d":"sec","q":"A Lambda function writes items to one specific Amazon DynamoDB table. Following the principle of least privilege, which permissions should the function's execution role include?","o":["dynamodb:PutItem on the ARN of that table only, plus basic CloudWatch Logs permissions","dynamodb:* on all resources","AdministratorAccess so the function never fails on permissions","dynamodb:PutItem on Resource: * so other tables can be added later"],"a":[0],"e":"Least privilege means only the actions needed on only the resources needed. Scoping the resource to the table ARN limits the blast radius if the function is compromised."},{"id":"saa-sec25","d":"sec","q":"A company must store its encryption keys in single-tenant hardware security modules validated to FIPS 140-2 Level 3, with the company having exclusive control over the HSM. Which AWS service should it use?","o":["AWS CloudHSM","AWS KMS with AWS managed keys","AWS Secrets Manager","AWS Certificate Manager Private CA"],"a":[0],"e":"CloudHSM provides dedicated HSMs in the customer's VPC that AWS cannot access. KMS uses multi-tenant HSMs managed by AWS (and can optionally use CloudHSM as a custom key store)."},{"id":"saa-sec26","d":"sec","q":"A company requires that every EBS volume in its accounts is encrypted. It wants non-compliant volumes to be detected automatically and the owner notified, with a record of compliance over time. Which solution meets these requirements?","o":["AWS Config with the encrypted-volumes managed rule and an SNS notification on non-compliance","Amazon Inspector network reachability findings","AWS Trusted Advisor security checks","A Lambda function that runs once a year"],"a":[0],"e":"Config continuously evaluates resources against rules and records configuration history, and can trigger remediation or notifications. Trusted Advisor checks are point-in-time and limited by support plan."},{"id":"saa-sec27","d":"sec","q":"A company must allow EC2 instances in many VPCs to reach only an approved list of external domains over HTTPS, inspect outbound traffic for threats, and manage the rules centrally. Which service should the architect recommend?","o":["AWS Network Firewall deployed in a centralized inspection VPC with domain-based stateful rules","Security groups with outbound rules per domain","AWS WAF attached to a NAT gateway","Amazon GuardDuty"],"a":[0],"e":"Network Firewall provides stateful, domain-aware egress filtering and IPS. Security groups work on IP addresses and ports, not domains, and WAF cannot be attached to NAT gateways."},{"id":"saa-sec28","d":"sec","q":"A company has a shared-services account that owns a VPC. It wants application accounts in the same organization to launch resources directly into subnets of that VPC while the networking team keeps control of the VPC itself. Which service enables this?","o":["AWS Resource Access Manager (AWS RAM) to share the subnets with the application accounts","VPC peering between every account","AWS Transit Gateway attachments","Copying the VPC with CloudFormation StackSets"],"a":[0],"e":"VPC sharing through RAM lets participants create resources in shared subnets owned by another account, keeping a single network under central control."},{"id":"saa-sec29","d":"sec","q":"A company is setting up its first multi-account environment and needs a landing zone with centralized logging, account vending, and preventive and detective guardrails, with minimal custom engineering. Which service should it use?","o":["AWS Control Tower","AWS Config alone","AWS Service Catalog alone","AWS Trusted Advisor"],"a":[0],"e":"Control Tower automates a best-practice multi-account landing zone on top of Organizations, with Account Factory and managed guardrails implemented through SCPs and Config rules."},{"id":"saa-sec30","d":"sec","q":"Developers connect to an Amazon RDS for MySQL database from EC2 instances. The security team wants to eliminate database passwords stored in configuration files and instead rely on IAM identities with short-lived tokens. Which feature should be enabled?","o":["IAM database authentication on the RDS instance","RDS Multi-AZ","Amazon RDS Proxy only","Transparent Data Encryption"],"a":[0],"e":"IAM database authentication lets clients connect with a 15-minute authentication token generated with their IAM credentials instead of a stored password."},{"id":"saa-sec31","d":"sec","q":"A company with dozens of accounts wants a common set of AWS WAF rules applied automatically to every new Application Load Balancer and CloudFront distribution in the organization. Which service should be used?","o":["AWS Firewall Manager","AWS Shield Standard","AWS Config","Amazon Inspector"],"a":[0],"e":"Firewall Manager applies WAF, Shield Advanced, security group, and Network Firewall policies across accounts in an organization and automatically covers newly created resources."},{"id":"saa-sec32","d":"sec","q":"A company needs to copy an encrypted Amazon EBS snapshot to a second Region for disaster recovery. The snapshot is encrypted with a customer managed KMS key. What must the architect account for?","o":["The copy must be encrypted with a KMS key that exists in the destination Region","Encrypted snapshots cannot be copied between Regions","The destination Region must have the same KMS key ID","The snapshot must be decrypted before copying"],"a":[0],"e":"KMS keys are regional. When copying a snapshot across Regions, you specify a key in the destination Region (or use a multi-Region key replica). Snapshots are re-encrypted during the copy, not decrypted."},{"id":"saa-sec33","d":"sec","q":"An Amazon EFS file system stores confidential documents accessed from EC2 instances. The company requires encryption of data both at rest and in transit. Which actions meet the requirement? (Choose TWO.)","o":["Create the file system with encryption at rest enabled using a KMS key","Mount the file system with the EFS mount helper using the TLS option","Enable S3 Block Public Access","Use HTTPS on the Application Load Balancer","Create the file system in a public subnet"],"a":[0,1],"e":"EFS encryption at rest is chosen at creation with KMS. Encryption in transit is enabled per mount using the amazon-efs-utils mount helper with -o tls, which sets up a TLS tunnel over NFS."},{"id":"saa-sec34","d":"sec","q":"An application running on EC2 needs to retrieve database credentials at startup. The credentials must be encrypted, rotated automatically every 30 days, and never stored in the AMI or code. Which service should be used?","o":["AWS Secrets Manager with automatic rotation and an instance role allowing GetSecretValue","AWS Systems Manager Parameter Store standard parameters","Environment variables baked into the AMI","Amazon S3 with SSE-S3"],"a":[0],"e":"Secrets Manager stores secrets encrypted with KMS and can rotate RDS credentials automatically on a schedule. Parameter Store SecureString also encrypts but has no built-in rotation."},{"id":"saa-sec35","d":"sec","q":"A company's security team wants to be notified when an IAM user signs in without MFA, when an EC2 instance is communicating with a known cryptocurrency mining domain, or when credentials are used from an unusual location. Which service provides these detections with no agents to install?","o":["Amazon GuardDuty","Amazon Inspector","AWS Security Hub","Amazon Macie"],"a":[0],"e":"GuardDuty analyzes CloudTrail, VPC Flow Logs, and DNS logs with threat intelligence and ML to produce findings such as these. Inspector scans for vulnerabilities and needs the SSM Agent for EC2."},{"id":"saa-sec36","d":"sec","q":"A company hosts an internal web application on EC2 instances that should be reachable only from the corporate network over an AWS Site-to-Site VPN. Which design meets the requirement?","o":["Place the instances in private subnets behind an internal Application Load Balancer, with security groups allowing traffic from the on-premises CIDR","Place the instances in public subnets with an internet-facing load balancer","Assign Elastic IP addresses and allow 0.0.0.0/0 on port 443","Expose the application through CloudFront"],"a":[0],"e":"An internal load balancer has only private IP addresses and is reachable from the VPC and connected networks. Security groups then limit sources to the corporate range."},{"id":"saa-sec37","d":"sec","q":"A company wants to standardize how teams launch pre-approved infrastructure such as hardened EC2 configurations and RDS databases, while hiding the underlying CloudFormation templates and enforcing tagging and constraints. Which service should be used?","o":["AWS Service Catalog","AWS Marketplace","AWS CodeDeploy","AWS Elastic Beanstalk"],"a":[0],"e":"Service Catalog publishes approved products built from CloudFormation templates with launch constraints and template constraints, so users deploy compliant stacks without needing the underlying permissions."},{"id":"saa-sec38","d":"sec","q":"A company's auditors want proof that the company's AWS environment aligns with the PCI DSS framework, with evidence collected continuously rather than gathered manually before each audit. Which service should the architect recommend?","o":["AWS Audit Manager","AWS Artifact","Amazon Inspector","AWS Trusted Advisor"],"a":[0],"e":"Audit Manager maps AWS usage to frameworks like PCI DSS, collects evidence automatically, and generates assessment reports. Artifact only provides AWS's own compliance documents."},{"id":"saa-sec39","d":"sec","q":"An Amazon SQS queue receives messages from a Lambda function in a different AWS account. Which configuration allows this while following least privilege?","o":["An SQS queue policy (resource-based policy) that allows sqs:SendMessage for the specific function's execution role ARN","An SQS queue policy with Principal: * and no conditions","Sharing the queue owner's access keys with the other account","A VPC peering connection between the accounts"],"a":[0],"e":"SQS supports resource-based queue policies. Granting SendMessage to the exact role ARN from the other account gives cross-account access without opening the queue to everyone."},{"id":"saa-res01","d":"res","q":"A company runs an Amazon RDS for MySQL database for a production application. The database must survive the failure of an Availability Zone with automatic failover and no manual intervention. Which configuration meets this requirement?","o":["Enable Multi-AZ deployment for the RDS instance","Create a read replica in another Availability Zone","Take automated snapshots every hour","Enable storage autoscaling"],"a":[0],"e":"Multi-AZ keeps a synchronous standby in another AZ and fails over automatically, updating the DNS endpoint. Read replicas are asynchronous and require manual promotion."},{"id":"saa-res02","d":"res","q":"A global company runs an Amazon Aurora PostgreSQL database in ap-southeast-1. It needs a disaster recovery copy in another Region with a recovery point objective of about one second and a recovery time objective under one minute. Which solution meets these objectives?","o":["Aurora Global Database with a secondary cluster in the DR Region","Nightly snapshots copied to the DR Region","A cross-Region read replica of an RDS instance","AWS Backup with a daily schedule"],"a":[0],"e":"Aurora Global Database replicates with typically sub-second lag using dedicated storage-level replication and supports promoting the secondary Region in under a minute."},{"id":"saa-res03","d":"res","q":"A gaming company stores player profiles in Amazon DynamoDB. It wants the application to be served from two Regions simultaneously, with writes accepted in both and data replicated automatically. Which feature should it use?","o":["DynamoDB global tables","DynamoDB Accelerator (DAX)","DynamoDB on-demand backups copied to another Region","DynamoDB Streams with a Lambda function that writes to the other Region"],"a":[0],"e":"Global tables provide fully managed multi-Region, multi-active replication. Streams plus Lambda could be built by hand but adds operational burden and conflict handling."},{"id":"saa-res04","d":"res","q":"An e-commerce site experiences order spikes during promotions that overwhelm the order-processing backend, causing lost orders. The architect wants to absorb spikes and process orders at a steady rate without losing any. Which solution should be used?","o":["Place orders in an Amazon SQS queue and have the backend consume from the queue with Auto Scaling based on queue depth","Increase the size of the backend instances","Send orders through Amazon SNS directly to the backend","Store orders in Amazon ElastiCache"],"a":[0],"e":"SQS buffers requests durably so producers and consumers can scale independently. Scaling consumers on ApproximateNumberOfMessagesVisible matches processing capacity to backlog."},{"id":"saa-res05","d":"res","q":"A payment application must process transactions for each customer in the exact order they were submitted, and no transaction may be processed twice. Which messaging configuration satisfies this?","o":["An Amazon SQS FIFO queue using the customer ID as the message group ID and deduplication enabled","An Amazon SQS standard queue with long polling","An Amazon SNS topic with multiple subscribers","Amazon Kinesis Data Firehose"],"a":[0],"e":"FIFO queues guarantee ordering within a message group and exactly-once processing with deduplication IDs. Standard queues offer best-effort ordering and at-least-once delivery."},{"id":"saa-res06","d":"res","q":"Consumers of an Amazon SQS queue sometimes fail to process a message because of malformed data, and the message keeps reappearing, blocking the queue. What should the architect configure so that such messages are isolated for analysis?","o":["A dead-letter queue with a maxReceiveCount redrive policy","A longer visibility timeout","Message retention of 14 days","A FIFO queue"],"a":[0],"e":"A redrive policy moves messages to a dead-letter queue after they have been received the configured number of times without being deleted, so poison messages stop blocking processing."},{"id":"saa-res07","d":"res","q":"When an order is placed, three independent systems must each receive the event: inventory, billing, and analytics. Each system must process every event at its own pace and must not lose events if it is temporarily down. Which pattern should the architect use?","o":["Publish to an Amazon SNS topic with an Amazon SQS queue subscribed for each system (fan-out)","Call each system synchronously from the order service","Write to one Amazon SQS queue consumed by all three systems","Use Amazon SES to email each system"],"a":[0],"e":"SNS fan-out to multiple SQS queues delivers each message to every subscriber durably. A single SQS queue would deliver each message to only one consumer."},{"id":"saa-res08","d":"res","q":"A web application runs on EC2 instances in a single Availability Zone behind an Application Load Balancer. A recent AZ outage took the site down. What should the architect change to improve availability?","o":["Launch instances in an Auto Scaling group spanning at least two Availability Zones and register the ALB with both","Use larger EC2 instances in the same AZ","Add a second ALB in the same AZ","Enable sticky sessions on the ALB"],"a":[0],"e":"Spreading the Auto Scaling group across multiple AZs with the ALB in each lets the application keep serving traffic when one AZ fails and replace unhealthy instances automatically."},{"id":"saa-res09","d":"res","q":"A company's internal reporting application experiences heavy load every weekday from 08:00 to 10:00 and almost none at other times. The company wants capacity ready before the load arrives without paying for it all day. Which Auto Scaling approach is BEST?","o":["Scheduled scaling actions to increase desired capacity at 07:45 and reduce it at 10:15 on weekdays","Target tracking on CPU utilization only","A fixed desired capacity equal to the peak","Manual scaling by the operations team"],"a":[0],"e":"Scheduled scaling fits predictable patterns and avoids the lag of reactive scaling. It can be combined with target tracking to handle unexpected variation within the window."},{"id":"saa-res10","d":"res","q":"A company's primary web application runs in one Region. If it becomes unavailable, users should automatically be served a static maintenance page hosted in Amazon S3. Which Route 53 configuration achieves this?","o":["Failover routing policy with a health check on the primary endpoint and the S3 static website as the secondary record","Weighted routing with 50/50 split","Geolocation routing","Simple routing with two IP addresses"],"a":[0],"e":"Failover routing returns the secondary record only when the primary's health check fails. S3 static website endpoints can be used as alias targets for the secondary."},{"id":"saa-res11","d":"res","q":"A company must comply with a requirement that users in the European Union are always served from an EU Region, regardless of which Region would give them the lowest latency. Which Route 53 routing policy should be used?","o":["Geolocation routing","Latency-based routing","Weighted routing","Multivalue answer routing"],"a":[0],"e":"Geolocation routing directs users based on the location their DNS query originates from, which is the right tool for content localization and data residency rules. Latency routing optimizes speed, not location."},{"id":"saa-res12","d":"res","q":"A company runs a stateful application in us-east-1 and needs a disaster recovery environment in another Region. The business accepts a recovery time of a few hours and wants the lowest possible cost. The data must be no more than 24 hours old. Which strategy fits?","o":["Backup and restore: replicate daily backups to the DR Region and rebuild on demand","Warm standby with a scaled-down copy running continuously","Multi-site active-active","Pilot light with the database replicating continuously"],"a":[0],"e":"Backup and restore is the lowest-cost strategy, suited to RTO of hours and RPO of up to a day. Pilot light, warm standby, and active-active progressively lower RTO/RPO at higher cost."},{"id":"saa-res13","d":"res","q":"A company needs a disaster recovery approach where the database is replicated continuously to the DR Region and core infrastructure exists but is switched off or minimal, so that the full environment can be scaled up within tens of minutes. Which strategy is this?","o":["Pilot light","Backup and restore","Warm standby","Multi-site active-active"],"a":[0],"e":"Pilot light keeps data live and the minimal core (such as the database) running in the DR Region, while application servers are provisioned on failover. Warm standby runs a scaled-down but fully functional copy."},{"id":"saa-res14","d":"res","q":"A content management system runs on multiple EC2 instances in several Availability Zones. All instances must read and write the same set of files with POSIX semantics, and the storage must remain available if an AZ fails. Which storage should be used?","o":["Amazon EFS with the Regional (multi-AZ) storage class","Amazon EBS volumes attached to each instance","Amazon EFS One Zone","Instance store volumes"],"a":[0],"e":"EFS Regional file systems store data redundantly across multiple AZs and can be mounted concurrently from many instances. EBS is attached to one instance in one AZ; One Zone EFS lives in a single AZ."},{"id":"saa-res15","d":"res","q":"A company stores critical documents in Amazon S3. It must be able to recover from accidental deletions and from a regional disaster, and it needs copies kept in a second Region automatically. Which combination should the architect enable? (Choose TWO.)","o":["S3 Versioning on the bucket","S3 Cross-Region Replication to a bucket in another Region","S3 Transfer Acceleration","S3 Intelligent-Tiering","Requester Pays"],"a":[0,1],"e":"Versioning protects against overwrites and deletes (a delete creates a delete marker). Cross-Region Replication, which requires versioning, keeps an asynchronous copy in another Region."},{"id":"saa-res16","d":"res","q":"A company wants EBS snapshots of production volumes taken every 12 hours, retained for 30 days, and automatically copied to a second Region, with no custom scripts. Which service should be used?","o":["Amazon Data Lifecycle Manager (or AWS Backup) with a policy that includes cross-Region copy","A cron job on each instance calling the CLI","Manual snapshots by the operations team","S3 Lifecycle rules"],"a":[0],"e":"Data Lifecycle Manager and AWS Backup both automate snapshot schedules, retention, and cross-Region copies through policies rather than scripts."},{"id":"saa-res17","d":"res","q":"A web application stores user session data in memory on each EC2 instance. When Auto Scaling terminates an instance, users are logged out. How should the architect make the web tier resilient to instance replacement?","o":["Store session state externally in Amazon ElastiCache or DynamoDB so any instance can serve any user","Enable sticky sessions on the load balancer","Disable scale-in on the Auto Scaling group","Use larger instances so fewer are needed"],"a":[0],"e":"A stateless web tier keeps session data in a shared, durable store. Sticky sessions only delay the problem; the session still dies with the instance."},{"id":"saa-res18","d":"res","q":"An AWS Lambda function is invoked asynchronously by Amazon S3 events. Occasionally the function fails after all retries. The company must not lose these events and wants to investigate them later. What should be configured?","o":["A dead-letter queue or an on-failure destination for the function's asynchronous invocations","A longer function timeout","Reserved concurrency of zero","CloudWatch Logs retention of 1 day"],"a":[0],"e":"For asynchronous invocations, Lambda retries twice and then sends the event to a configured dead-letter queue (SQS or SNS) or an on-failure destination, preserving the payload for later handling."},{"id":"saa-res19","d":"res","q":"A document-processing workflow has five steps implemented as Lambda functions. Some steps occasionally fail and should be retried with exponential backoff, and the overall state must be visible and auditable. Which service should coordinate the workflow?","o":["AWS Step Functions","Amazon SQS","Amazon EventBridge Scheduler","AWS Batch"],"a":[0],"e":"Step Functions state machines coordinate tasks with built-in retry, catch, and parallel states and record each execution's history. Chaining Lambda functions directly makes retries and visibility hard."},{"id":"saa-res20","d":"res","q":"A real-time analytics platform ingests events that must be consumed by three separate applications, each reading the full stream independently, with the ability to replay the last 24 hours of data. Which service fits?","o":["Amazon Kinesis Data Streams","Amazon SQS standard queue","Amazon SNS","Amazon MQ"],"a":[0],"e":"Kinesis Data Streams retains records (24 hours by default, up to 365 days) and lets multiple consumers read the same shards independently, which supports replay. SQS deletes a message once a consumer processes it."},{"id":"saa-res21","d":"res","q":"An Amazon Aurora MySQL cluster serves a read-heavy application. The architect wants read traffic spread across replicas and automatic promotion of a replica if the writer fails. How should the application connect?","o":["Use the cluster writer endpoint for writes and the reader endpoint for reads","Connect every query to the writer instance's endpoint","Hard-code each replica's instance endpoint in the application","Use an S3 endpoint"],"a":[0],"e":"The reader endpoint load balances connections across Aurora Replicas, and Aurora promotes a replica automatically on writer failure, repointing the writer endpoint."},{"id":"saa-res22","d":"res","q":"A company requires the ability to restore its Amazon RDS database to any point in time within the last 30 days. Which configuration enables this?","o":["Enable automated backups with a 30-day backup retention period","Take a manual snapshot once a day","Enable Multi-AZ","Create a read replica"],"a":[0],"e":"Automated backups (retention 1 to 35 days) include transaction logs, enabling point-in-time recovery to any second within the window. Manual snapshots only restore to the snapshot time."},{"id":"saa-res23","d":"res","q":"A company must keep backups of RDS, DynamoDB, and EFS resources in a separate AWS account so that a compromise of the production account cannot destroy the backups. Which solution meets this with the least effort?","o":["AWS Backup with cross-account backup to a vault in a dedicated backup account, protected with a vault lock","Manual snapshot sharing to the other account each day","Copying backups to an S3 bucket in the same account","Relying on automated RDS backups only"],"a":[0],"e":"AWS Backup supports cross-account and cross-Region copies through Organizations, and Backup Vault Lock makes the vault immutable so backups cannot be deleted even by administrators."},{"id":"saa-res24","d":"res","q":"A containerized API must stay available during Availability Zone failures and automatically replace failed tasks, without the team managing EC2 hosts. Which architecture should be used?","o":["An Amazon ECS service on AWS Fargate with tasks spread across multiple AZ subnets behind an Application Load Balancer","A single Fargate task with an Elastic IP","Docker running on one large EC2 instance","AWS Lambda with a 20-minute timeout"],"a":[0],"e":"An ECS service maintains the desired task count, replacing failed tasks, and Fargate removes host management. Multi-AZ subnets plus an ALB keep the API reachable when an AZ fails."},{"id":"saa-res25","d":"res","q":"A company's single-instance legacy application cannot run on more than one server, but the business wants it to recover automatically if the instance or its Availability Zone fails. Which solution provides self-healing with the least change?","o":["An Auto Scaling group with minimum, desired, and maximum capacity of 1 across two Availability Zones, with an Elastic Network Interface or load balancer for a stable endpoint","Two instances behind a load balancer","Running the application in Lambda","A larger instance type"],"a":[0],"e":"An ASG of exactly one instance across multiple AZs relaunches the instance in a healthy AZ when it fails, giving automatic recovery for workloads that cannot scale horizontally."},{"id":"saa-res26","d":"res","q":"A company connects its data center to AWS with a single AWS Direct Connect link. A recent fiber cut caused a full outage. The company wants a cost-effective backup that is resilient to Direct Connect failure. What should the architect recommend?","o":["Add an AWS Site-to-Site VPN as a backup path with BGP routing preferring Direct Connect","Add a second Direct Connect at the same location on the same device","Use VPC peering","Use Amazon CloudFront"],"a":[0],"e":"A Site-to-Site VPN over the internet is the standard low-cost backup for Direct Connect; BGP fails over automatically. A second DX on the same path shares the single point of failure."},{"id":"saa-res27","d":"res","q":"EC2 instances in private subnets across three Availability Zones reach the internet through one NAT gateway in a single AZ. During an AZ failure, instances in the other AZs also lost internet access. How should the design be improved?","o":["Deploy a NAT gateway in each Availability Zone and route each private subnet to the NAT gateway in its own AZ","Replace the NAT gateway with a NAT instance","Attach an internet gateway to the private subnets","Use a larger NAT gateway"],"a":[0],"e":"A NAT gateway is zonal. One per AZ, with zone-local routing, removes the cross-AZ dependency and also avoids cross-AZ data transfer charges."},{"id":"saa-res28","d":"res","q":"A company stores easily reproducible intermediate data in Amazon S3 and wants the cheapest option, but it also stores critical compliance records that must survive the loss of an Availability Zone. Which storage classes should it choose for each, respectively?","o":["S3 One Zone-IA for reproducible data and S3 Standard-IA for compliance records","S3 Standard for both","S3 One Zone-IA for both","S3 Glacier Deep Archive for reproducible data and S3 One Zone-IA for compliance records"],"a":[0],"e":"One Zone-IA stores data in a single AZ at lower cost, acceptable for reproducible data. Standard-IA and the other multi-AZ classes keep copies across at least three AZs."},{"id":"saa-res29","d":"res","q":"An application uses Amazon ElastiCache for Redis as its primary low-latency data store. The cache must survive a node or Availability Zone failure with minimal downtime and no manual intervention. Which configuration should be used?","o":["A Redis replication group with Multi-AZ and automatic failover enabled, with replicas in different AZs","A single Redis node with backups every hour","Memcached with two nodes","A single node with a larger instance type"],"a":[0],"e":"Redis replication groups with Multi-AZ promote a replica in another AZ automatically when the primary fails. Memcached has no replication or failover."},{"id":"saa-res30","d":"res","q":"A company runs a TCP-based application in two Regions and needs clients to be routed to the healthy Region automatically within seconds, using fixed IP addresses that customers can allowlist in their firewalls. Which service should be used?","o":["AWS Global Accelerator with endpoint groups in both Regions","Amazon CloudFront","Route 53 with a 300-second TTL","An Application Load Balancer in each Region"],"a":[0],"e":"Global Accelerator provides two static anycast IPs and health-checks regional endpoints, shifting traffic in seconds without depending on DNS caching. CloudFront is HTTP-only and does not give static IPs."},{"id":"saa-res31","d":"res","q":"A company is migrating an application that uses Apache ActiveMQ with the AMQP and JMS protocols. It wants a managed, highly available message broker on AWS without rewriting the messaging code. Which service should be used?","o":["Amazon MQ with an active/standby broker deployment","Amazon SQS","Amazon SNS","Amazon Kinesis Data Streams"],"a":[0],"e":"Amazon MQ is a managed ActiveMQ or RabbitMQ broker that supports industry-standard protocols, so existing clients connect unchanged. SQS and SNS use their own APIs."},{"id":"saa-res32","d":"res","q":"An Amazon CloudFront distribution serves content from an S3 bucket. The company wants CloudFront to automatically fetch from a second S3 bucket in another Region if the primary origin returns errors. What should be configured?","o":["An origin group with the primary and secondary origins and failover criteria on specific HTTP status codes","Two separate distributions with Route 53 weighted routing","Lambda@Edge to retry requests","Geo restriction"],"a":[0],"e":"CloudFront origin groups provide origin failover: when the primary returns the configured error codes (or times out), CloudFront retries the request against the secondary origin."},{"id":"saa-res33","d":"res","q":"A company's Auto Scaling group uses an Application Load Balancer. Instances sometimes pass the EC2 status checks but the application on them is hung, and the ASG does not replace them. What should the architect change?","o":["Configure the Auto Scaling group to use ELB health checks in addition to EC2 status checks","Increase the health check grace period","Change the ALB to a Network Load Balancer","Lower the desired capacity"],"a":[0],"e":"By default an ASG only uses EC2 status checks. Enabling ELB health checks makes the ASG replace instances that fail the application-level target group health check."},{"id":"saa-res34","d":"res","q":"An Amazon API Gateway REST API fronts a legacy backend that can only handle 100 requests per second. Traffic spikes above this cause backend crashes. Which configuration protects the backend?","o":["Set throttling limits (rate and burst) on the API stage or usage plans so excess requests receive HTTP 429","Increase the Lambda timeout","Enable CloudFront in front of the API","Enable API caching with a 0-second TTL"],"a":[0],"e":"API Gateway throttling rejects requests beyond the configured steady-state rate and burst with 429 responses, shielding the backend. Caching can also help for cacheable GETs, but throttling is the direct control."},{"id":"saa-perf01","d":"perf","q":"Users around the world upload large video files to a single Amazon S3 bucket in ap-southeast-1. Users far from the Region report slow uploads. Which change improves upload performance with minimal application changes?","o":["Enable S3 Transfer Acceleration on the bucket and use the accelerated endpoint","Create a bucket in every Region and have users choose","Front the bucket with an Application Load Balancer","Enable S3 Versioning"],"a":[0],"e":"Transfer Acceleration routes uploads to the nearest CloudFront edge location and then over the AWS backbone to the bucket, which speeds up long-distance transfers."},{"id":"saa-perf02","d":"perf","q":"An application uploads 5 GB files to Amazon S3 from EC2. Uploads are slow and a single network error forces a complete restart. What should the developer use?","o":["S3 multipart upload, uploading parts in parallel and retrying only failed parts","A single PUT request with a longer timeout","S3 Glacier Deep Archive","S3 Select"],"a":[0],"e":"Multipart upload splits large objects into parts that upload in parallel and can be retried individually. AWS recommends it for objects over 100 MB and requires it over 5 GB."},{"id":"saa-perf03","d":"perf","q":"A news site serves mostly static pages and images from EC2 instances behind an ALB. Traffic is global and the origin is under heavy load. Which solution improves performance and reduces origin load?","o":["Put an Amazon CloudFront distribution in front of the ALB and cache static content at edge locations","Add more EC2 instances in the same Region","Move the images to Amazon EFS","Enable sticky sessions"],"a":[0],"e":"CloudFront caches content close to users, cutting latency and the number of requests reaching the origin. It can also forward dynamic requests over the optimized AWS network."},{"id":"saa-perf04","d":"perf","q":"A company needs to run a self-managed relational database on EC2 that requires 40,000 consistent IOPS with sub-millisecond latency. Which EBS volume type should be used?","o":["Provisioned IOPS SSD (io2 Block Express or io1)","General Purpose SSD (gp2)","Throughput Optimized HDD (st1)","Cold HDD (sc1)"],"a":[0],"e":"Provisioned IOPS volumes are designed for I/O-intensive databases needing sustained high IOPS. gp3 tops out at 16,000 IOPS; st1 and sc1 are throughput-oriented HDDs for sequential workloads."},{"id":"saa-perf05","d":"perf","q":"A big-data application streams large log files sequentially from EBS volumes. The workload is throughput-bound rather than IOPS-bound, and cost matters. Which EBS volume type is MOST appropriate?","o":["Throughput Optimized HDD (st1)","Provisioned IOPS SSD (io2)","General Purpose SSD (gp3)","Cold HDD (sc1) for frequently accessed data"],"a":[0],"e":"st1 provides high throughput at low cost for large sequential workloads such as log processing and data warehousing. sc1 is cheaper still but intended for infrequently accessed data."},{"id":"saa-perf06","d":"perf","q":"A video-transcoding job writes large temporary scratch files that are discarded when the job completes. The team wants the highest possible local disk performance at the lowest cost. Which storage should the instances use?","o":["Instance store volumes on a storage-optimized instance family","Provisioned IOPS EBS volumes","Amazon EFS","Amazon S3"],"a":[0],"e":"Instance store is physically attached NVMe or SSD storage with very high IOPS and no extra charge. Because data is lost when the instance stops, it suits temporary scratch data only."},{"id":"saa-perf07","d":"perf","q":"A research team runs a high-performance computing workload on hundreds of EC2 instances that must process a dataset stored in Amazon S3 at hundreds of GB/s with sub-millisecond latency. Which file system should be used?","o":["Amazon FSx for Lustre linked to the S3 bucket","Amazon EFS Standard","Amazon FSx for Windows File Server","Amazon EBS gp3"],"a":[0],"e":"FSx for Lustre is built for HPC and machine learning, provides massive parallel throughput, and can lazily load and write back data to a linked S3 bucket."},{"id":"saa-perf08","d":"perf","q":"A company is migrating a Windows application that relies on SMB file shares and Active Directory permissions. Which AWS storage service provides a fully managed SMB file system?","o":["Amazon FSx for Windows File Server","Amazon EFS","Amazon S3","Amazon FSx for Lustre"],"a":[0],"e":"FSx for Windows File Server provides native SMB shares with NTFS permissions and AD integration. EFS is NFS-based and intended for Linux workloads."},{"id":"saa-perf09","d":"perf","q":"A DynamoDB table backs a product catalog that is read millions of times per hour with a highly repetitive access pattern. The application needs microsecond read latency without code changes beyond the client library. Which solution should be used?","o":["DynamoDB Accelerator (DAX) in front of the table","Increase the provisioned read capacity","DynamoDB global tables","DynamoDB Streams"],"a":[0],"e":"DAX is an in-memory cache for DynamoDB that is API-compatible, delivering microsecond reads for read-heavy, repeat-access workloads."},{"id":"saa-perf10","d":"perf","q":"Whenever an item in a DynamoDB table changes, a downstream function must be triggered to update a search index, with no polling. Which feature enables this?","o":["DynamoDB Streams with an AWS Lambda trigger","A scheduled Lambda that scans the table every minute","DynamoDB on-demand backups","DAX"],"a":[0],"e":"DynamoDB Streams captures item-level changes in order, and Lambda can be configured as an event source to process them in near real time."},{"id":"saa-perf11","d":"perf","q":"An Amazon RDS for PostgreSQL database is CPU-bound because of heavy reporting queries, which slow down the transactional workload. Which change improves performance with minimal application changes?","o":["Create a read replica and direct reporting queries to it","Enable Multi-AZ","Increase the backup retention period","Enable storage autoscaling"],"a":[0],"e":"Read replicas offload read-only traffic from the primary. Multi-AZ standbys cannot serve reads in RDS (except for RDS Multi-AZ DB clusters), so they do not help with query load."},{"id":"saa-perf12","d":"perf","q":"A development environment database is used intermittently, with unpredictable bursts during testing and long idle periods. The team wants PostgreSQL compatibility and capacity that scales automatically in fine-grained increments. Which option should be used?","o":["Amazon Aurora Serverless v2","Amazon RDS for PostgreSQL on a large instance","Amazon Redshift","Amazon DynamoDB"],"a":[0],"e":"Aurora Serverless v2 scales capacity in fractions of an ACU in seconds based on load, which fits intermittent, spiky workloads without over-provisioning."},{"id":"saa-perf13","d":"perf","q":"A mobile game needs a real-time leaderboard that ranks millions of players and updates instantly, plus storage for player session state. Which service is BEST suited?","o":["Amazon ElastiCache for Redis using sorted sets","Amazon RDS for MySQL","Amazon S3","Amazon Redshift"],"a":[0],"e":"Redis sorted sets provide O(log N) ranking operations in memory, which is the classic pattern for leaderboards, and Redis also serves as a fast session store."},{"id":"saa-perf14","d":"perf","q":"A company stores clickstream logs in Amazon S3 and wants analysts to run ad hoc SQL queries across them several times a week without provisioning any infrastructure. Which service should be used?","o":["Amazon Athena","Amazon Redshift provisioned cluster","Amazon RDS","Amazon EMR"],"a":[0],"e":"Athena is serverless and queries data in place in S3 with standard SQL, billed per data scanned. A Redshift cluster would be over-provisioned for occasional ad hoc queries."},{"id":"saa-perf15","d":"perf","q":"IoT sensors emit thousands of records per second that must be delivered to Amazon S3 in near real time for later analysis, with optional format conversion to Parquet and no custom consumer code. Which service should be used?","o":["Amazon Kinesis Data Firehose (Amazon Data Firehose)","Amazon Kinesis Data Streams with a custom consumer","Amazon SQS","AWS DataSync"],"a":[0],"e":"Firehose is a fully managed delivery stream that buffers, optionally transforms and converts records, and writes to S3, Redshift, OpenSearch, and other destinations with no consumers to run."},{"id":"saa-perf16","d":"perf","q":"A tightly coupled HPC simulation uses MPI across many EC2 instances and is sensitive to network latency between nodes. Which configuration gives the lowest inter-node latency?","o":["A cluster placement group with instances that support Elastic Fabric Adapter (EFA)","A spread placement group across Availability Zones","Instances in different Regions","A partition placement group across many racks"],"a":[0],"e":"Cluster placement groups pack instances close together in one AZ for low-latency, high-bandwidth networking, and EFA provides OS-bypass networking for MPI workloads."},{"id":"saa-perf17","d":"perf","q":"A company runs three critical EC2 instances that must not share underlying hardware, so that a single rack failure affects at most one of them. Which placement strategy should be used?","o":["Spread placement group","Cluster placement group","Partition placement group with one partition","Dedicated Hosts in one rack"],"a":[0],"e":"A spread placement group places each instance on distinct hardware racks. Cluster groups do the opposite; partition groups spread groups of instances across partitions, used for large distributed systems like Hadoop."},{"id":"saa-perf18","d":"perf","q":"A data-processing task runs once a day and takes about 45 minutes. The team wants a serverless or container-based approach without running EC2 hosts. Which option is appropriate?","o":["An Amazon ECS task on AWS Fargate scheduled by Amazon EventBridge","A single AWS Lambda function invoked by EventBridge","An Amazon SQS queue consumed by Lambda","AWS Step Functions calling a Lambda function with a 45-minute timeout"],"a":[0],"e":"Lambda functions are limited to 15 minutes per invocation. Fargate runs containers for as long as needed without managing hosts, and EventBridge can schedule the task."},{"id":"saa-perf19","d":"perf","q":"A genomics company needs to run hundreds of thousands of batch jobs with varying CPU and memory needs, using Spot capacity where possible, with job queues and dependencies managed for them. Which service should be used?","o":["AWS Batch","AWS Lambda","Amazon EC2 Auto Scaling alone","Amazon Lightsail"],"a":[0],"e":"AWS Batch provisions the optimal compute (including Spot) based on job requirements and manages queues, priorities, and dependencies for large-scale batch processing."},{"id":"saa-perf20","d":"perf","q":"A multiplayer game uses UDP and has players worldwide. The company wants to reduce latency and jitter by moving player traffic onto the AWS global network as close to the player as possible. Which service should be used?","o":["AWS Global Accelerator","Amazon CloudFront","Amazon Route 53 latency-based routing alone","An Application Load Balancer"],"a":[0],"e":"Global Accelerator supports TCP and UDP, ingests traffic at the nearest edge location, and routes it over the AWS backbone. CloudFront and ALBs are HTTP-oriented."},{"id":"saa-perf21","d":"perf","q":"A company deploys its web application in three Regions. Users should be sent to the Region that gives them the lowest network latency. Which Route 53 routing policy should be used?","o":["Latency-based routing","Geolocation routing","Weighted routing","Failover routing"],"a":[0],"e":"Latency-based routing answers with the record for the Region that has the lowest measured latency to the user's resolver. Geolocation routes by where the user is, not by measured performance."},{"id":"saa-perf22","d":"perf","q":"A company runs several microservices on EC2 behind a single endpoint. Requests to /api/orders should go to the orders fleet and /api/users to the users fleet. Which load balancer feature enables this?","o":["Application Load Balancer with path-based routing rules to different target groups","Network Load Balancer with TCP listeners","Classic Load Balancer","Gateway Load Balancer"],"a":[0],"e":"ALBs operate at layer 7 and support routing rules based on path, host header, query strings, and more, forwarding to different target groups."},{"id":"saa-perf23","d":"perf","q":"A financial trading platform needs a load balancer that handles millions of requests per second with ultra-low latency, preserves client source IPs, and exposes a static IP address per Availability Zone. Which load balancer should be used?","o":["Network Load Balancer","Application Load Balancer","Classic Load Balancer","Gateway Load Balancer"],"a":[0],"e":"NLBs operate at layer 4, offer static or Elastic IPs per AZ, preserve source IPs, and are built for extreme performance. ALBs add HTTP processing and do not provide static IPs."},{"id":"saa-perf24","d":"perf","q":"A company has 40 VPCs across several accounts that need full connectivity to each other and to the data center. VPC peering has become unmanageable because peering is not transitive. Which service simplifies this?","o":["AWS Transit Gateway","More VPC peering connections","AWS PrivateLink","Internet gateways with public routing"],"a":[0],"e":"Transit Gateway is a regional hub that routes between many VPCs and on-premises connections transitively, replacing a mesh of peering connections."},{"id":"saa-perf25","d":"perf","q":"A company transfers tens of terabytes daily between its data center and AWS and needs consistent, high-bandwidth, low-latency connectivity that does not depend on the public internet. Which option should be used?","o":["AWS Direct Connect","AWS Site-to-Site VPN","AWS Snowball Edge","Amazon CloudFront"],"a":[0],"e":"Direct Connect offers dedicated 1 to 100 Gbps connections with predictable performance. VPN throughput is limited and runs over the internet; Snowball is for offline bulk transfers."},{"id":"saa-perf26","d":"perf","q":"An application writes millions of small objects per hour to one S3 bucket and reads them back at high rates. Which practice helps achieve the highest request throughput?","o":["Distribute keys across multiple prefixes, since S3 scales request rates per prefix","Store all objects under a single prefix for simplicity","Use S3 Glacier Flexible Retrieval","Enable S3 Versioning"],"a":[0],"e":"S3 supports at least 3,500 PUT/COPY/POST/DELETE and 5,500 GET/HEAD requests per second per prefix, and more prefixes scale throughput in parallel."},{"id":"saa-perf27","d":"perf","q":"An operations team needs to search and visualize terabytes of application logs with full-text queries and near-real-time dashboards. Which managed service should be used?","o":["Amazon OpenSearch Service","Amazon Athena","Amazon RDS","Amazon Neptune"],"a":[0],"e":"OpenSearch Service is built for log analytics and full-text search with OpenSearch Dashboards. Athena is good for ad hoc SQL but is not an interactive search and dashboard engine."},{"id":"saa-perf28","d":"perf","q":"A data science team needs to run Apache Spark jobs over petabytes of data in S3, with full control over cluster configuration and the option to use Spot Instances. Which service should be used?","o":["Amazon EMR","AWS Glue DataBrew","Amazon Athena","Amazon QuickSight"],"a":[0],"e":"EMR runs managed Hadoop, Spark, Presto, and other frameworks on EC2 (including Spot) or on EKS, giving control over the cluster. Glue is serverless ETL with less control over the engine."},{"id":"saa-perf29","d":"perf","q":"Consumers poll an Amazon SQS queue continuously. Many ReceiveMessage calls return empty responses, increasing cost and CPU use. What should be changed?","o":["Enable long polling by setting ReceiveMessageWaitTimeSeconds up to 20 seconds","Increase the visibility timeout","Switch to a FIFO queue","Reduce the message retention period"],"a":[0],"e":"Long polling waits for messages to arrive before returning, reducing empty responses and API calls. Short polling returns immediately even when the queue is empty."},{"id":"saa-perf30","d":"perf","q":"A latency-sensitive API runs on AWS Lambda. Users experience slow first requests after idle periods because of cold starts. Which change reduces this latency?","o":["Configure provisioned concurrency for the function","Increase the function timeout","Reduce the memory allocation","Move the function to a different Region"],"a":[0],"e":"Provisioned concurrency keeps a specified number of execution environments initialized and ready, eliminating cold-start latency for those invocations."},{"id":"saa-perf31","d":"perf","q":"A machine learning inference service needs GPU-accelerated containers orchestrated by Amazon ECS. Which launch type and instance choice are required?","o":["The EC2 launch type with GPU instance families such as P or G","AWS Fargate with the default CPU configuration","AWS Lambda container images","Amazon Lightsail containers"],"a":[0],"e":"GPU workloads on ECS run on the EC2 launch type with GPU-enabled instances and the ECS GPU-optimized AMI. Fargate does not provide GPUs for ECS tasks."},{"id":"saa-cost01","d":"cost","q":"A company stores several petabytes of data in Amazon S3. Access patterns are unpredictable: some objects are read daily and others not for months. The company wants to minimize cost without operational overhead or retrieval delays. Which storage class should be used?","o":["S3 Intelligent-Tiering","S3 Standard-IA","S3 Glacier Flexible Retrieval","S3 One Zone-IA"],"a":[0],"e":"Intelligent-Tiering automatically moves objects between frequent, infrequent, and archive-instant tiers based on access, with no retrieval fees and only a small monitoring charge."},{"id":"saa-cost02","d":"cost","q":"Medical images must be retained for 10 years. They are accessed roughly once per quarter and, when needed, must be available within milliseconds. Which storage class gives the LOWEST cost that meets the retrieval requirement?","o":["S3 Glacier Instant Retrieval","S3 Glacier Deep Archive","S3 Glacier Flexible Retrieval","S3 Standard"],"a":[0],"e":"Glacier Instant Retrieval offers archive pricing with millisecond access for data accessed about once a quarter. Flexible Retrieval and Deep Archive take minutes to hours to restore."},{"id":"saa-cost03","d":"cost","q":"An S3 bucket's storage costs keep rising even though the team deletes old files. Investigation shows many old object versions and incomplete multipart uploads. Which actions reduce cost? (Choose TWO.)","o":["Add a lifecycle rule to expire noncurrent object versions after a set number of days","Add a lifecycle rule to abort incomplete multipart uploads after 7 days","Enable S3 Transfer Acceleration","Switch the bucket to Requester Pays","Enable Cross-Region Replication"],"a":[0,1],"e":"Noncurrent versions and abandoned multipart parts are both billed as storage. Lifecycle rules can expire noncurrent versions and abort incomplete multipart uploads automatically."},{"id":"saa-cost04","d":"cost","q":"A company runs a nightly image-processing job on EC2 that can be checkpointed and restarted at any time. It wants the lowest compute cost. Which option should be used?","o":["Spot Instances, possibly across several instance types for availability","On-Demand Instances","Reserved Instances","Dedicated Hosts"],"a":[0],"e":"Spot Instances cost up to 90% less than On-Demand. Workloads that tolerate interruption and are flexible about instance type are the ideal fit."},{"id":"saa-cost05","d":"cost","q":"A web application's Auto Scaling group runs a baseline of 10 instances around the clock and scales up to 40 during the day. How should the company purchase capacity to minimize cost while keeping flexibility?","o":["Cover the 10-instance baseline with Reserved Instances or a Savings Plan and use On-Demand (or Spot, if tolerated) for the variable portion","Buy Reserved Instances for 40 instances","Use On-Demand for everything","Use Spot Instances for the baseline"],"a":[0],"e":"Commitment discounts should cover only the steady-state floor. The variable peak is served by On-Demand or Spot so you do not pay for reserved capacity that sits idle at night."},{"id":"saa-cost06","d":"cost","q":"A company runs a mix of EC2 instances across several families and Regions, plus AWS Fargate and Lambda workloads. It wants a single commitment that discounts all of these and allows changing instance families later. Which option should it choose?","o":["Compute Savings Plans","EC2 Instance Savings Plans","Standard Reserved Instances","Convertible Reserved Instances"],"a":[0],"e":"Compute Savings Plans apply to any EC2 instance family, size, OS, tenancy, or Region, and to Fargate and Lambda, in exchange for an hourly spend commitment. EC2 Instance Savings Plans lock to a family and Region."},{"id":"saa-cost07","d":"cost","q":"A production Amazon RDS for MySQL database runs continuously and its size will not change for the next three years. How can the company reduce its cost?","o":["Purchase a three-year RDS Reserved Instance for the database","Convert the database to Aurora Serverless v2","Stop the instance at night","Reduce the backup retention period to zero"],"a":[0],"e":"RDS Reserved Instances discount steady-state databases by up to about 70% for a one- or three-year term. Stopping a production database is not an option, and backup retention barely affects cost."},{"id":"saa-cost08","d":"cost","q":"A company suspects many of its EC2 instances are over-provisioned. It wants data-driven recommendations for smaller instance types based on actual CPU, memory, and network utilization. Which service should it use?","o":["AWS Compute Optimizer","AWS Pricing Calculator","AWS Budgets","AWS Artifact"],"a":[0],"e":"Compute Optimizer analyzes CloudWatch metrics and recommends right-sized EC2 instances, Auto Scaling groups, EBS volumes, and Lambda memory settings."},{"id":"saa-cost09","d":"cost","q":"EC2 instances in private subnets transfer hundreds of terabytes per month to Amazon S3 through a NAT gateway. The NAT gateway data-processing charges are now the largest line on the bill. What should the architect do?","o":["Create a gateway VPC endpoint for S3 so traffic bypasses the NAT gateway at no extra charge","Replace the NAT gateway with two NAT gateways","Move the instances to public subnets","Enable S3 Transfer Acceleration"],"a":[0],"e":"Gateway endpoints for S3 and DynamoDB carry no hourly or data-processing charges, and traffic to S3 no longer flows through the NAT gateway."},{"id":"saa-cost10","d":"cost","q":"A company serves large static files to users worldwide directly from an S3 bucket. Data transfer out charges are high. Which change reduces cost and improves performance?","o":["Serve the files through Amazon CloudFront, which has lower data transfer rates and caches at the edge, with free transfer from S3 to CloudFront","Move the files to Amazon EBS","Compress the files into Glacier Deep Archive","Use S3 Transfer Acceleration"],"a":[0],"e":"Data transfer from S3 to CloudFront is free, and CloudFront's egress pricing is lower than S3's in most Regions. Caching also reduces requests to S3."},{"id":"saa-cost11","d":"cost","q":"A development team's Amazon RDS databases are only used during working hours on weekdays. The team wants to cut cost with no application changes. What should the architect recommend?","o":["Stop the RDS instances outside working hours using AWS Instance Scheduler or an EventBridge-triggered Lambda function (restarting within 7 days)","Switch to Multi-AZ","Buy Reserved Instances for the development databases","Increase the instance size so queries finish faster"],"a":[0],"e":"Stopped RDS instances incur only storage costs. RDS automatically restarts a stopped instance after 7 days, so a schedule must stop it again if needed."},{"id":"saa-cost12","d":"cost","q":"A new application's DynamoDB traffic is unpredictable with large, infrequent spikes, and the team does not want to manage capacity. Which capacity mode minimizes cost and effort for this pattern?","o":["On-demand capacity mode","Provisioned capacity with a high fixed read and write capacity","Provisioned capacity with reserved capacity","DAX"],"a":[0],"e":"On-demand mode charges per request and scales instantly, suiting unknown or spiky workloads. Provisioned capacity with auto scaling is cheaper only for steady, predictable traffic."},{"id":"saa-cost13","d":"cost","q":"A company runs a small API on a t3.large EC2 instance that receives about 200 requests per day. The instance is idle most of the time. Which change would reduce cost the MOST?","o":["Rewrite the API as AWS Lambda functions behind Amazon API Gateway and pay per request","Move to a t3.medium instance","Buy a Reserved Instance for the t3.large","Add an Application Load Balancer"],"a":[0],"e":"For sporadic traffic, serverless pay-per-use is far cheaper than an always-on instance; 200 requests per day fall within the Lambda and API Gateway free tiers."},{"id":"saa-cost14","d":"cost","q":"A company has hundreds of gp2 EBS volumes. Performance requirements are modest and unchanged. Which action lowers EBS cost with no downtime?","o":["Migrate the volumes from gp2 to gp3, which is about 20% cheaper with the same baseline performance","Convert the volumes to io2","Convert the volumes to sc1","Increase the size of each volume"],"a":[0],"e":"gp3 costs less per GB than gp2 and provides 3,000 IOPS and 125 MB/s baseline regardless of size. The volume type can be modified in place."},{"id":"saa-cost15","d":"cost","q":"An A
