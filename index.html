h VPC private IPs; public VIFs reach AWS public endpoints over Direct Connect; transit VIFs connect to Transit Gateways through a Direct Connect gateway."},{"id":"soa-net10","d":"net","q":"A company wants the zone apex record example.com to point to an Application Load Balancer. A CNAME record fails to create. What should the engineer use?","o":["A Route 53 alias record pointing to the ALB","A CNAME at the apex after enabling DNSSEC","A TXT record","An MX record"],"a":[0],"e":"DNS does not allow CNAME at the zone apex. Route 53 alias records map the apex to AWS resources (ALB, CloudFront, S3, and more) and are free to query."},{"id":"soa-net11","d":"net","q":"An engineer created a Route 53 private hosted zone for internal.example.com and associated it with a VPC, but EC2 instances in the VPC cannot resolve the names. What should be checked?","o":["That the VPC has enableDnsHostnames and enableDnsSupport set to true","That the VPC has an internet gateway","That the hosted zone is public","That the instances have Elastic IPs"],"a":[0],"e":"Private hosted zones require both DNS attributes enabled on the VPC so that the Amazon-provided resolver answers queries for the zone."},{"id":"soa-net12","d":"net","q":"On-premises servers need to resolve names in a Route 53 private hosted zone, and EC2 instances need to resolve names hosted on the on-premises DNS servers, over a Direct Connect link. What should the engineer configure?","o":["Route 53 Resolver inbound and outbound endpoints with forwarding rules for the on-premises domain","A public hosted zone for the internal names","An internet gateway","A CloudFront distribution"],"a":[0],"e":"Inbound endpoints let on-premises resolvers query VPC DNS; outbound endpoints with rules forward specific domains from the VPC to on-premises DNS."},{"id":"soa-net13","d":"net","q":"After deploying new static files to an S3 origin, users still see old content through CloudFront. The team needs the new files served immediately. Which actions work? (Choose TWO.)","o":["Create a CloudFront invalidation for the changed paths","Use versioned object names (for example app.v2.js) so new files have new cache keys","Disable the distribution","Delete the S3 bucket","Enable S3 Transfer Acceleration"],"a":[0,1],"e":"Invalidations remove cached objects at the edge (first 1,000 paths per month free). Versioned file names avoid the problem entirely and are the recommended approach for frequent changes."},{"id":"soa-net14","d":"net","q":"An Application Load Balancer returns HTTP 502 Bad Gateway errors for some requests. Which are likely causes? (Choose TWO.)","o":["The target closed the connection or returned a malformed response (for example the application crashed mid-request)","The target's keep-alive timeout is shorter than the ALB idle timeout, so the ALB reuses a connection the target already closed","The client sent a request larger than 1 KB","The ALB has too many listeners","The health check path returns 200"],"a":[0,1],"e":"502 means the ALB got an invalid or no response from the target. Mismatched keep-alive timeouts and application errors are the most common sources."},{"id":"soa-net15","d":"net","q":"A security group rule references another security group as its source. Instances in a peered VPC in the same Region carry that source security group, but their traffic is still blocked. Why might this be?","o":["Referencing a security group across a peering connection works only within the same Region; for other Regions, CIDR ranges must be used instead","Security groups cannot reference other groups at all","Peered VPCs ignore security groups","The security group must be attached to the peering connection"],"a":[0],"e":"Cross-VPC security group references are supported over intra-Region peering (and must reference the peer's group ID). Inter-Region peering requires CIDR-based rules."},{"id":"soa-net16","d":"net","q":"A network ACL allows inbound TCP 443 from 0.0.0.0/0 and denies everything else inbound; outbound allows only TCP 443. HTTPS clients cannot complete connections to instances in the subnet. What is wrong?","o":["Outbound rules must allow ephemeral ports (1024-65535) for return traffic because NACLs are stateless","Inbound must also allow port 80","The NACL must be attached to the instances","NACLs cannot allow 0.0.0.0/0"],"a":[0],"e":"Responses leave the subnet to the client's ephemeral source port, so with a stateless NACL the outbound rule set must permit that range."},{"id":"soa-net17","d":"net","q":"An application in a private subnet calls the Amazon SQS API, but DNS still resolves to public SQS IP addresses even after an interface VPC endpoint for SQS was created. What should be enabled so the standard endpoint name resolves to the private endpoint?","o":["Private DNS on the interface endpoint (requires the VPC DNS attributes enabled)","A NAT gateway","A Route 53 public hosted zone","A gateway endpoint instead"],"a":[0],"e":"With private DNS enabled, the service's default DNS name resolves to the endpoint's private IPs inside the VPC, so applications need no code changes."},{"id":"soa-net18","d":"net","q":"A VPC Flow Logs record shows traffic from 203.0.113.5 to an instance on port 22 with action REJECT. The engineer wants to know which control rejected it. What can be concluded?","o":["Either the security group or the network ACL blocked the traffic; flow logs do not say which, so review both for port 22 from that source","The instance's OS firewall rejected it","The internet gateway rejected it","Route 53 rejected it"],"a":[0],"e":"Flow logs capture the accept/reject decision at the ENI but do not identify whether a security group or NACL was responsible. The engineer must check both (Reachability Analyzer can help)."},{"id":"soa-net19","d":"net","q":"An engineer must determine why an EC2 instance cannot reach an RDS instance in another subnet, checking route tables, security groups, and NACLs along the path without sending any test traffic. Which tool provides this analysis?","o":["VPC Reachability Analyzer","VPC Flow Logs","CloudWatch Logs Insights","Amazon Inspector"],"a":[0],"e":"Reachability Analyzer performs static configuration analysis between a source and destination and reports the blocking component and rule when a path is not reachable."},{"id":"soa-net20","d":"net","q":"An EC2 instance's public IP address changed after the instance was stopped and started, breaking an external partner's firewall allow list. How can the engineer keep the address stable?","o":["Allocate an Elastic IP address and associate it with the instance","Enable detailed monitoring","Use a larger instance type","Attach a second network interface"],"a":[0],"e":"Auto-assigned public IPs are released on stop. Elastic IPs are static and stay associated until you release them."},{"id":"soa-net21","d":"net","q":"An engineer must choose between Amazon CloudFront and AWS Global Accelerator for a non-HTTP gaming application using UDP that needs static entry IP addresses and fast regional failover. Which should be used, and why?","o":["Global Accelerator, because it supports TCP and UDP, provides static anycast IPs, and routes to healthy regional endpoints","CloudFront, because it caches UDP packets at the edge","CloudFront, because it provides static IP addresses","Either, since they are equivalent"],"a":[0],"e":"CloudFront is an HTTP(S) content delivery network. Global Accelerator works at the network layer for any TCP or UDP application and provides static IPs with health-based routing."},{"id":"soa-net22","d":"net","q":"A Route 53 health check for a web endpoint keeps reporting unhealthy even though the site works from the office. The endpoint's security group only allows the office IP range. What should be fixed?","o":["Allow inbound traffic from the Route 53 health checker IP ranges in the security group (or use a CloudWatch alarm-based health check)","Change the health check to TCP","Increase the TTL on the DNS record","Move the endpoint to a private subnet"],"a":[0],"e":"Route 53 health checkers run from published AWS IP ranges around the world; if the endpoint blocks them, the check fails regardless of real health."},{"id":"soa-net23","d":"net","q":"Instances in a private subnet need IPv6 outbound access to the internet but must not accept inbound IPv6 connections initiated from the internet. Which VPC component provides this?","o":["An egress-only internet gateway with a ::/0 route in the private subnet route table","A NAT gateway","An internet gateway","A virtual private gateway"],"a":[0],"e":"Egress-only internet gateways are the IPv6 equivalent of a NAT gateway: stateful, outbound-only. NAT gateways do not perform IPv6-to-IPv6 translation for this purpose."}],"kcna":[{"id":"kcna-fund01","d":"fund","q":"What is the smallest deployable unit that Kubernetes schedules onto a node?","o":["A Pod","A container","A Deployment","A ReplicaSet"],"a":[0],"e":"Kubernetes does not schedule containers directly. A Pod wraps one or more containers that share a network namespace and storage, and the scheduler places Pods on nodes."},{"id":"kcna-fund02","d":"fund","q":"Which control plane component stores the entire cluster state and is the only component the API server writes to?","o":["etcd","kube-scheduler","kubelet","kube-controller-manager"],"a":[0],"e":"etcd is the consistent, highly available key-value store for all cluster data. Every other component reads and writes state through the API server, which is etcd's only client."},{"id":"kcna-fund03","d":"fund","q":"Which component watches for newly created Pods that have no node assigned and selects a node for them to run on?","o":["kube-scheduler","kubelet","kube-proxy","cloud-controller-manager"],"a":[0],"e":"The scheduler filters nodes that satisfy a Pod's requirements (resources, affinity, taints) and scores the remaining ones, then binds the Pod to the best node."},{"id":"kcna-fund04","d":"fund","q":"Which node component is responsible for making sure the containers described in a PodSpec are running and healthy on its node?","o":["kubelet","kube-proxy","kube-controller-manager","containerd alone"],"a":[0],"e":"The kubelet is the node agent that talks to the API server, pulls PodSpecs, instructs the container runtime via the CRI, and reports status."},{"id":"kcna-fund05","d":"fund","q":"Which node component maintains network rules so that traffic to a Service's ClusterIP is forwarded to the right backend Pods?","o":["kube-proxy","kubelet","CoreDNS","kube-scheduler"],"a":[0],"e":"kube-proxy programs iptables, IPVS, or nftables rules (or is replaced by a CNI such as Cilium) to implement Service virtual IPs on each node."},{"id":"kcna-fund06","d":"fund","q":"Which control plane component runs the loops that watch the cluster state and move it toward the desired state, such as the ReplicaSet and Node controllers?","o":["kube-controller-manager","kube-apiserver","etcd","kubelet"],"a":[0],"e":"The controller manager bundles many controllers into one process; each controller reconciles a resource type (ReplicaSets, Jobs, Endpoints, nodes, and so on)."},{"id":"kcna-fund07","d":"fund","q":"A developer wants to run three identical copies of a stateless web server and have Kubernetes replace any copy that fails, with rolling updates when the image changes. Which object should be created?","o":["A Deployment","A single Pod","A DaemonSet","A Job"],"a":[0],"e":"A Deployment manages ReplicaSets, which keep the desired number of Pod replicas running, and adds rollout and rollback behavior for updates."},{"id":"kcna-fund08","d":"fund","q":"What is the relationship between a Deployment, a ReplicaSet, and Pods?","o":["A Deployment creates and manages ReplicaSets, and each ReplicaSet maintains a set of identical Pods","A ReplicaSet creates Deployments, which create Pods","Pods create ReplicaSets when they scale","They are three names for the same object"],"a":[0],"e":"Deployments are the user-facing abstraction; each revision of a Deployment is a ReplicaSet that owns its Pods. Users rarely create ReplicaSets directly."},{"id":"kcna-fund09","d":"fund","q":"A logging agent must run exactly one Pod on every node in the cluster, including nodes added later. Which workload resource should be used?","o":["A DaemonSet","A Deployment with replicas equal to the node count","A StatefulSet","A CronJob"],"a":[0],"e":"DaemonSets ensure a copy of a Pod runs on all (or selected) nodes and automatically add Pods to new nodes. Typical uses are log shippers, monitoring agents, and CNI plugins."},{"id":"kcna-fund10","d":"fund","q":"A database cluster needs stable network identities (pod-0, pod-1), ordered startup, and a persistent volume that follows each Pod across restarts. Which workload resource should be used?","o":["A StatefulSet","A Deployment","A DaemonSet","A ReplicaSet"],"a":[0],"e":"StatefulSets give each Pod a stable ordinal name and hostname, ordered deployment and scaling, and per-Pod PersistentVolumeClaims via volumeClaimTemplates."},{"id":"kcna-fund11","d":"fund","q":"A data-processing task must run to completion once and be retried if it fails, then stop. Which resource should be used?","o":["A Job","A Deployment","A DaemonSet","A Service"],"a":[0],"e":"Jobs create Pods and track successful completions, retrying on failure up to backoffLimit. Deployments keep Pods running forever, which is wrong for one-off tasks."},{"id":"kcna-fund12","d":"fund","q":"A report must be generated every night at 02:00. Which Kubernetes resource schedules this?","o":["A CronJob","A Job with a sleep command","A DaemonSet","A ReplicaSet"],"a":[0],"e":"CronJobs create Jobs on a cron-style schedule and manage history limits and concurrency policies."},{"id":"kcna-fund13","d":"fund","q":"Which Kubernetes object provides a stable virtual IP and DNS name that load balances traffic to a set of Pods selected by labels?","o":["A Service","An Ingress","A ConfigMap","A Namespace"],"a":[0],"e":"Services decouple clients from individual Pod IPs, which change as Pods are replaced. The Endpoints/EndpointSlice controller keeps the backend list current using the label selector."},{"id":"kcna-fund14","d":"fund","q":"Which Service type exposes a Service on a static port on every node's IP address?","o":["NodePort","ClusterIP","LoadBalancer","ExternalName"],"a":[0],"e":"NodePort allocates a port (default range 30000-32767) on each node and forwards it to the Service. ClusterIP is internal only; LoadBalancer provisions an external cloud load balancer on top of NodePort."},{"id":"kcna-fund15","d":"fund","q":"What is the default Service type if none is specified?","o":["ClusterIP","NodePort","LoadBalancer","ExternalName"],"a":[0],"e":"ClusterIP exposes the Service on an internal cluster IP reachable only from within the cluster."},{"id":"kcna-fund16","d":"fund","q":"Which Service type returns a CNAME record pointing to an external DNS name instead of proxying to Pods?","o":["ExternalName","ClusterIP","NodePort","Headless"],"a":[0],"e":"ExternalName Services map a Service name to an external DNS name via CNAME, which is useful for referencing services outside the cluster through in-cluster names."},{"id":"kcna-fund17","d":"fund","q":"A developer needs to inject non-sensitive configuration, such as a log level and a feature flag, into a container as environment variables or files. Which resource should be used?","o":["A ConfigMap","A Secret","A PersistentVolume","A ServiceAccount"],"a":[0],"e":"ConfigMaps hold non-confidential key-value data that Pods consume as env vars, command-line arguments, or mounted files. Secrets are for sensitive data."},{"id":"kcna-fund18","d":"fund","q":"Which statement about Kubernetes Secrets is correct?","o":["Secret data is base64-encoded by default, which is not encryption; encryption at rest in etcd must be configured separately","Secrets are always encrypted with AES in etcd by default","Secrets cannot be mounted as files","Secrets are stored in ConfigMaps"],"a":[0],"e":"Base64 is an encoding, not protection. Securing Secrets requires enabling etcd encryption at rest, RBAC restrictions, and ideally an external secret manager."},{"id":"kcna-fund19","d":"fund","q":"What is the purpose of a Kubernetes Namespace?","o":["To divide cluster resources into logical, isolated groups for multiple teams or projects, with scoped names, RBAC, and quotas","To provide network isolation between Pods by default","To create a separate cluster for each team","To store container images"],"a":[0],"e":"Namespaces scope resource names and let you apply RBAC, ResourceQuotas, and LimitRanges per group. They do not isolate network traffic by themselves; NetworkPolicies do that."},{"id":"kcna-fund20","d":"fund","q":"Which of the following objects are cluster-scoped rather than namespaced? (Choose TWO.)","o":["Node","PersistentVolume","Pod","Service","ConfigMap"],"a":[0,1],"e":"Nodes, PersistentVolumes, Namespaces, ClusterRoles, and StorageClasses exist at cluster level. Pods, Services, ConfigMaps, and PersistentVolumeClaims live inside a namespace."},{"id":"kcna-fund21","d":"fund","q":"What are labels used for in Kubernetes?","o":["Key-value pairs attached to objects that are used to select and group them, for example by Services, ReplicaSets, and kubectl queries","Human-readable notes that tools ignore","Unique identifiers assigned by the API server","Container environment variables"],"a":[0],"e":"Labels drive selection: a Service's selector or a Deployment's matchLabels picks Pods by their labels. Annotations are the place for non-identifying metadata."},{"id":"kcna-fund22","d":"fund","q":"How do annotations differ from labels?","o":["Annotations store arbitrary non-identifying metadata (such as build info or tool configuration) and cannot be used in selectors","Annotations are used by selectors; labels are not","Annotations are limited to 63 characters; labels are not","There is no difference"],"a":[0],"e":"Labels are for identification and selection with strict syntax. Annotations hold larger, unstructured metadata consumed by tools and controllers, such as Ingress controller settings."},{"id":"kcna-fund23","d":"fund","q":"A developer applies a YAML manifest with kubectl apply -f deploy.yaml. Which component receives and validates the request first?","o":["kube-apiserver","etcd","kube-scheduler","kubelet"],"a":[0],"e":"All cluster operations go through the API server, which authenticates, authorizes, runs admission controllers, validates the object, and then persists it to etcd."},{"id":"kcna-fund24","d":"fund","q":"What does it mean that Kubernetes uses a declarative model?","o":["Users describe the desired state in manifests, and controllers continuously reconcile the actual state to match it","Users issue step-by-step commands that Kubernetes executes once","Kubernetes requires a script for every change","Objects cannot be modified after creation"],"a":[0],"e":"In the declarative model you state what you want (for example 3 replicas), not how to get there. Control loops observe, compare, and act until the live state matches."},{"id":"kcna-fund25","d":"fund","q":"Which command shows the API resource types supported by a cluster, including whether each is namespaced and its short name?","o":["kubectl api-resources","kubectl get all","kubectl describe api","kubectl cluster-info"],"a":[0],"e":"kubectl api-resources lists resource kinds, their API groups, short names, and scope. kubectl api-versions lists the available API group versions."},{"id":"kcna-fund26","d":"fund","q":"In the apiVersion field apps/v1, what do apps and v1 represent?","o":["The API group and the version of that group","The namespace and the release","The vendor and the kubectl version","The container runtime and its version"],"a":[0],"e":"Kubernetes APIs are organized into groups (core, apps, batch, networking.k8s.io, and so on), each versioned independently; Deployments live in apps/v1, Pods in the core group v1."},{"id":"kcna-fund27","d":"fund","q":"Which API version stability level indicates that a feature is disabled by default and may be dropped without notice?","o":["Alpha (for example v1alpha1)","Beta (for example v1beta1)","Stable (for example v1)","Deprecated"],"a":[0],"e":"Alpha APIs are experimental and off by default; beta APIs are enabled and well tested but may still change; stable (GA) APIs are supported for many releases."},{"id":"kcna-fund28","d":"fund","q":"Which kubectl command displays detailed information about a Pod, including its events, to troubleshoot why it is not starting?","o":["kubectl describe pod <name>","kubectl get pod <name>","kubectl logs <name>","kubectl exec <name>"],"a":[0],"e":"kubectl describe shows the object's spec, status, conditions, and recent events such as image pull errors or scheduling failures. kubectl logs shows container output once it has started."},{"id":"kcna-fund29","d":"fund","q":"A Pod is stuck in the Pending state. Which is the MOST likely reason?","o":["No node has enough resources or satisfies the Pod's scheduling constraints, so the scheduler cannot place it","The container's main process exited with an error","The image has a bug","The Service has no endpoints"],"a":[0],"e":"Pending means the Pod has been accepted but not scheduled or its containers are not yet created, commonly due to insufficient CPU/memory, taints, affinity rules, or unbound volumes."},{"id":"kcna-fund30","d":"fund","q":"A Pod shows the status CrashLoopBackOff. What does this indicate?","o":["The container starts, exits with an error, and the kubelet restarts it with increasing delays","The image cannot be pulled from the registry","The Pod could not be scheduled","The node is NotReady"],"a":[0],"e":"CrashLoopBackOff is the kubelet backing off between restarts of a repeatedly failing container. Check kubectl logs --previous for the crash reason."},{"id":"kcna-fund31","d":"fund","q":"What happens when a container exceeds the memory limit set in its resources specification?","o":["The container is terminated (OOMKilled) and restarted according to the Pod's restart policy","The Pod is moved to a node with more memory","The limit is automatically increased","Nothing; limits are only advisory"],"a":[0],"e":"Memory limits are enforced by the kernel cgroup; exceeding them triggers an out-of-memory kill. CPU limits throttle instead of killing."},{"id":"kcna-fund32","d":"fund","q":"What is the difference between resource requests and limits for a container?","o":["Requests are the amount the scheduler guarantees and uses for placement; limits are the maximum the container may consume","Requests are a hard maximum; limits are the minimum","They are identical settings in different units","Requests apply to CPU and limits only to memory"],"a":[0],"e":"The scheduler places Pods based on the sum of requests versus node allocatable capacity. Limits cap usage at runtime."},{"id":"kcna-fund33","d":"fund","q":"A node is tainted with key=value:NoSchedule. What is the effect?","o":["Pods will not be scheduled onto that node unless they have a matching toleration","All Pods on the node are evicted immediately","The node is removed from the cluster","Only DaemonSet Pods are evicted"],"a":[0],"e":"Taints repel Pods; tolerations let specific Pods accept a taint. NoExecute additionally evicts running Pods without a toleration; PreferNoSchedule is a soft rule."},{"id":"kcna-fund34","d":"fund","q":"A Pod must run only on nodes that have the label disktype=ssd. Which is the simplest way to express this?","o":["Add nodeSelector: disktype: ssd to the Pod spec","Add a toleration for disktype=ssd","Label the Pod with disktype=ssd","Create a DaemonSet"],"a":[0],"e":"nodeSelector is the simplest node-constraint. Node affinity offers richer expressions (In, NotIn, preferred rules) for more complex requirements."},{"id":"kcna-fund35","d":"fund","q":"Two Pods of the same application should never be scheduled on the same node to improve availability. Which feature expresses this?","o":["Pod anti-affinity (or topology spread constraints)","nodeSelector","A taint on every node","A LimitRange"],"a":[0],"e":"Pod anti-affinity rules reference other Pods' labels and a topology key such as kubernetes.io/hostname to keep replicas apart. Topology spread constraints achieve similar, more even distribution."},{"id":"kcna-fund36","d":"fund","q":"Which probe does the kubelet use to decide whether to restart a container that is running but no longer working correctly?","o":["Liveness probe","Readiness probe","Startup probe","Health probe"],"a":[0],"e":"A failing liveness probe causes the kubelet to kill and restart the container. Readiness only removes the Pod from Service endpoints; startup probes delay the other probes for slow-starting apps."},{"id":"kcna-fund37","d":"fund","q":"A container is running but should not receive traffic until it has finished warming its cache. Which probe controls whether the Pod is included in Service endpoints?","o":["Readiness probe","Liveness probe","Startup probe","Lifecycle hook"],"a":[0],"e":"Readiness gates traffic: while the probe fails, the Pod is marked not ready and removed from endpoints without being restarted."},{"id":"kcna-fund38","d":"fund","q":"What is an init container?","o":["A container that runs to completion before the app containers in the Pod start, often used for setup tasks","A container that keeps running alongside the main container","The first container image in a registry","A container that initializes the node"],"a":[0],"e":"Init containers run sequentially and must succeed before the regular containers start, for example to wait for a dependency or populate a volume. Sidecars run concurrently."},{"id":"kcna-fund39","d":"fund","q":"What is the sidecar pattern?","o":["Running a helper container in the same Pod as the main application container to add functionality such as log shipping or a service mesh proxy","Running two copies of the application for redundancy","Running a container on a separate node that monitors the main one","A container that runs before the main container"],"a":[0],"e":"Sidecars share the Pod's network and volumes with the application container, which is how service meshes inject proxies and how log agents collect application output."},{"id":"kcna-fund40","d":"fund","q":"Which statement correctly describes networking within a single Pod?","o":["All containers in the Pod share one network namespace and IP address and can reach each other on localhost","Each container gets its own IP address","Containers in a Pod cannot communicate with each other","Containers communicate only through a Service"],"a":[0],"e":"The pause (infrastructure) container holds the Pod's network namespace; application containers join it, so they share the IP and port space."},{"id":"kcna-fund41","d":"fund","q":"What does the Open Container Initiative (OCI) define?","o":["Open standards for container image format and container runtime behavior (plus distribution)","The Kubernetes API","A specific container registry product","The CNCF governance model"],"a":[0],"e":"OCI publishes the Image Specification, Runtime Specification, and Distribution Specification so images and runtimes from different vendors interoperate."},{"id":"kcna-fund42","d":"fund","q":"Which of the following are OCI-compliant container runtimes commonly used with Kubernetes through the Container Runtime Interface? (Choose TWO.)","o":["containerd","CRI-O","kube-proxy","CoreDNS","Helm"],"a":[0,1],"e":"containerd and CRI-O implement the CRI and use runc (or alternatives such as gVisor or Kata) as the low-level OCI runtime. Docker Engine is used via the cri-dockerd shim since dockershim was removed in 1.24."},{"id":"kcna-fund43","d":"fund","q":"What is a container image?","o":["An immutable, layered package containing an application and everything it needs to run, from which containers are started","A running process on a node","A virtual machine snapshot","A Kubernetes Deployment"],"a":[0],"e":"Images are built from layers (often via a Dockerfile), stored in registries, and instantiated as containers. Immutability is why updates mean building and deploying a new image tag."},{"id":"kcna-fund44","d":"fund","q":"A Pod references the image myapp:latest with imagePullPolicy unspecified. What is the resulting pull policy?","o":["Always, because the tag is latest","IfNotPresent","Never","Once"],"a":[0],"e":"Kubernetes defaults imagePullPolicy to Always for the latest tag (or no tag) and IfNotPresent for other tags. Pinning a specific tag or digest gives reproducible deployments."},{"id":"kcna-fund45","d":"fund","q":"What is the purpose of kubeconfig?","o":["A file that holds cluster endpoints, user credentials, and contexts so kubectl knows how to connect to and authenticate with clusters","A ConfigMap that configures the kubelet","The cluster's etcd configuration","A Helm values file"],"a":[0],"e":"kubectl reads ~/.kube/config (or KUBECONFIG) for clusters, users, and contexts; kubectl config use-context switches between them."},{"id":"kcna-fund46","d":"fund","q":"Which kubectl command changes the number of replicas of a Deployment named web to 5?","o":["kubectl scale deployment web --replicas=5","kubectl set replicas web 5","kubectl resize web 5","kubectl update deployment web replicas=5"],"a":[0],"e":"kubectl scale adjusts the replica count of Deployments, ReplicaSets, and StatefulSets. Editing the manifest and re-applying is the declarative equivalent."},{"id":"kcna-fund47","d":"fund","q":"A Deployment rollout introduced a bug. Which command reverts to the previous ReplicaSet revision?","o":["kubectl rollout undo deployment/<name>","kubectl delete deployment/<name>","kubectl rollout restart deployment/<name>","kubectl scale deployment/<name> --replicas=0"],"a":[0],"e":"Deployments keep revision history; rollout undo switches back to the previous revision. rollout restart just re-creates Pods with the same spec."},{"id":"kcna-fund48","d":"fund","q":"Which Deployment strategy replaces Pods gradually so that the application stays available during an update?","o":["RollingUpdate","Recreate","Blue/green","Canary"],"a":[0],"e":"RollingUpdate (the default) brings up new Pods while taking down old ones, bounded by maxSurge and maxUnavailable. Recreate terminates all old Pods first, causing downtime."},{"id":"kcna-fund49","d":"fund","q":"What is the role of CoreDNS in a Kubernetes cluster?","o":["It provides cluster DNS so that Services and Pods can be discovered by name, such as my-svc.my-namespace.svc.cluster.local","It stores cluster state","It assigns IP addresses to Pods","It schedules Pods"],"a":[0],"e":"CoreDNS runs as a Deployment in kube-system and answers DNS queries for Service and Pod records, enabling service discovery by name."},{"id":"kcna-fund50","d":"fund","q":"Which fields are required in nearly every Kubernetes object manifest? (Choose TWO.)","o":["apiVersion and kind","metadata (with at least a name)","status","replicas","selector"],"a":[0,1],"e":"Every object declares apiVersion, kind, metadata, and (for most kinds) spec. status is written by the system, not the user."},{"id":"kcna-fund51","d":"fund","q":"A static Pod differs from a regular Pod in that it is:","o":["Managed directly by the kubelet from a manifest on the node's filesystem rather than by the API server, used for example to run control plane components","Created by a Deployment","Unable to use volumes","Scheduled by the scheduler onto a fixed node"],"a":[0],"e":"The kubelet watches a directory (such as /etc/kubernetes/manifests) and runs static Pods found there; kubeadm uses this to bootstrap the API server, scheduler, and controller manager."},{"id":"kcna-fund52","d":"fund","q":"Which statement about Kubernetes garbage collection and owner references is correct?","o":["When an owner object such as a ReplicaSet is deleted, dependents with an ownerReference to it, such as its Pods, are deleted by default (cascading deletion)","Deleting a Deployment never removes its Pods","Pods must be deleted before their ReplicaSet","Owner references are only used by Jobs"],"a":[0],"e":"ownerReferences let the garbage collector clean up dependents. kubectl delete --cascade=orphan keeps the dependents."},{"id":"kcna-fund53","d":"fund","q":"Which kubectl command opens an interactive shell inside a running container named app in Pod web-1?","o":["kubectl exec -it web-1 -c app -- /bin/sh","kubectl attach web-1 app","kubectl run web-1 --shell","kubectl ssh web-1"],"a":[0],"e":"kubectl exec runs a command in a container; -it allocates a TTY for interactive use and -c selects the container in multi-container Pods."},{"id":"kcna-orch01","d":"orch","q":"What problem does container orchestration solve?","o":["Automating deployment, scaling, networking, and lifecycle management of many containers across a cluster of machines","Building container images from source code","Replacing the need for an operating system","Compiling applications for multiple CPU architectures"],"a":[0],"e":"Running a few containers by hand is easy; orchestration handles scheduling, self-healing, service discovery, rollouts, and scaling for hundreds or thousands of containers."},{"id":"kcna-orch02","d":"orch","q":"What is the Container Runtime Interface (CRI)?","o":["A gRPC API that lets the kubelet use different container runtimes without recompiling Kubernetes","A standard for container image layers","A Kubernetes object that describes a runtime","A networking plugin specification"],"a":[0],"e":"CRI decouples the kubelet from any specific runtime; containerd and CRI-O implement it. Image format is OCI's domain, networking is CNI, and storage is CSI."},{"id":"kcna-orch03","d":"orch","q":"Why was the dockershim removed from the kubelet in Kubernetes 1.24?","o":["Docker Engine does not implement the CRI natively, and maintaining the built-in shim was a burden; CRI-compliant runtimes such as containerd are used instead","Docker images stopped being compatible with Kubernetes","Kubernetes no longer runs containers","Docker was replaced by virtual machines"],"a":[0],"e":"Images built with Docker still run unchanged because they are OCI images. Only the runtime integration changed; Docker Engine can still be used via the external cri-dockerd adapter."},{"id":"kcna-orch04","d":"orch","q":"Which Kubernetes feature controls which users or ServiceAccounts can perform which actions on which resources?","o":["Role-Based Access Control (RBAC)","NetworkPolicy","ResourceQuota","Pod Security Standards"],"a":[0],"e":"RBAC uses Roles and ClusterRoles (sets of permissions) bound to subjects by RoleBindings and ClusterRoleBindings."},{"id":"kcna-orch05","d":"orch","q":"What is the difference between a Role and a ClusterRole?","o":["A Role grants permissions within a single namespace; a ClusterRole is cluster-wide and can also cover cluster-scoped resources such as nodes","A Role is for users; a ClusterRole is for ServiceAccounts","A ClusterRole can only be read-only","There is no difference"],"a":[0],"e":"ClusterRoles can be bound cluster-wide with a ClusterRoleBinding or reused per namespace with a RoleBinding, which is a common way to define standard permission sets."},{"id":"kcna-orch06","d":"orch","q":"What identity do processes inside a Pod use when they call the Kubernetes API?","o":["The Pod's ServiceAccount, whose token is mounted into the Pod","The kubelet's certificate","The cluster-admin user","The node's IAM role"],"a":[0],"e":"Each namespace has a default ServiceAccount; Pods should get a dedicated ServiceAccount with only the RBAC permissions they need, and automounting can be disabled when not required."},{"id":"kcna-orch07","d":"orch","q":"In what order does the API server process a request?","o":["Authentication, then authorization, then admission control","Admission control, then authentication, then authorization","Authorization, then authentication, then validation","Only authentication is performed"],"a":[0],"e":"The API server first establishes who is calling, then whether they may perform the action (RBAC and others), then runs mutating and validating admission controllers before persisting."},{"id":"kcna-orch08","d":"orch","q":"What are the 4Cs of cloud native security?","o":["Cloud, Cluster, Container, Code","Compute, Connectivity, Compliance, Cost","Create, Configure, Control, Cleanup","Client, Cache, Controller, Core"],"a":[0],"e":"The 4Cs describe defense in depth as nested layers: each inner layer (code) depends on the security of the outer ones (container, cluster, cloud or datacenter)."},{"id":"kcna-orch09","d":"orch","q":"Which Pod or container setting prevents the process from running as the root user?","o":["securityContext.runAsNonRoot: true (with runAsUser set to a non-zero UID)","privileged: true","hostNetwork: true","imagePullPolicy: Always"],"a":[0],"e":"securityContext fields control UID/GID, privilege escalation, capabilities, read-only root filesystem, and more. privileged: true is the opposite of hardening."},{"id":"kcna-orch10","d":"orch","q":"Which Pod Security Standard profile is the most restrictive and follows current hardening best practices?","o":["Restricted","Baseline","Privileged","Default"],"a":[0],"e":"The three profiles are Privileged (unrestricted), Baseline (prevents known privilege escalations), and Restricted (heavily restricted). They are enforced per namespace by the Pod Security Admission controller."},{"id":"kcna-orch11","d":"orch","q":"What does the Container Network Interface (CNI) specify?","o":["A standard plugin interface for configuring network interfaces and IP addresses for containers, implemented by plugins such as Calico, Cilium, and Flannel","A Kubernetes Service type","The format of container images","How kube-proxy load balances"],"a":[0],"e":"Kubernetes delegates Pod networking to a CNI plugin, which must satisfy the Kubernetes network model: every Pod gets its own IP and can reach every other Pod without NAT."},{"id":"kcna-orch12","d":"orch","q":"Which statements describe the Kubernetes network model? (Choose TWO.)","o":["Every Pod gets its own cluster-unique IP address","Pods on any node can communicate with all Pods on all nodes without NAT","Pods must use NodePort Services to reach each other","Containers in different Pods share an IP address","Pod IPs are stable for the life of a Deployment"],"a":[0,1],"e":"The flat, NAT-free Pod network is a core requirement that CNI plugins implement. Pod IPs change when Pods are recreated, which is why Services exist."},{"id":"kcna-orch13","d":"orch","q":"Which resource is used to expose HTTP and HTTPS routes from outside the cluster to Services, with host- and path-based routing and TLS termination?","o":["Ingress (implemented by an Ingress controller), or the newer Gateway API","A ClusterIP Service","A NetworkPolicy","A DaemonSet"],"a":[0],"e":"An Ingress object is only data; an Ingress controller (NGINX, Traefik, cloud-specific) reads it and configures a proxy. The Gateway API is the more expressive successor."},{"id":"kcna-orch14","d":"orch","q":"By default, can Pods in different namespaces communicate with each other?","o":["Yes; all Pods can talk to all Pods until a NetworkPolicy restricts traffic","No; namespaces isolate network traffic by default","Only if they share a ServiceAccount","Only through an Ingress"],"a":[0],"e":"Namespaces do not provide network isolation. NetworkPolicies, enforced by a CNI that supports them, are needed to restrict ingress and egress."},{"id":"kcna-orch15","d":"orch","q":"A NetworkPolicy is created that selects Pods with app=db and specifies an ingress rule allowing only Pods with app=api. What happens to other traffic to the db Pods?","o":["It is denied, because once a Pod is selected by a policy with ingress rules, only the allowed traffic is permitted","It is still allowed, because NetworkPolicies are additive allow-lists only for the listed sources","It is logged but allowed","NetworkPolicies affect only egress"],"a":[0],"e":"Selecting a Pod in a policy's podSelector with a policyType of Ingress makes it default-deny for ingress except what the rules allow. The CNI must support NetworkPolicy for it to take effect."},{"id":"kcna-orch16","d":"orch","q":"What is a service mesh?","o":["An infrastructure layer, typically implemented with sidecar or node proxies, that handles service-to-service communication features such as mutual TLS, retries, traffic splitting, and telemetry without changing application code","A type of Kubernetes Service","A network of physical switches","A replacement for the CNI plugin"],"a":[0],"e":"Meshes such as Istio and Linkerd inject proxies (often Envoy) next to each workload and manage them from a control plane, offloading security and observability from the app."},{"id":"kcna-orch17","d":"orch","q":"Which of the following are service mesh projects? (Choose TWO.)","o":["Istio","Linkerd","Calico","Prometheus","containerd"],"a":[0,1],"e":"Istio and Linkerd are service meshes (Linkerd is a CNCF graduated project). Calico is a CNI plugin, Prometheus is monitoring, and containerd is a runtime."},{"id":"kcna-orch18","d":"orch","q":"What does mutual TLS (mTLS) in a service mesh provide?","o":["Encryption of traffic between services plus verification of both the client and server identities","Only server-side certificates for public websites","Compression of traffic","Load balancing across nodes"],"a":[0],"e":"mTLS authenticates both ends with certificates issued by the mesh's certificate authority, so service identity is cryptographic rather than IP-based, and traffic is encrypted in transit."},{"id":"kcna-orch19","d":"orch","q":"What is the Container Storage Interface (CSI)?","o":["A standard that lets storage vendors write plugins that work with Kubernetes and other orchestrators without changing core code","A Kubernetes object that stores configuration","A container image layer format","A backup tool"],"a":[0],"e":"CSI drivers provision and attach volumes (block or file) for cloud disks, NFS, Ceph, and more. In-tree cloud volume plugins have been migrated to CSI."},{"id":"kcna-orch20","d":"orch","q":"What is the relationship between a PersistentVolume (PV) and a PersistentVolumeClaim (PVC)?","o":["A PV is a piece of storage in the cluster; a PVC is a request for storage by a user that binds to a matching PV","A PVC is created by the administrator and a PV by the developer","They are the same object","A PV is a request and a PVC is the physical disk"],"a":[0],"e":"PVs are cluster-scoped resources (provisioned statically or dynamically); PVCs are namespaced requests specifying size and access mode, and Pods mount PVCs."},{"id":"kcna-orch21","d":"orch","q":"What is the purpose of a StorageClass?","o":["To define classes of storage with a provisioner and parameters so PVCs can be dynamically provisioned on demand","To set a Pod's storage limits","To encrypt Secrets","To define a volume inside a container image"],"a":[0],"e":"A PVC that references a StorageClass triggers dynamic provisioning through the class's CSI provisioner, removing the need to pre-create PVs."},{"id":"kcna-orch22","d":"orch","q":"Which volume access mode allows the volume to be mounted read-write by many nodes at the same time?","o":["ReadWriteMany (RWX)","ReadWriteOnce (RWO)","ReadOnlyMany (ROX)","ReadWriteOncePod"],"a":[0],"e":"RWX requires a shared file system such as NFS or CephFS. Block devices from cloud providers are usually RWO (one node at a time)."},{"id":"kcna-orch23","d":"orch","q":"Which volume type is temporary, shares its lifetime with the Pod, and is useful for scratch space shared between containers in the Pod?","o":["emptyDir","hostPath","persistentVolumeClaim","configMap"],"a":[0],"e":"emptyDir starts empty when the Pod is created and is deleted when the Pod is removed. hostPath exposes a node directory and is discouraged for security reasons."},{"id":"kcna-orch24","d":"orch","q":"What is the role of the cloud-controller-manager?","o":["It runs controllers that integrate the cluster with the underlying cloud provider, for example creating load balancers for LoadBalancer Services and managing node lifecycle","It manages etcd backups","It replaces the scheduler in the cloud","It runs on every worker node"],"a":[0],"e":"Separating cloud-specific logic into the cloud-controller-manager lets providers evolve independently of core Kubernetes."},{"id":"kcna-orch25","d":"orch","q":"Which feature automatically adjusts the number of Pod replicas in a Deployment based on observed CPU utilization or custom metrics?","o":["Horizontal Pod Autoscaler (HPA)","Vertical Pod Autoscaler (VPA)","Cluster Autoscaler","ReplicaSet"],"a":[0],"e":"HPA scales replicas out and in; VPA adjusts the requests and limits of individual Pods; Cluster Autoscaler adds or removes nodes when Pods cannot be scheduled."},{"id":"kcna-orch26","d":"orch","q":"Pods are Pending because every node is full, and the cluster runs on a cloud provider. Which component can add nodes automatically?","o":["Cluster Autoscaler (or Karpenter)","Horizontal Pod Autoscaler","kube-proxy","Vertical Pod Autoscaler"],"a":[0],"e":"Node autoscalers watch for unschedulable Pods and provision nodes through the cloud API, then remove underutilized nodes later."},{"id":"kcna-orch27","d":"orch","q":"What does a ResourceQuota do?","o":["Limits the total amount of resources (such as CPU, memory, or object counts) that can be consumed in a namespace","Sets default limits for individual containers","Reserves nodes for a team","Encrypts namespace traffic"],"a":[0],"e":"ResourceQuotas constrain aggregate usage per namespace. LimitRanges set defaults and min/max per Pod or container."},{"id":"kcna-orch28","d":"orch","q":"What is a Headless Service?","o":["A Service with clusterIP: None that returns the individual Pod IPs in DNS instead of a single virtual IP, commonly used with StatefulSets","A Service without a selector","A Service that has no ports","A Service that is not accessible"],"a":[0],"e":"Headless Services let clients discover and connect to specific Pods, which is essential for databases and other stateful applications that need per-member addressing."},{"id":"kcna-orch29","d":"orch","q":"Which admission controller feature lets you reject or modify API requests based on custom policies, for example blocking images from untrusted registries?","o":["Dynamic admission control with validating or mutating admission webhooks (or policy engines such as Kyverno or OPA Gatekeeper)","RBAC RoleBindings","NetworkPolicy","ResourceQuota"],"a":[0],"e":"Admission webhooks run after authentication and authorization, letting external policy engines validate or mutate objects before they are stored."},{"id":"kcna-orch30","d":"orch","q":"What does kubelet use to report node health, and what happens when a node stops reporting?","o":["The kubelet sends heartbeats (node status and leases) to the API server; if they stop, the node is marked NotReady and its Pods are eventually evicted and rescheduled","The scheduler pings each node every second","etcd polls the nodes","Nodes never go NotReady automatically"],"a":[0],"e":"The node controller monitors node leases and status. After the node becomes NotReady, Pods are evicted after the toleration timeout (default 5 minutes) and controllers recreate them elsewhere."},{"id":"kcna-orch31","d":"orch","q":"Which component is responsible for assigning an external IP address when a Service of type LoadBalancer is created in a cloud environment?","o":["The cloud provider's controller (cloud-controller-manager or an equivalent such as MetalLB on bare metal)","kube-proxy","CoreDNS","The kubelet on the first node"],"a":[0],"e":"LoadBalancer Services depend on an external integration; on bare metal nothing happens until a load balancer implementation such as MetalLB is installed."},{"id":"kcna-orch32","d":"orch","q":"What is a Custom Resource Definition (CRD)?","o":["A way to extend the Kubernetes API with new resource types, which operators and controllers can manage","A built-in resource for configuration","A special kind of ConfigMap","A kubectl plugin"],"a":[0],"e":"CRDs register new kinds (for example Certificate or KafkaCluster) that are stored in etcd and handled by custom controllers, following the same declarative model."},{"id":"kcna-orch33","d":"orch","q":"What is the Operator pattern?","o":["A custom controller that uses CRDs to encode operational knowledge for managing a complex application, such as backups, upgrades, and failover of a database","A human administrator role","A Helm chart repository","A node maintenance mode"],"a":[0],"e":"Operators automate day-2 operations by reconciling custom resources, extending Kubernetes' control loop to application-specific tasks."},{"id":"kcna-orch34","d":"orch","q":"Which tool is commonly used to bootstrap a conformant Kubernetes cluster by initializing the control plane and joining nodes?","o":["kubeadm","kubectl","Helm","Kustomize"],"a":[0],"e":"kubeadm performs cluster bootstrapping (init and join); kubectl is the client, and Helm and Kustomize package or customize application manifests."},{"id":"kcna-deliv01","d":"deliv","q":"What is GitOps?","o":["An operating model where the desired state of infrastructure and applications is declared in Git, and automated agents continuously reconcile the live system to match the repository","Running Git inside a Kubernetes Pod","A CI system that builds images on every commit","Manual deployments documented in Git"],"a":[0],"e":"GitOps principles: declarative, versioned and immutable, pulled automatically, and continuously reconciled. Git becomes the single source of truth and audit log."},{"id":"kcna-deliv02","d":"deliv","q":"Which of the following are GitOps tools that continuously synchronize Kubernetes clusters with a Git repository? (Choose TWO.)","o":["Argo CD","Flux","Jenkins","Prometheus","containerd"],"a":[0,1],"e":"Argo CD and Flux are CNCF graduated GitOps projects that run in-cluster and pull desired state from Git. Jenkins is a general CI/CD automation server."},{"id":"kcna-deliv03","d":"deliv","q":"What is the difference between continuous integration and continuous delivery/deployment?","o":["CI automatically builds and tests code on every change; CD automates releasing the tested artifact to environments (delivery) or all the way to production without manual steps (deployment)","CI deploys to production; CD runs unit tests","They are the same practice","CD is only for infrastructure"],"a":[0],"e":"CI validates changes early and produces artifacts such as container images; CD pipelines promote those artifacts through environments, in cloud native setups often by updating manifests in Git."},{"id":"kcna-deliv04","d":"deliv","q":"What is Helm?","o":["A package manager for Kubernetes that bundles related manifests into charts with templated values, supporting install, upgrade, and rollback","A container runtime","A GitOps controller","A network plugin"],"a":[0],"e":"Helm charts parameterize manifests with a values file and track releases, which simplifies installing complex applications such as ingress controllers or databases."},{"id":"kcna-deliv05","d":"deliv","q":"What is Kustomize?","o":["A template-free tool, built into kubectl, that customizes raw YAML manifests through overlays and patches for different environments","A Helm chart repository","A container image builder","A Kubernetes Operator"],"a":[0],"e":"Kustomize layers overlays (dev, staging, prod) on a shared base without templating; kubectl apply -k uses a kustomization.yaml."},{"id":"kcna-deliv06","d":"deliv","q":"A team wants to release a new version to 5% of users first, watch error rates, and then increase gradually. Which deployment strategy is this?","o":["Canary deployment","Blue/green deployment","Recreate deployment","Rolling update with maxSurge 100%"],"a":[0],"e":"Canary releases route a small portion of traffic to the new version, often with a service mesh or ingress-based traffic splitting, and promote or roll back based on metrics."},{"id":"kcna-deliv07","d":"deliv","q":"A team runs two complete environments, switches all traffic from the old one to the new one at once, and can switch back instantly. Which deployment strategy is this?","o":["Blue/green deployment","Canary deployment","Rolling update","A/B testing"],"a":[0],"e":"Blue/green keeps the previous version running for fast rollback at the cost of double capacity during the switch."},{"id":"kcna-deliv08","d":"deliv","q":"In a GitOps workflow, how is a change usually deployed to production?","o":["By merging a change to the manifests (for example a new image tag) in the Git repository, after which the GitOps agent applies it to the cluster","By running kubectl apply from a developer's laptop","By editing resources directly in the cluster UI","By restarting the nodes"],"a":[0],"e":"Pull-based reconciliation means the cluster agent, not a CI pipeline with cluster credentials, applies changes; Git history provides review, audit, and rollback via revert."},{"id":"kcna-deliv09","d":"deliv","q":"What is drift in the context of GitOps, and how do tools like Argo CD handle it?","o":["A difference between the live cluster state and the state declared in Git; GitOps tools detect it and can automatically re-sync to Git","A delay in CI pipeline execution","Network latency between clusters","A Helm chart version mismatch"],"a":[0],"e":"Drift arises from manual changes in the cluster. Continuous reconciliation with self-heal enabled reverts such changes, enforcing Git as the source of truth."},{"id":"kcna-deliv10","d":"deliv","q":"Which CNCF project provides a Kubernetes-native CI/CD framework based on Tasks and Pipelines defined as custom resources?","o":["Tekton","Helm","Argo CD","Flux"],"a":[0],"e":"Tekton runs pipeline steps as Pods using CRDs such as Task, Pipeline, and PipelineRun. Argo Workflows is another Kubernetes-native workflow engine."},{"id":"kcna-deliv11","d":"deliv","q":"Why should container images be referenced by a specific tag or digest rather than latest in production manifests?","o":["To make deployments reproducible and rollbacks reliable, since latest can point to different images over time","Because latest images cannot be pulled","Because Kubernetes rejects the latest tag","Because digests are shorter"],"a":[0],"e":"Immutable references ensure that what was tested is what runs. Digests (sha256) are the strongest guarantee; semantic version tags are a common compromise."},{"id":"kcna-deliv12","d":"deliv","q":"What is a typical responsibility of a CI pipeline in a cloud native delivery workflow? (Choose TWO.)","o":["Building the container image and pushing it to a registry","Running unit tests, linting, and image vulnerability scans","Serving DNS for the cluster","Scheduling Pods to nodes","Storing cluster state"],"a":[0,1],"e":"CI turns source into a tested, scanned, versioned artifact. Deployment then happens through CD or GitOps by referencing that artifact."},{"id":"kcna-deliv13","d":"deliv","q":"A Helm release upgrade broke the application. Which command returns to the previous release revision?","o":["helm rollback <release> <revision>","helm uninstall <release>","helm repo update","kubectl rollout undo helm/<release>"],"a":[0],"e":"Helm records each release revision; helm history shows them and helm rollback restores an earlier one."},{"id":"kcna-deliv14","d":"deliv","q":"What is the main benefit of using a declarative, version-controlled approach to application delivery?","o":["Changes are reviewable, auditable, reproducible, and easy to roll back, and environments can be rebuilt from the repository","Faster container start times","Smaller images","No need for testing"],"a":[0],"e":"Version control gives history and review; declarative manifests let automation reconcile any environment to a known state, which also supports disaster recovery."},{"id":"kcna-deliv15","d":"deliv","q":"Which Kubernetes Deployment settings control how many Pods can be created above the desired count and how many can be unavailable during a rolling update?","o":["maxSurge and maxUnavailable","minReadySeconds and progressDeadlineSeconds","replicas and selector","terminationGracePeriodSeconds and restartPolicy"],"a":[0],"e":"maxSurge allows extra Pods during the rollout; maxUnavailable bounds how many old Pods may be down. Together they trade speed against capacity."},{"id":"kcna-deliv16","d":"deliv","q":"A platform team wants to ensure that every manifest applied to the cluster passes policy checks (such as required labels and no privileged containers) before it is admitted. Which type of tool enforces this at admission time?","o":["A policy engine such as Kyverno or OPA Gatekeeper using admission webhooks","A CNI plugin","A Helm repository","A metrics server"],"a":[0],"e":"Policy-as-code engines validate (and can mutate) resources in the API server's admission phase, and the same policies can be run in CI for earlier feedback."},{"id":"kcna-deliv17","d":"deliv","q":"What does the term progressive delivery mean?","o":["Releasing changes gradually to subsets of users or traffic (canary, blue/green, feature flags) with automated analysis and rollback","Deploying all services at the same time","Delivering software only on a fixed monthly schedule","Compiling code progressively"],"a":[0],"e":"Tools such as Argo Rollouts and Flagger implement progressive delivery on Kubernetes by automating traffic shifting and metric-based promotion."},{"id":"kcna-deliv18","d":"deliv","q":"Why is a container registry a key part of cloud native application delivery?","o":["It stores versioned, immutable images that CI pushes and clusters pull, often with scanning and signing","It runs the containers","It stores Kubernetes Secrets","It replaces Git"],"a":[0],"e":"Registries such as Harbor (a CNCF project), Docker Hub, and cloud registries are the hand-off point between build and deploy."},{"id":"kcna-deliv19","d":"deliv","q":"Which practice helps prevent a bad deployment from affecting all users at once and provides a fast path back to a working state?","o":["Using rolling or canary strategies with readiness probes and keeping previous revisions available for rollback","Deploying with the Recreate strategy","Disabling probes to speed up rollouts","Deleting old ReplicaSets immediately"],"a":[0],"e":"Readiness probes stop traffic from reaching unhealthy Pods during rollout, and retained revisions allow kubectl rollout undo or GitOps reverts."},{"id":"kcna-arch01","d":"arch","q":"What is the Cloud Native Computing Foundation (CNCF)?","o":["A vendor-neutral foundation under the Linux Foundation that hosts and governs open source cloud native projects such as Kubernetes, Prometheus, and Envoy","A company that sells Kubernetes","A certification body only","A cloud provider"],"a":[0],"e":"CNCF provides governance, funding, and community for its projects and runs programs such as certifications and conformance."},{"id":"kcna-arch02","d":"arch","q":"What are the CNCF project maturity levels, from least to most mature?","o":["Sandbox, Incubating, Graduated","Alpha, Beta, Stable","Draft, Candidate, Release","Bronze, Silver, Gold"],"a":[0],"e":"Projects enter as Sandbox, move to Incubating with adoption and governance milestones, and Graduate after meeting criteria such as security audits and diverse maintainers. Kubernetes, Prometheus, and Envoy are graduated."},{"id":"kcna-arch03","d":"arch","q":"Which body within the CNCF is responsible for technical oversight, including deciding project acceptance and graduation?","o":["The Technical Oversight Committee (TOC)","The Governing Board","The End User Community","The Kubernetes Steering Committee"],"a":[0],"e":"The TOC defines and maintains the technical vision and approves project moves between maturity levels; the Governing Board handles business and marketing."},{"id":"kcna-arch04","d":"arch","q":"Within the Kubernetes project, what are Special Interest Groups (SIGs)?","o":["Community groups that own specific areas of the project, such as SIG Network or SIG Storage, and drive their development","Companies that sponsor Kubernetes","Paid support tiers","Clusters reserved for testing"],"a":[0],"e":"Kubernetes is organized into SIGs, working groups, and committees; contributions and KEPs (enhancement proposals) flow through the relevant SIG."},{"id":"kcna-arch05","d":"arch","q":"Which open standards allow Kubernetes components to be swapped without changing core code? (Choose TWO.)","o":["CRI for container runtimes and CNI for networking","CSI for storage","HTTP/3 for the API server","YAML for manifests","SSH for node access"],"a":[0,1],"e":"CRI, CNI, CSI (and OCI for images and runtimes, plus the Gateway API and service mesh interfaces) are the pluggable boundaries of the ecosystem."},{"id":"kcna-arch06","d":"arch","q":"What is serverless in a cloud native context, and which CNCF project enables it on Kubernetes?","o":["Running code in response to events with automatic scaling, including scale to zero, and no server management; Knative provides this on Kubernetes","Running Pods without nodes; Helm provides this","A cluster with no control plane; etcd provides this","Virtual machines on demand; kubeadm provides this"],"a":[0],"e":"Knative Serving scales request-driven workloads from zero and Knative Eventing routes events, bringing function-style operation to Kubernetes."},{"id":"kcna-arch07","d":"arch","q":"What are the three main types of telemetry data in cloud native observability?","o":["Logs, metrics, and traces","Alerts, dashboards, and tickets","CPU, memory, and disk","Requests, responses, and errors"],"a":[0],"e":"Logs record discrete events, metrics are numeric measurements over time, and traces follow a request across services. Together they explain what a system is doing."},{"id":"kcna-arch08","d":"arch","q":"Which CNCF project is the de facto standard for collecting and querying time-series metrics in Kubernetes, using a pull model and the PromQL language?","o":["Prometheus","Fluentd","Jaeger","OpenTelemetry"],"a":[0],"e":"Prometheus scrapes metrics endpoints, stores time series, and alerts via Alertmanager. Fluentd handles logs, Jaeger traces, and OpenTelemetry provides instrumentation and collection."},{"id":"kcna-arch09","d":"arch","q":"What is OpenTelemetry?","o":["A vendor-neutral set of APIs, SDKs, and a collector for generating and exporting traces, metrics, and logs","A metrics storage database","A Kubernetes Ingress controller","A container runtime"],"a":[0],"e":"OpenTelemetry standardizes instrumentation so applications can emit telemetry once and send it to many backends, such as Prometheus, Jaeger, or commercial tools."},{"id":"kcna-arch10","d":"arch","q":"What is the role of a Site Reliability Engineer (SRE)?","o":["Applying software engineering to operations, defining SLOs and error budgets, and automating reliability work","Writing only front-end code","Approving cloud budgets","Managing the physical datacenter"],"a":[0],"e":"SRE formalizes reliability with SLIs and SLOs, uses error budgets to balance change velocity and stability, and reduces toil through automation."},{"id":"kcna-arch11","d":"arch","q":"Which statement best describes the twelve-factor or cloud native approach to application configuration?","o":["Configuration is stored in the environment (for example environment variables, ConfigMaps, Secrets) and kept out of the image so one build runs in every environment","Configuration is hard-coded into the container image per environment","Configuration is read from a file on the node","Applications should prompt for configuration at startup"],"a":[0],"e":"Separating config from code lets the same immutable image be promoted through dev, staging, and production with environment-specific settings injected at runtime."},{"id":"kcna-arch12","d":"arch","q":"What is the key characteristic of a microservices architecture compared with a monolith?","o":["The application is split into small, independently deployable services that communicate over APIs and can be scaled and updated separately","All functionality is compiled into one binary","Services share one database and one deployment pipeline","It requires a single programming language"],"a":[0],"e":"Microservices trade simplicity for independent scaling, deployment, and ownership; Kubernetes provides the discovery, scaling, and isolation they need."},{"id":"kcna-arch13","d":"arch","q":"Which practice helps manage cloud native cost in a Kubernetes environment?","o":["Setting accurate resource requests, using autoscaling (HPA and cluster autoscaling), and monitoring utilization to avoid over-provisioning","Removing all resource limits","Running one Pod per node","Disabling autoscaling"],"a":[0],"e":"Over-requested resources cause nodes to look full while idle. Right-sizing, autoscaling, and cost tools such as OpenCost (a CNCF project) address this."},{"id":"kcna-arch14","d":"arch","q":"What does autoscaling at the three levels of a Kubernetes platform refer to?","o":["Horizontal Pod Autoscaler for replica counts, Vertical Pod Autoscaler for Pod resource sizes, and Cluster Autoscaler or Karpenter for node counts","Three replicas of the API server","Scaling CPU, memory, and disk on one Pod","Scaling across three cloud providers"],"a":[0],"e":"Each autoscaler addresses a different dimension; combining HPA with a node autoscaler is the common pattern for elastic capacity."}],"kcsa":[{"id":"kcsa-over01","d":"over","q":"In the 4Cs model of cloud native security, which layer is the outermost and forms the trusted base for all the others?","o":["Cloud (or the corporate datacenter)","Cluster","Container","Code"],"a":[0],"e":"The layers nest: Code runs in Containers, which run in a Cluster, which runs on Cloud or datacenter infrastructure. Weakness in an outer layer undermines everything inside it."},{"id":"kcsa-over02","d":"over","q":"What does defense in depth mean for a Kubernetes platform?","o":["Applying independent security controls at every layer (infrastructure, cluster, container, code) so that a single failure does not compromise the whole system","Relying on one strong perimeter firewall","Encrypting etcd and nothing else","Running every workload as root inside an isolated VM"],"a":[0],"e":"Each layer (NetworkPolicy, RBAC, Pod Security, image scanning, runtime detection, and so on) limits the blast radius of a compromise elsewhere."},{"id":"kcsa-over03","d":"over","q":"Under the shared responsibility model for a managed Kubernetes service such as EKS, GKE, or AKS, which of the following is typically the customer's responsibility?","o":["Configuring RBAC, NetworkPolicies, Pod security, and securing workloads and images","Patching the managed control plane","Physical security of the datacenter","The availability of etcd in the managed control plane"],"a":[0],"e":"The provider secures and operates the control plane and underlying infrastructure; the customer secures what they deploy: identities, workloads, network policy, nodes (in some models), and data."},{"id":"kcsa-over04","d":"over","q":"Which Linux kernel features provide the isolation that containers rely on? (Choose TWO.)","o":["Namespaces, which isolate what a process can see (PIDs, network, mounts, users)","cgroups, which limit what a process can consume (CPU, memory, I/O)","Hypervisors, which run each container in its own VM","Kubernetes RBAC","etcd encryption"],"a":[0,1],"e":"Containers are regular processes isolated by namespaces and constrained by cgroups, often with seccomp, capabilities, and LSMs added. They share the host kernel, unlike VMs."},{"id":"kcsa-over05","d":"over","q":"Why is the container isolation boundary considered weaker than a virtual machine boundary?","o":["Containers share the host kernel, so a kernel vulnerability can allow escape from the container to the host","Containers cannot set resource limits","Containers always run as root","Containers do not support networking"],"a":[0],"e":"A VM has its own kernel behind a hypervisor. Sandboxed runtimes such as gVisor and Kata Containers add a stronger boundary for untrusted workloads."},{"id":"kcsa-over06","d":"over","q":"Which runtimes provide stronger sandboxing for untrusted workloads by running each Pod in a lightweight VM or a user-space kernel? (Choose TWO.)","o":["Kata Containers","gVisor","runc","containerd","CRI-O"],"a":[0,1],"e":"Kata uses lightweight VMs; gVisor intercepts syscalls with a user-space kernel. runc is the standard OCI runtime; containerd and CRI-O are higher-level runtimes that call runc or a sandbox runtime via RuntimeClass."},{"id":"kcsa-over07","d":"over","q":"What does shifting security left mean?","o":["Moving security checks earlier into development and CI, such as scanning code, dependencies, and images before deployment","Placing the firewall on the left side of the network diagram","Reviewing security only after an incident","Giving developers cluster-admin to speed up delivery"],"a":[0],"e":"Finding issues at commit or build time is cheaper and faster than at runtime; policy-as-code and scanners in CI implement the shift."},{"id":"kcsa-over08","d":"over","q":"Which principle states that each identity, workload, and component should be granted only the minimum permissions required to do its job?","o":["Least privilege","Defense in depth","Fail open","Separation of concerns"],"a":[0],"e":"Least privilege applies to RBAC, ServiceAccounts, Linux capabilities, cloud IAM for nodes, and network access alike."},{"id":"kcsa-over09","d":"over","q":"What is the core idea of a zero trust architecture in a Kubernetes environment?","o":["No request is trusted based on network location; every service-to-service call must be authenticated, authorized, and encrypted","Everything inside the cluster network is trusted","Only the ingress needs TLS","Trust is granted once at login and never re-checked"],"a":[0],"e":"Zero trust is implemented with strong workload identity (for example mTLS via a service mesh or SPIFFE), fine-grained authorization, and NetworkPolicies, assuming attackers are already inside."},{"id":"kcsa-over10","d":"over","q":"Why are immutable container images and immutable infrastructure considered a security benefit?","o":["Changes are made by building and deploying a new image rather than modifying running systems, so drift and undetected tampering are reduced and rollbacks are reliable","Images cannot be scanned","They remove the need for patching","They allow SSH into containers for fixes"],"a":[0],"e":"Immutability, combined with read-only root filesystems and signed images, makes unexpected changes both harder and easier to spot."},{"id":"kcsa-over11","d":"over","q":"Which of the following is an artifact repository security practice?","o":["Using a private registry with access control, scanning images for vulnerabilities, and verifying signatures before deployment","Allowing anonymous push to the registry","Using the latest tag for all production images","Storing images on developer laptops only"],"a":[0],"e":"Registries are part of the supply chain; controlling who can push, scanning what is stored, and signing and verifying images protect the path from build to runtime."},{"id":"kcsa-over12","d":"over","q":"What is the main security concern with pulling base images from unknown public sources?","o":["They may contain vulnerabilities or malicious code that becomes part of your supply chain","They are always too large","They cannot run on Kubernetes","They are not OCI-compliant"],"a":[0],"e":"Use minimal, trusted base images (official or distroless), pin by digest, scan them, and rebuild regularly to pick up fixes."},{"id":"kcsa-over13","d":"over","q":"Which cloud provider security control is most relevant to Kubernetes worker nodes?","o":["Hardening node images, restricting instance metadata access, and granting nodes only the cloud IAM permissions they need","Enabling public access to the API server","Using default VPC settings for everything","Sharing one SSH key across all nodes"],"a":[0],"e":"Nodes are part of the Cloud and Cluster layers: a compromised Pod can try to reach the cloud metadata endpoint or abuse node IAM roles, so those paths must be limited."},{"id":"kcsa-over14","d":"over","q":"What is the purpose of a security control framework such as the CIS Benchmarks or NIST guidance in a cloud native environment?","o":["To provide a structured, vendor-neutral set of recommended configurations and controls against which a cluster can be assessed","To replace all technical controls with documentation","To certify application code as bug-free","To define container image formats"],"a":[0],"e":"Frameworks give measurable baselines (such as the CIS Kubernetes Benchmark) that tools like kube-bench can check automatically."},{"id":"kcsa-over15","d":"over","q":"Which statement about workload and application code security is correct?","o":["Even a perfectly configured cluster can be compromised through vulnerable application code or dependencies, so SAST, dependency scanning, and secure coding remain necessary","Kubernetes makes application vulnerabilities irrelevant","Only the Cloud layer matters for security","Application code cannot be scanned in CI"],"a":[0],"e":"The Code layer is the innermost C: vulnerabilities there are reachable through legitimate ingress regardless of how well the cluster is locked down."},{"id":"kcsa-over16","d":"over","q":"What is the security benefit of running containers with a read-only root filesystem?","o":["An attacker who gains execution cannot modify binaries or drop persistent tools inside the container filesystem","It makes the container start faster","It encrypts the container's data","It removes the need for NetworkPolicies"],"a":[0],"e":"securityContext.readOnlyRootFilesystem: true, with writable emptyDir volumes only where needed, limits persistence and tampering inside a compromised container."},{"id":"kcsa-over17","d":"over","q":"Which approach best describes secure defaults for a new Kubernetes namespace used by an application team?","o":["Apply a default-deny NetworkPolicy, enforce the Restricted or Baseline Pod Security Standard, set ResourceQuotas, and grant RBAC roles scoped to the namespace","Grant cluster-admin to the team and let them configure security later","Allow all traffic and privileged Pods for flexibility","Disable audit logging for the namespace"],"a":[0],"e":"Starting restrictive and relaxing with justification is far safer than starting open; namespaces are the natural unit for applying these baselines."},{"id":"kcsa-comp01","d":"comp","q":"Why is the kube-apiserver the most critical component to secure in a Kubernetes cluster?","o":["It is the single entry point for all cluster operations and the only component that reads and writes etcd, so compromising it means full control of the cluster","It runs all the application Pods","It stores container images","It is the only component with a network interface"],"a":[0],"e":"Everything from kubectl to the kubelet goes through the API server; its authentication, authorization, admission, and TLS configuration define cluster security."},{"id":"kcsa-comp02","d":"comp","q":"Which authentication mechanisms does the kube-apiserver support for users? (Choose TWO.)","o":["X.509 client certificates","OpenID Connect (OIDC) tokens from an external identity provider","Username and password stored in a Kubernetes Secret object","Kubernetes User objects created with kubectl","SSH keys"],"a":[0,1],"e":"Kubernetes has no User object; identities come from certificates, bearer tokens (ServiceAccount, bootstrap, OIDC), or authenticating proxies and webhooks. Static password files were removed."},{"id":"kcsa-comp03","d":"comp","q":"Which API server authorization mode should be enabled for fine-grained, auditable access control, and which flag setting should be avoided?","o":["Enable RBAC (and Node authorization); avoid AlwaysAllow","Enable AlwaysAllow for simplicity; avoid RBAC","Enable ABAC only; avoid Node","Disable all authorization and rely on NetworkPolicy"],"a":[0],"e":"AlwaysAllow grants every authenticated request. RBAC with the Node authorizer is the recommended baseline; Webhook can add external policy."},{"id":"kcsa-comp04","d":"comp","q":"What does the --anonymous-auth=false flag do on the API server and the kubelet?","o":["It rejects requests that present no credentials instead of treating them as the system:anonymous user","It disables TLS","It turns off audit logging","It blocks ServiceAccount tokens"],"a":[0],"e":"Anonymous access is a common finding in benchmarks; disabling it (or at least ensuring RBAC grants anonymous nothing) prevents unauthenticated probing of the API and kubelet."},{"id":"kcsa-comp05","d":"comp","q":"Which admission controllers should be enabled on the API server to enforce Pod-level security and limit resource consumption? (Choose TWO.)","o":["PodSecurity (Pod Security Admission)","LimitRanger and ResourceQuota","AlwaysAdmit","AlwaysPullImages disabled","NamespaceAutoProvision"],"a":[0,1],"e":"PodSecurity enforces the Pod Security Standards per namespace; LimitRanger and ResourceQuota prevent resource exhaustion. AlwaysAdmit is deprecated and unsafe."},{"id":"kcsa-comp06","d":"comp","q":"Why should etcd be protected with TLS for both client and peer communication and with restricted network access?","o":["etcd holds the entire cluster state, including Secrets; anyone who can read it has effectively compromised the cluster","etcd serves container images","etcd runs the application Pods","etcd is exposed to end users by design"],"a":[0],"e":"etcd should accept only authenticated TLS connections from the API server (and other etcd members), listen on private interfaces, and have its data directory permissions locked down."},{"id":"kcsa-comp07","d":"comp","q":"How can Kubernetes Secrets be protected from being read in plaintext from the etcd data store?","o":["Configure encryption at rest with an EncryptionConfiguration on the API server (for example AES-GCM or a KMS provider)","Base64-encode them, which Kubernetes does by default","Store them as ConfigMaps instead","Enable RBAC only"],"a":[0],"e":"Without encryption at rest, Secrets sit in etcd and its backups as plain base64. The KMS provider option keeps the data encryption key wrapped by an external key service."},{"id":"kcsa-comp08","d":"comp","q":"Which kubelet settings reduce the attack surface of worker nodes? (Choose TWO.)","o":["Disable anonymous authentication and set authorization mode to Webhook so the API server authorizes kubelet API requests","Disable the read-only port (set --read-only-port=0)","Enable the --allow-privileged flag on all nodes by default","Run the kubelet with --anonymous-auth=true for monitoring tools","Expose the kubelet API on 0.0.0.0 without TLS"],"a":[0,1],"e":"The kubelet API can execute commands in containers; it must require authentication and delegate authorization. The legacy read-only port 10255 leaks Pod details and should be off."},{"id":"kcsa-comp09","d":"comp","q":"What is the purpose of kubelet client certificate rotation?","o":["To automatically renew the kubelet's credentials for talking to the API server before they expire, avoiding long-lived certificates","To rotate container images","To rotate ServiceAccount tokens for Pods","To change the node's IP address"],"a":[0],"e":"Enabling rotation (--rotate-certificates and server certificate rotation) keeps node identities short-lived and reduces the impact of a stolen certificate."},{"id":"kcsa-comp10","d":"comp","q":"What does the Node authorizer do?","o":["It restricts each kubelet to reading only the Secrets, ConfigMaps, and other objects related to Pods scheduled on its own node","It authorizes users to SSH to nodes","It decides which node a Pod runs on","It blocks nodes from j
