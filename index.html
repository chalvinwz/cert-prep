mazon EFS file system holds project files; most are not touched after the first month but must stay accessible on the same mount. How can the company reduce EFS cost?","o":["Enable EFS lifecycle management to move files to the EFS Infrequent Access (or Archive) storage class after 30 days","Move the file system to One Zone and delete old files","Replace EFS with EBS","Enable EFS encryption"],"a":[0],"e":"EFS lifecycle management transitions files not accessed for a chosen period to lower-cost IA or Archive classes transparently, while keeping them available through the same file system."},{"id":"saa-cost16","d":"cost","q":"A company's Amazon CloudWatch Logs bill grows every month because log groups keep data forever. The company needs only 30 days of searchable logs and must keep older logs cheaply for a year. What should the architect do?","o":["Set a 30-day retention policy on the log groups and export or stream older logs to Amazon S3 with a lifecycle rule to Glacier","Disable logging","Increase the retention to 365 days in CloudWatch","Create more log groups"],"a":[0],"e":"CloudWatch Logs storage is far more expensive than S3. Short retention plus archival to S3 (and then Glacier) satisfies the year-long requirement at a fraction of the cost."},{"id":"saa-cost17","d":"cost","q":"A company wants each business unit's AWS spend tracked and wants an alert when any unit's monthly spend is forecast to exceed its allocation. Which combination should be used? (Choose TWO.)","o":["Apply and activate cost allocation tags per business unit","Create AWS Budgets with forecast-based alerts filtered by tag","Enable AWS Shield Advanced","Use AWS Artifact reports","Enable S3 Versioning"],"a":[0,1],"e":"Activated cost allocation tags make spend attributable by business unit in Cost Explorer and Budgets; Budgets can then alert on actual or forecasted spend per tag."},{"id":"saa-cost18","d":"cost","q":"A company has several AWS accounts in AWS Organizations. One account owns Reserved Instances that are often unused while another account runs matching On-Demand instances. How can the company benefit from the reservations across accounts?","o":["Use consolidated billing with Reserved Instance sharing enabled so unused reservations apply to matching usage in other accounts","Move all workloads into one account","Sell the reservations on the Reserved Instance Marketplace","Buy duplicate reservations in each account"],"a":[0],"e":"With consolidated billing, Reserved Instance and Savings Plan discounts are shared across the organization's accounts by default, applied to any matching usage."},{"id":"saa-cost19","d":"cost","q":"Analysts run Amazon Athena queries over several TB of CSV logs in S3 and the per-query cost is high. Which changes reduce the amount of data scanned and therefore cost? (Choose TWO.)","o":["Convert the data to a columnar format such as Apache Parquet with compression","Partition the data in S3 by date and filter on the partition column","Move the data to S3 Glacier Deep Archive","Increase the Athena workgroup query limit","Query with SELECT * every time"],"a":[0,1],"e":"Athena bills per byte scanned. Columnar formats read only needed columns, compression shrinks bytes, and partitioning lets queries skip irrelevant data."},{"id":"saa-cost20","d":"cost","q":"A company must keep 50 TB of compliance archives for 7 years and expects to restore them at most once, with 48 hours of notice. Which option minimizes cost?","o":["S3 Glacier Deep Archive with bulk retrieval when a restore is needed","S3 Standard","S3 Glacier Instant Retrieval","S3 Standard-IA"],"a":[0],"e":"Deep Archive is the cheapest storage class; bulk retrievals complete within 48 hours and are the lowest-cost restore option, which matches the notice period."},{"id":"saa-cost21","d":"cost","q":"A company shares a large public dataset in Amazon S3 with researchers worldwide and is paying growing data transfer costs for their downloads. How can it shift the transfer cost to the users?","o":["Enable Requester Pays on the bucket","Enable S3 Transfer Acceleration","Move the bucket to Glacier","Put CloudFront in front of the bucket"],"a":[0],"e":"With Requester Pays, the requester's AWS account is billed for request and data transfer charges; the bucket owner pays only for storage."},{"id":"saa-cost22","d":"cost","q":"A company wants to run a Windows Server workload on EC2 but has no existing licenses and no compliance requirement for dedicated hardware. Which tenancy option is the MOST cost-effective?","o":["Default (shared) tenancy with license-included AMIs","Dedicated Hosts","Dedicated Instances","Bare metal instances"],"a":[0],"e":"Dedicated Hosts and Dedicated Instances cost more and are justified by bring-your-own-license or regulatory isolation needs. Without those, shared tenancy is cheapest."},{"id":"saa-cost23","d":"cost","q":"A company must move 200 TB of archived data from its data center to Amazon S3 once. Its internet link is 100 Mbps and already heavily used. Which option is the MOST cost-effective?","o":["Order AWS Snowball Edge devices and ship the data","Provision a 10 Gbps AWS Direct Connect connection for the migration","Upload over the existing internet link with multipart uploads","Use AWS DataSync over a new Site-to-Site VPN"],"a":[0],"e":"200 TB over 100 Mbps would take well over six months. Snowball devices are far cheaper than a dedicated Direct Connect port for a one-time transfer."},{"id":"saa-cost24","d":"cost","q":"A company runs a steady, predictable analytics workload on an Amazon Redshift provisioned cluster around the clock. How can it reduce the cluster's cost?","o":["Purchase Redshift reserved nodes for a one- or three-year term","Pause the cluster during business hours","Switch to Redshift Spectrum for everything","Add more nodes"],"a":[0],"e":"Reserved nodes offer significant discounts over on-demand pricing for clusters that run continuously. Pausing only helps for intermittent workloads."},{"id":"saa-cost25","d":"cost","q":"An application's EC2 fleet communicates heavily with an Amazon RDS database. The company notices large cross-Availability-Zone data transfer charges but still needs high availability. What is the BEST way to reduce these charges?","o":["Keep most traffic within an AZ where possible, for example by using zone-aware routing or caching with ElastiCache, while keeping Multi-AZ for failover","Move the database to a public subnet","Place all instances and the database in a single AZ and disable Multi-AZ","Use an internet gateway for database traffic"],"a":[0],"e":"Cross-AZ transfer is billed in both directions. Reducing chatter with caching and keeping read traffic local lowers charges without sacrificing the Multi-AZ failover that availability requires."},{"id":"saa-cost26","d":"cost","q":"A company's developers frequently leave test EC2 instances and unattached EBS volumes running. Which service highlights idle and underutilized resources so the team can remove them?","o":["AWS Trusted Advisor cost optimization checks","AWS Artifact","AWS Shield","Amazon Macie"],"a":[0],"e":"Trusted Advisor's cost optimization checks flag low-utilization EC2 instances, idle load balancers, unassociated Elastic IPs, and underutilized EBS volumes."}],"soa":[{"id":"soa-mon01","d":"mon","q":"A CloudOps engineer needs to monitor memory utilization and disk space used on a fleet of Amazon EC2 Linux instances in CloudWatch. The default EC2 metrics do not include these. What should the engineer do?","o":["Install and configure the CloudWatch agent on the instances to publish memory and disk metrics as custom metrics","Enable detailed monitoring on the instances","Create a CloudWatch Logs metric filter","Enable Enhanced Monitoring on the instances"],"a":[0],"e":"EC2 only reports hypervisor-visible metrics (CPU, network, disk I/O). Memory and filesystem usage are OS-level and need the CloudWatch agent (or a custom PutMetricData script). Detailed monitoring just changes the interval to 1 minute."},{"id":"soa-mon02","d":"mon","q":"An application writes logs to a CloudWatch Logs log group. The operations team wants an alarm when more than 50 lines containing the string ERROR appear in any 5-minute period. Which solution requires the LEAST effort?","o":["Create a metric filter on the log group that matches ERROR and publishes a custom metric, then create a CloudWatch alarm on that metric","Export the logs to S3 and query them with Athena hourly","Write a Lambda function that reads the log stream every minute","Enable CloudWatch Logs Insights and save a query"],"a":[0],"e":"Metric filters turn log pattern matches into CloudWatch metrics in near real time, and alarms can then be set on the metric with the required threshold and period."},{"id":"soa-mon03","d":"mon","q":"An operations team receives dozens of separate alarms during a single incident, for example high CPU, high latency, and ALB 5xx errors all from the same application. The team wants one notification only when the application is actually unhealthy. What should the engineer configure?","o":["A composite alarm that combines the individual alarms with AND/OR logic and sends a single SNS notification","A single alarm with a lower threshold","Delete all but one of the alarms","A CloudWatch dashboard"],"a":[0],"e":"Composite alarms evaluate a rule across other alarms' states and only act when the combined condition is true, reducing alarm noise during incidents."},{"id":"soa-mon04","d":"mon","q":"An engineer must find the 20 slowest API requests in the last hour from structured JSON application logs stored in CloudWatch Logs, sorted by a latency field. Which tool should the engineer use?","o":["CloudWatch Logs Insights with a query that parses the field, sorts by it, and limits to 20","CloudWatch metric filters","Amazon Athena on the live log group","AWS CloudTrail event history"],"a":[0],"e":"Logs Insights runs interactive queries directly against log groups with a purpose-built language that can filter, parse, sort, and aggregate JSON fields."},{"id":"soa-mon05","d":"mon","q":"An Auto Scaling group reacts slowly to traffic spikes because the EC2 CPU metric used by the scaling policy updates only every 5 minutes. How can the engineer make scaling react faster?","o":["Enable detailed monitoring on the launch template so EC2 metrics are published at 1-minute intervals","Increase the cooldown period","Use a larger instance type","Switch the policy to scheduled scaling"],"a":[0],"e":"Basic monitoring publishes EC2 metrics every 5 minutes; detailed monitoring (paid) publishes every minute, so alarms and target tracking policies evaluate sooner."},{"id":"soa-mon06","d":"mon","q":"An EC2 instance occasionally fails its system status check because of underlying hardware problems. The team wants the instance automatically moved to healthy hardware, keeping its instance ID, private IP, and Elastic IP, with no manual intervention. What should the engineer configure?","o":["A CloudWatch alarm on StatusCheckFailed_System with the EC2 recover action","A CloudWatch alarm on CPUUtilization with the reboot action","An Auto Scaling group with two instances","A Lambda function that terminates the instance"],"a":[0],"e":"The recover action migrates the instance to new underlying hardware while preserving its ID, IPs, and metadata. Reboot would not help with a host failure."},{"id":"soa-mon07","d":"mon","q":"Users report intermittent errors from a web application behind an Application Load Balancer. The engineer wants to know whether the errors come from the load balancer itself or from the application targets. Which CloudWatch metrics should be compared?","o":["HTTPCode_ELB_5XX_Count versus HTTPCode_Target_5XX_Count","RequestCount versus ActiveConnectionCount","HealthyHostCount versus UnHealthyHostCount","ProcessedBytes versus ConsumedLCUs"],"a":[0],"e":"ELB-generated 5xx codes indicate problems at the load balancer (for example no healthy targets or timeouts), while Target 5xx codes are returned by the application. The split tells you where to look."},{"id":"soa-mon08","d":"mon","q":"A database administrator wants to see which SQL statements and wait events are responsible for load on an Amazon RDS for MySQL instance, and also wants OS-level process metrics from the database host. Which features should be enabled? (Choose TWO.)","o":["Performance Insights for query-level load analysis","Enhanced Monitoring for OS process and thread metrics","RDS Multi-AZ","Storage autoscaling","Read replicas"],"a":[0,1],"e":"Performance Insights shows database load by SQL, wait, user, and host. Enhanced Monitoring streams OS metrics (processes, threads, memory) from an agent on the host with up to 1-second granularity."},{"id":"soa-mon09","d":"mon","q":"An operations team manages workloads in three AWS accounts across two Regions and wants a single CloudWatch dashboard showing key metrics from all of them. What should the engineer set up?","o":["CloudWatch cross-account observability (or cross-account cross-Region dashboards) with the monitoring account linked to the source accounts","A separate dashboard in each account","Export all metrics to S3 and build a QuickSight dashboard","Copy the metrics manually each day"],"a":[0],"e":"CloudWatch supports cross-account, cross-Region dashboards and cross-account observability, where a central monitoring account views metrics, logs, and traces from linked source accounts."},{"id":"soa-mon10","d":"mon","q":"The security team must be notified by email within a minute whenever any EC2 instance in the account enters the stopped or terminated state. Which solution should the engineer implement?","o":["An Amazon EventBridge rule matching EC2 Instance State-change Notification events for those states, with an SNS topic as the target","A CloudWatch alarm on the StatusCheckFailed metric","A daily Trusted Advisor report","CloudTrail event history reviewed hourly"],"a":[0],"e":"EC2 emits state-change events to EventBridge in near real time. A rule with an event pattern for the desired states can target SNS for email delivery."},{"id":"soa-mon11","d":"mon","q":"An engineer wants to detect unusual spikes in API call volume or error rates in CloudTrail, such as a sudden burst of RunInstances calls, without writing custom analysis. Which feature should be enabled?","o":["CloudTrail Insights events","CloudTrail data events","CloudTrail log file validation","AWS Config configuration recorder"],"a":[0],"e":"CloudTrail Insights analyzes write management events and raises Insights events when API call rates or error rates deviate from normal baselines."},{"id":"soa-mon12","d":"mon","q":"A metric for an e-commerce site has a strong daily and weekly pattern. Static alarm thresholds either fire at normal nightly lows or miss real problems during the day. What should the engineer use?","o":["A CloudWatch alarm based on anomaly detection, which builds a band from the metric's historical pattern","A static threshold alarm with a longer evaluation period","Two static alarms, one for day and one for night","Metric math that divides the metric by 2"],"a":[0],"e":"CloudWatch anomaly detection applies a machine-learning model to the metric's history and alarms when values fall outside the expected band, adapting to seasonality."},{"id":"soa-mon13","d":"mon","q":"A microservices application built on API Gateway, Lambda, and DynamoDB has high end-to-end latency. The team needs to see which service in the request path contributes most. Which tool should be used?","o":["AWS X-Ray tracing enabled on API Gateway and the Lambda functions","CloudWatch Logs retention","CloudTrail event history","VPC Flow Logs"],"a":[0],"e":"X-Ray traces individual requests across services and produces a service map and segment timings so the slow hop is visible."},{"id":"soa-mon14","d":"mon","q":"A database running on EC2 with a gp2 EBS volume becomes slow during busy periods. CloudWatch shows the volume's BurstBalance metric dropping to zero at those times. What is the MOST appropriate fix?","o":["Migrate the volume to gp3 or Provisioned IOPS and set the IOPS needed, so performance no longer depends on burst credits","Reboot the instance when the balance is low","Enable EBS encryption","Take more frequent snapshots"],"a":[0],"e":"gp2 performance scales with size and relies on burst credits; a zero BurstBalance means sustained I/O exceeds baseline. gp3 lets you provision IOPS and throughput independently of size."},{"id":"soa-mon15","d":"mon","q":"A t3.medium instance becomes extremely slow every afternoon. CloudWatch shows CPUCreditBalance reaching zero at those times. Which actions resolve the slowdown? (Choose TWO.)","o":["Enable T3 unlimited mode so the instance can burst beyond its credit balance for an extra charge","Change to a non-burstable instance type such as m6i if the load is sustained","Add more EBS volumes","Enable detailed monitoring","Increase the root volume size"],"a":[0,1],"e":"Burstable instances earn CPU credits at a baseline rate; when they run out, CPU is throttled. Unlimited mode or a fixed-performance instance type both remove the throttling."},{"id":"soa-mon16","d":"mon","q":"An engineer wants organization-wide visibility into S3 storage usage and activity trends, such as which buckets are growing fastest and how much data is in each storage class, with recommendations. Which feature provides this?","o":["Amazon S3 Storage Lens","S3 Inventory","S3 server access logs","AWS Cost Explorer"],"a":[0],"e":"S3 Storage Lens provides an interactive dashboard of storage metrics and trends across accounts and buckets, with cost-efficiency and data-protection recommendations."},{"id":"soa-mon17","d":"mon","q":"An Amazon RDS instance ran out of storage and stopped accepting writes. The team wants to prevent this in the future with minimal manual work. Which actions should be taken? (Choose TWO.)","o":["Create a CloudWatch alarm on the FreeStorageSpace metric to warn before space runs out","Enable RDS storage autoscaling with a maximum storage threshold","Enable Multi-AZ","Reduce the backup retention period","Switch to a larger instance class"],"a":[0,1],"e":"Storage autoscaling grows the allocated storage automatically when free space is low, and an alarm on FreeStorageSpace gives early warning. Instance class affects compute, not storage."},{"id":"soa-mon18","d":"mon","q":"An application using a provisioned-capacity DynamoDB table reports intermittent ProvisionedThroughputExceededException errors even though the average consumed capacity is well below the provisioned amount. What is the MOST likely cause?","o":["A hot partition caused by an uneven partition key, so one partition exceeds its share of throughput","The table is encrypted","The table has too many global secondary indexes","Point-in-time recovery is enabled"],"a":[0],"e":"Provisioned throughput is divided across partitions. A skewed key distribution drives one partition past its limit while table-level averages look fine. Fix the key design or use adaptive capacity/on-demand."},{"id":"soa-mon19","d":"mon","q":"A Lambda function that processes orders is sometimes not invoked, and CloudWatch shows a rising Throttles metric for the function. What is the cause and the fix?","o":["The function is hitting the account or reserved concurrency limit; raise the limit or set appropriate reserved concurrency for the function","The function timeout is too long; shorten it","The function has too much memory; reduce it","CloudWatch Logs retention is too short; increase it"],"a":[0],"e":"Throttles count invocations rejected because concurrency was exhausted. Requesting a higher account limit or reserving concurrency for the critical function resolves it."},{"id":"soa-mon20","d":"mon","q":"A company wants to stream specific CloudWatch Logs events in real time to an Amazon OpenSearch Service domain for analysis, rather than exporting in batches. Which feature should the engineer use?","o":["A CloudWatch Logs subscription filter with OpenSearch (or Kinesis Data Firehose) as the destination","CloudWatch Logs export to S3","A metric filter","CloudWatch Logs Insights"],"a":[0],"e":"Subscription filters deliver matching log events in near real time to Kinesis Data Streams, Kinesis Data Firehose, Lambda, or OpenSearch Service."},{"id":"soa-mon21","d":"mon","q":"The operations team wants to be alerted when a public website's login page returns an error or takes longer than 3 seconds, even when there is no real user traffic at night. Which service should be used?","o":["Amazon CloudWatch Synthetics canaries that run a script against the endpoint on a schedule","CloudWatch Logs Insights","A CloudWatch alarm on the ALB RequestCount metric","AWS Config"],"a":[0],"e":"Synthetics canaries are scheduled scripts that probe endpoints, APIs, and UI flows and publish success and latency metrics, which can be alarmed on regardless of real traffic."},{"id":"soa-mon22","d":"mon","q":"During a traffic surge, the operations team wants to see in near real time which client IP addresses are generating the most requests, based on the application's access logs in CloudWatch Logs. Which feature is designed for this?","o":["CloudWatch Contributor Insights rules on the log group","CloudWatch anomaly detection","CloudWatch Synthetics","CloudTrail Insights"],"a":[0],"e":"Contributor Insights analyzes log data to produce time-series reports of the top-N contributors, such as the heaviest IPs or the most-hit URLs."},{"id":"soa-mon23","d":"mon","q":"Messages in an Amazon SQS queue are being processed, but the business notices that some orders are handled hours late. Which CloudWatch metric best indicates a growing backlog that the consumers are not keeping up with?","o":["ApproximateAgeOfOldestMessage","NumberOfMessagesDeleted","NumberOfEmptyReceives","SentMessageSize"],"a":[0],"e":"ApproximateAgeOfOldestMessage rises when messages wait longer, which directly reflects processing delay. It is a common trigger for scaling consumers."},{"id":"soa-mon24","d":"mon","q":"An engineer wants an Auto Scaling group behind an Application Load Balancer to keep roughly 1,000 requests per minute per instance, adding and removing instances automatically. Which scaling policy is the simplest to configure?","o":["A target tracking policy using the ALBRequestCountPerTarget metric with a target value of 1000","A step scaling policy on CPU with several steps","Scheduled scaling","Manual scaling"],"a":[0],"e":"Target tracking policies keep a chosen metric at a target value and create the needed CloudWatch alarms automatically; ALBRequestCountPerTarget is a predefined metric for this purpose."},{"id":"soa-mon25","d":"mon","q":"A log group that stores verbose debug logs is driving up CloudWatch Logs costs. The logs are rarely queried and must be kept for 90 days. Which changes reduce cost? (Choose TWO.)","o":["Set a 90-day retention policy on the log group","Use the Infrequent Access log class for the new log group that receives these logs","Enable detailed monitoring","Create a metric filter","Subscribe the log group to Kinesis"],"a":[0,1],"e":"Retention policies stop paying for storage beyond the required period, and the Infrequent Access log class halves ingestion cost for logs that are rarely queried, with a reduced feature set."},{"id":"soa-mon26","d":"mon","q":"The company wants to be notified automatically about AWS-scheduled events that affect its resources, such as planned EC2 host maintenance or an RDS maintenance window, so the team can act before the change. What should be configured?","o":["An EventBridge rule for AWS Health events targeting SNS or a ticketing integration","A CloudWatch alarm on CPU utilization","CloudTrail Insights","A daily check of the public AWS service status page"],"a":[0],"e":"AWS Health publishes account-specific events to EventBridge. A rule can route scheduled-change events to SNS, Slack, or a ticket system for proactive handling."},{"id":"soa-mon27","d":"mon","q":"An ElastiCache for Redis cluster has a rising Evictions metric and application cache hit rate is falling. What does this indicate and what should the engineer do?","o":["The cache is out of memory and is removing keys; scale up the node type or add shards (and review TTLs or maxmemory policy)","Redis is restarting; enable Multi-AZ","The network is saturated; enable encryption","Backups are failing; increase the snapshot window"],"a":[0],"e":"Evictions count keys removed to free memory. Persistent evictions mean the dataset exceeds memory, so more memory (bigger node or more shards) or shorter TTLs are needed."},{"id":"soa-mon28","d":"mon","q":"An engineer wants an alarm when the error rate of an API exceeds 2%, but CloudWatch only has separate metrics for total requests and 5xx errors. How can this be achieved without custom code?","o":["Use CloudWatch metric math to create an expression such as (errors / requests) * 100 and alarm on the expression","Create two alarms and compare them manually","Export both metrics to S3 and compute daily","Enable anomaly detection on the request count"],"a":[0],"e":"Metric math lets alarms evaluate expressions over multiple metrics, such as a percentage, without publishing a new custom metric."},{"id":"soa-mon29","d":"mon","q":"An EC2 instance shows a failed instance status check while the system status check passes. What does this most likely indicate?","o":["A problem inside the instance, such as a misconfigured network, exhausted memory, or a corrupted file system, which the customer must fix","A failure of the underlying AWS host hardware","An outage of the Availability Zone","A problem with the EBS service in the Region"],"a":[0],"e":"System status checks cover AWS infrastructure beneath the instance. Instance status checks detect software or configuration issues within the guest OS, which usually need a reboot or OS-level troubleshooting."},{"id":"soa-rel01","d":"rel","q":"A company wants to confirm that its Amazon RDS Multi-AZ failover works and that its application reconnects correctly, without waiting for a real failure. How can the engineer test this safely?","o":["Reboot the DB instance with the failover option so RDS promotes the standby and updates the endpoint DNS","Delete the primary instance","Stop the instance and start it again","Change the instance class"],"a":[0],"e":"Reboot with failover forces a Multi-AZ failover, which is the supported way to test failover behavior and application DNS caching settings."},{"id":"soa-rel02","d":"rel","q":"When an Auto Scaling group scales in, instances are terminated while still processing long-running jobs, causing data loss. What should the engineer configure so instances can finish work before termination?","o":["An Auto Scaling lifecycle hook on instance termination that keeps the instance in Terminating:Wait until the job completes","A longer health check grace period","A larger desired capacity","Termination protection on every instance"],"a":[0],"e":"Lifecycle hooks pause the instance in a wait state so scripts or a Lambda function can drain work and then signal continue, before the instance is terminated."},{"id":"soa-rel03","d":"rel","q":"A new AMI with security patches must be rolled out to all instances in an Auto Scaling group without downtime, replacing instances gradually while keeping at least 90% of capacity healthy. Which approach should be used?","o":["Update the launch template version and start an instance refresh with a minimum healthy percentage of 90","Terminate all instances at once and let the ASG replace them","Manually stop each instance and change its AMI","Create a new Auto Scaling group and delete the old one immediately"],"a":[0],"e":"Instance refresh replaces instances in batches according to the minimum healthy percentage, honoring health checks and optional checkpoints, with no manual orchestration."},{"id":"soa-rel04","d":"rel","q":"An application takes several minutes to initialize on a new instance, so scaling out is too slow to absorb sudden traffic. The company does not want to pay for extra running instances all the time. Which Auto Scaling feature helps?","o":["A warm pool of pre-initialized instances kept in a stopped or hibernated state","A shorter cooldown period","Detailed monitoring","A larger maximum capacity"],"a":[0],"e":"Warm pools pre-initialize instances and keep them stopped or hibernated at low cost, so they can join the group in seconds when scaling out."},{"id":"soa-rel05","d":"rel","q":"An Application Load Balancer marks all targets unhealthy even though the application responds correctly on its main pages. The application returns HTTP 302 on the root path. Which change is the MOST appropriate?","o":["Configure the target group health check to use a dedicated path such as /health that returns HTTP 200, or add 302 to the success codes","Disable health checks","Change to a Network Load Balancer","Increase the deregistration delay"],"a":[0],"e":"ALB health checks expect a 200 response by default. A redirect fails the check. A lightweight health endpoint returning 200, or matching 200-399, fixes it."},{"id":"soa-rel06","d":"rel","q":"A developer accidentally ran a destructive UPDATE on an Amazon Aurora MySQL cluster 20 minutes ago. The team wants to rewind the existing cluster to just before the mistake as quickly as possible, without creating a new cluster. Which feature should be used?","o":["Aurora Backtrack, if it was enabled on the cluster","Point-in-time restore to a new cluster","A manual snapshot taken yesterday","Multi-AZ failover"],"a":[0],"e":"Backtrack rewinds an Aurora MySQL cluster in place within the configured window in minutes. Point-in-time restore works too but creates a new cluster and takes longer."},{"id":"soa-rel07","d":"rel","q":"An Amazon RDS for PostgreSQL database must be recoverable in a second Region in case of a regional disaster. The business accepts up to 24 hours of data loss. Which solution is the MOST cost-effective?","o":["Automate copying the daily automated snapshot to the second Region using AWS Backup or an EventBridge-triggered Lambda","Create a cross-Region read replica","Enable Multi-AZ","Run a second active database in the other Region"],"a":[0],"e":"With a 24-hour RPO, daily cross-Region snapshot copies meet the requirement at minimal cost. A cross-Region read replica gives a much lower RPO but runs a billed instance continuously."},{"id":"soa-rel08","d":"rel","q":"Compliance requires that backups of RDS, EBS, and DynamoDB resources cannot be deleted by anyone, including administrators, for 1 year. Which configuration enforces this?","o":["An AWS Backup vault with Vault Lock in compliance mode and a backup plan assigning resources by tag","Deleting the IAM delete permissions for backups","Daily manual snapshots","EBS snapshot archive"],"a":[0],"e":"Backup Vault Lock in compliance mode makes recovery points immutable for the retention period and cannot be removed even by the root user once the cooling-off period ends."},{"id":"soa-rel09","d":"rel","q":"An operations team needs regular backups of an Amazon EFS file system and the ability to restore individual files or the whole file system. Which service should be used?","o":["AWS Backup with an EFS backup plan","EBS snapshots of the EFS mount","S3 Cross-Region Replication","An EFS lifecycle policy"],"a":[0],"e":"AWS Backup natively supports EFS, including full and item-level restores, scheduling, and retention. EFS is not EBS-backed, so EBS snapshots do not apply."},{"id":"soa-rel10","d":"rel","q":"A company requires that objects written to an S3 bucket in ap-southeast-3 are replicated to a bucket in another Region within 15 minutes, with replication metrics and a service-level agreement. Which feature should be enabled?","o":["S3 Cross-Region Replication with S3 Replication Time Control (RTC)","S3 Transfer Acceleration","S3 Batch Operations","S3 Lifecycle transitions"],"a":[0],"e":"Replication Time Control adds an SLA that 99.99% of objects replicate within 15 minutes and provides replication metrics and notifications."},{"id":"soa-rel11","d":"rel","q":"A DynamoDB table holds critical order data. The team must be able to restore the table to any second within the last 35 days after an accidental bulk delete. Which feature should be enabled?","o":["Point-in-time recovery (PITR) on the table","On-demand backups taken weekly","DynamoDB Streams","Global tables"],"a":[0],"e":"PITR provides continuous backups and restores to any point in the preceding 35 days. On-demand backups only capture the moments they were taken."},{"id":"soa-rel12","d":"rel","q":"An EC2 instance hosts a critical internal application. The company wants the instance automatically rebooted when its instance status check fails, and recovered on new hardware when the system status check fails. How should this be configured?","o":["Two CloudWatch alarms: one on StatusCheckFailed_Instance with the reboot action and one on StatusCheckFailed_System with the recover action","One alarm on CPUUtilization with the terminate action","An Auto Scaling group with a minimum of zero","A Lambda function scheduled hourly"],"a":[0],"e":"Reboot addresses OS-level hangs; recover addresses host failures by migrating the instance. Each maps to the corresponding status check metric."},{"id":"soa-rel13","d":"rel","q":"A Network Load Balancer has targets in two Availability Zones, but one AZ holds eight instances and the other two. Traffic is split evenly between AZs, overloading the AZ with fewer instances. What should the engineer change?","o":["Enable cross-zone load balancing so traffic is distributed evenly across all targets regardless of AZ","Add more listeners","Move to an Application Load Balancer and disable health checks","Reduce the health check interval"],"a":[0],"e":"Without cross-zone load balancing, each load balancer node sends traffic only to targets in its own AZ in equal AZ shares. Enabling it balances across all registered targets. (ALBs have it on by default; NLBs do not.)"},{"id":"soa-rel14","d":"rel","q":"An Auto Scaling group scales out, and before the new instances finish starting, the alarm triggers again and launches even more instances than needed. What should the engineer adjust?","o":["Set an appropriate cooldown period (or instance warm-up time for target tracking) so the group waits for new instances to contribute before scaling again","Lower the maximum capacity to 1","Switch to manual scaling","Disable the health checks"],"a":[0],"e":"Cooldown and warm-up settings prevent the group from launching or terminating additional instances until previous scaling activities have taken effect."},{"id":"soa-rel15","d":"rel","q":"A retail site has a strong recurring daily traffic pattern. The team wants capacity added shortly before the daily rise, based on historical data, in addition to reactive scaling. Which policy type should be added?","o":["Predictive scaling","Step scaling","Simple scaling","A larger minimum capacity"],"a":[0],"e":"Predictive scaling uses machine learning on historical load to forecast demand and schedules capacity ahead of time, complementing target tracking for unexpected spikes."},{"id":"soa-rel16","d":"rel","q":"A company must guarantee that it can launch 20 c6i.4xlarge instances in a specific Availability Zone during an upcoming event, even if the AZ becomes capacity-constrained. Which option provides this assurance?","o":["Create an On-Demand Capacity Reservation for the instances in that Availability Zone","Buy Spot Instances in advance","Purchase a Savings Plan","Enable Auto Scaling with a high maximum"],"a":[0],"e":"Capacity Reservations reserve compute capacity in a specific AZ for any duration. Savings Plans and Spot do not guarantee capacity."},{"id":"soa-rel17","d":"rel","q":"Snapshots of a large EBS volume are taken daily. Restored volumes perform poorly for the first hours because blocks are lazily loaded from S3. How can the engineer make restored volumes fully performant immediately in a specific AZ?","o":["Enable EBS fast snapshot restore on the snapshot for that Availability Zone","Use a larger volume size","Encrypt the snapshot","Copy the snapshot to another Region"],"a":[0],"e":"Fast snapshot restore pre-initializes the snapshot so volumes created from it deliver full performance at creation, at an hourly charge per snapshot per AZ."},{"id":"soa-rel18","d":"rel","q":"A company runs an Amazon RDS for MySQL primary in one Region with a cross-Region read replica. The primary Region suffers a prolonged outage. What should the engineer do to restore write capability in the other Region?","o":["Promote the read replica to a standalone instance and point the application to its endpoint","Reboot the primary with failover","Create a new read replica of the replica","Restore the latest automated backup in the primary Region"],"a":[0],"e":"Promoting a cross-Region read replica breaks replication and makes it a writable primary. Application endpoints must then be updated (ideally via Route 53 or a config change)."},{"id":"soa-rel19","d":"rel","q":"A company wants to replicate its on-premises and EC2-based servers continuously to AWS so it can fail over in minutes during a disaster, with periodic non-disruptive drills. Which AWS service is purpose-built for this?","o":["AWS Elastic Disaster Recovery (AWS DRS)","AWS Backup","AWS DataSync","AWS Snowball Edge"],"a":[0],"e":"Elastic Disaster Recovery performs block-level continuous replication to a low-cost staging area and launches recovery instances in minutes, supporting drills without affecting production."},{"id":"soa-rel20","d":"rel","q":"A consumer repeatedly fails to process a particular SQS message, which is retried indefinitely and blocks the consumer. What should the engineer configure?","o":["A dead-letter queue with a redrive policy and a suitable maxReceiveCount","A longer message retention period","A shorter visibility timeout","A FIFO queue"],"a":[0],"e":"After the message has been received maxReceiveCount times, SQS moves it to the dead-letter queue so the consumer can continue, and the message can be inspected later."},{"id":"soa-rel21","d":"rel","q":"A new version of an Amazon ECS service was deployed with a bug that causes tasks to crash on startup. The deployment keeps launching failing tasks and does not roll back. Which setting prevents this in the future?","o":["Enable the ECS deployment circuit breaker with automatic rollback on the service","Increase the task CPU","Set the desired count to zero","Use the EC2 launch type"],"a":[0],"e":"The deployment circuit breaker detects deployments that cannot reach a steady state and can automatically roll back to the last working task definition."},{"id":"soa-rel22","d":"rel","q":"An Auto Scaling group using Spot Instances frequently loses capacity when a single instance type's Spot pool is interrupted. How can the engineer improve availability of Spot capacity?","o":["Use a mixed instances policy with several instance types and the price-capacity-optimized allocation strategy, and enable Capacity Rebalancing","Use only one instance type with a higher maximum price","Switch all instances to Dedicated Hosts","Disable health checks"],"a":[0],"e":"Diversifying across instance types and AZs with a capacity-aware allocation strategy reduces interruption risk, and Capacity Rebalancing proactively replaces instances when an interruption warning is issued."},{"id":"soa-rel23","d":"rel","q":"A serverless application opens hundreds of connections to an Amazon RDS for PostgreSQL database during bursts, exhausting the database's connection limit and slowing failover. Which service addresses this?","o":["Amazon RDS Proxy, which pools and shares connections and speeds up failover","A larger RDS instance class","Read replicas","Aurora Backtrack"],"a":[0],"e":"RDS Proxy sits between the application and the database, multiplexing connections and preserving them across failovers, which reduces failover time and connection storms from Lambda."},{"id":"soa-rel24","d":"rel","q":"A launch template was updated with a new instance type, but instances in the Auto Scaling group are still launching with the old type. What is the MOST likely cause?","o":["The Auto Scaling group references a specific launch template version rather than $Latest or $Default, so it still uses the old version","The AMI is deregistered","The instances are Spot","Detailed monitoring is disabled"],"a":[0],"e":"Launch templates are versioned. An ASG pinned to version 1 ignores new versions until the ASG is updated to use $Latest, $Default, or the new version number."},{"id":"soa-rel25","d":"rel","q":"A company's web tier runs in two Availability Zones behind an ALB, but the single Amazon ElastiCache for Redis node sits in one AZ and its failure takes the site down. How should resilience be improved?","o":["Convert to a Redis replication group with replicas in other AZs and Multi-AZ automatic failover enabled","Increase the node size","Add a Memcached node","Take hourly snapshots of the node"],"a":[0],"e":"A replication group with Multi-AZ promotes a cross-AZ replica automatically when the primary fails, with the primary endpoint updated for the application."},{"id":"soa-rel26","d":"rel","q":"Route 53 must fail over to a secondary site when the primary web application becomes unhealthy. The primary runs behind a private internal load balancer that Route 53 health checkers cannot reach from the internet. What should the engineer do?","o":["Create a CloudWatch alarm that reflects the application's health and base the Route 53 health check on the alarm state","Make the load balancer internet-facing","Use a TCP health check against the private IP","Disable health checks and use weighted routing"],"a":[0],"e":"Route 53 health checks can monitor the state of a CloudWatch alarm instead of an endpoint, which is the supported pattern for private resources."},{"id":"soa-rel27","d":"rel","q":"A company runs an application on EC2 instances in a single Availability Zone with an EBS volume per instance. It wants the application to survive the loss of that AZ with minimal changes. Which actions should be part of the solution? (Choose TWO.)","o":["Run instances in an Auto Scaling group across multiple Availability Zones behind a load balancer","Move shared data to a multi-AZ storage service such as Amazon EFS or Amazon S3","Create more EBS volumes in the same AZ","Enable EBS encryption","Use an Elastic IP on each instance"],"a":[0,1],"e":"EBS volumes are AZ-bound, so data shared by the instances needs AZ-independent storage, and compute needs to span AZs behind a load balancer."},{"id":"soa-rel28","d":"rel","q":"A production Amazon RDS Multi-AZ instance has pending maintenance: an operating system update and a minor engine version upgrade. The company wants minimal disruption. Which statements are correct? (Choose TWO.)","o":["Set the preferred maintenance window to a low-traffic period so pending maintenance is applied then","The OS update is applied to the standby first, followed by a failover, so the interruption is limited to the failover time","Minor engine version upgrades on Multi-AZ are applied to both instances at once with no downtime at all","Maintenance windows apply only to automated backups","Pending maintenance can only be applied by AWS Support"],"a":[0,1],"e":"RDS applies pending maintenance inside the chosen window. For Multi-AZ, OS updates follow a standby-first pattern with a failover, so the application sees only a brief interruption. Engine version upgrades are applied to both instances together and do cause a short outage, which is why they also belong in the window."},{"id":"soa-rel29","d":"rel","q":"An operations team wants EBS snapshots of all volumes tagged Backup=true taken every 6 hours, kept for 7 days, with no scripts to maintain. Which service should be used?","o":["Amazon Data Lifecycle Manager with a tag-based policy","A cron job on a management instance","AWS CloudFormation","AWS Trusted Advisor"],"a":[0],"e":"Data Lifecycle Manager policies target volumes or instances by tag and manage snapshot creation, retention, and optional cross-Region copy automatically."},{"id":"soa-dep01","d":"dep","q":"A CloudFormation stack update failed halfway through and the stack is now in UPDATE_ROLLBACK_COMPLETE. The engineer wants to preview exactly which resources a corrected template will modify or replace before applying it. What should the engineer use?","o":["Create a change set for the stack with the corrected template and review it before executing","Delete the stack and recreate it","Run the update again and watch the events","Use drift detection"],"a":[0],"e":"Change sets show the proposed resource additions, modifications, and replacements, including whether a replacement will cause interruption, before any change is made."},{"id":"soa-dep02","d":"dep","q":"A security baseline (CloudTrail, Config recorder, and a GuardDuty detector) must be deployed to every account in an AWS Organization, including accounts created in the future, in three Regions. Which approach requires the LEAST ongoing effort?","o":["Deploy a CloudFormation StackSet with service-managed permissions targeting the organization's OUs with automatic deployment enabled","Log in to each account and create the stack manually","Email the template to each account owner","Use a single stack in the management account"],"a":[0],"e":"StackSets with service-managed permissions deploy stacks across accounts and Regions in an organization and automatically add them to new accounts in targeted OUs."},{"id":"soa-dep03","d":"dep","q":"Resources that were created by CloudFormation have been modified manually in the console, and stack updates now behave unexpectedly. How can the engineer identify which resources differ from the template?","o":["Run CloudFormation drift detection on the stack and review the drift results","Delete and recreate the stack","Review CloudTrail for the last week manually","Enable termination protection"],"a":[0],"e":"Drift detection compares the live configuration of supported resources with the stack's expected configuration and reports each drifted property."},{"id":"soa-dep04","d":"dep","q":"A CloudFormation stack includes an Amazon RDS database. The team wants to be able to delete the stack during environment teardown without losing the database data. Which template setting achieves this?","o":["Set DeletionPolicy: Snapshot (or Retain) on the RDS resource","Set UpdateReplacePolicy: Delete","Enable stack termination protection","Add a DependsOn attribute"],"a":[0],"e":"DeletionPolicy: Snapshot creates a final snapshot when the stack is deleted; Retain leaves the resource in place. Termination protection prevents the whole stack from being deleted at all."},{"id":"soa-dep05","d":"dep","q":"A CloudFormation template launches an EC2 instance whose user data script installs and configures software. The stack reports CREATE_COMPLETE before the software is ready, so dependent resources fail. How can the engineer make the stack wait for the configuration to finish?","o":["Add a CreationPolicy to the instance and have the user data call cfn-signal when configuration succeeds","Add a 10-minute sleep in the template","Increase the instance size","Use a DeletionPolicy"],"a":[0],"e":"With a CreationPolicy, CloudFormation waits for the specified number of success signals from cfn-signal (within a timeout) before marking the resource created."},{"id":"soa-dep06","d":"dep","q":"A team wants to prevent anyone from accidentally updating or replacing the production database resource inside a CloudFormation stack during routine stack updates, while allowing other resources to change. What should be configured?","o":["A stack policy that denies Update actions on the database's logical resource ID","Stack termination protection","An IAM policy denying cloudformation:UpdateStack","A DeletionPolicy of Retain"],"a":[0],"e":"Stack policies control which resources can be updated during a stack update. Termination protection only blocks stack deletion."},{"id":"soa-dep07","d":"dep","q":"A networking team maintains a CloudFormation stack that creates a VPC and subnets. Application teams in the same account need to reference those subnet IDs from their own stacks without hard-coding values. What should the networking team do?","o":["Export the subnet IDs in the Outputs section and have application stacks use Fn::ImportValue","Put all resources in one giant stack","Email the subnet IDs to the application teams","Use nested stacks in every application stack"],"a":[0],"e":"Cross-stack references use exported outputs and Fn::ImportValue. CloudFormation also prevents deleting a stack whose exports are in use."},{"id":"soa-dep08","d":"dep","q":"A CloudFormation template should always launch the latest Amazon Linux 2023 AMI in whatever Region it is deployed to, without maintaining a mapping of AMI IDs. Which approach achieves this?","o":["Use a parameter of type AWS::SSM::Parameter::Value<AWS::EC2::Image::Id> that references the public SSM parameter for the latest AMI","Hard-code the AMI ID for each Region in a Mappings section","Copy the AMI to every Region manually each month","Use a Lambda-backed custom resource that searches for AMIs by name"],"a":[0],"e":"AWS publishes the latest AMI IDs as public Systems Manager parameters. Referencing them through an SSM parameter type resolves the current ID at deployment time in any Region."},{"id":"soa-dep09","d":"dep","q":"A web application runs on AWS Elastic Beanstalk. The team needs to release a new version with zero downtime and the ability to roll back instantly if problems appear. Which deployment approach fits?","o":["Deploy the new version to a separate environment and use the swap environment URLs (CNAME swap) for blue/green","All-at-once deployment to the existing environment","Deploy directly to the instances with SSH","Rolling deployment with a batch size of 100%"],"a":[0],"e":"Blue/green via CNAME swap directs traffic to the new environment atomically and swapping back is an instant rollback. All-at-once causes downtime."},{"id":"soa-dep10","d":"dep","q":"Hundreds of EC2 instances must receive operating system security patches monthly during a defined window, with approval rules for patch severity and reporting on compliance. Which service and features should be used?","o":["AWS Systems Manager Patch Manager with a patch baseline and a maintenance window","AWS CodeDeploy","Amazon Inspector","AWS Config"],"a":[0],"e":"Patch Manager defines baselines (which patches are approved), scans and installs via Run Command, and maintenance windows control when patching runs. Compliance is reported in Patch Manager and Config."},{"id":"soa-dep11","d":"dep","q":"An operations team must ensure that a specific configuration (for example the CloudWatch agent installed and running, and a security setting enforced) is always present on every instance, re-applying it automatically if someone changes it. Which Systems Manager capability should be used?","o":["State Manager associations that apply a document on a schedule","Run Command executed once","Session Manager","Inventory"],"a":[0],"e":"State Manager associations apply a Systems Manager document to targets on a defined schedule, re-establishing the desired state if it drifts."},{"id":"soa-dep12","d":"dep","q":"An engineer needs to run a one-off shell command (restart a service) on all EC2 instances tagged Role=web across two accounts, without logging in to each instance. Which tool should be used?","o":["AWS Systems Manager Run Command targeting instances by tag","SSH in a for loop from a bastion host","AWS CloudFormation","Amazon EventBridge"],"a":[0],"e":"Run Command executes documents on managed instances selected by tag, resource group, or ID, with rate controls and logged output, and no inbound access needed."},{"id":"soa-dep13","d":"dep","q":"Every week an operator manually stops an instance, creates an AMI, and restarts the instance. The team wants this sequence executed automatically on a schedule with approval steps and logging. Which Systems Manager capability should be used?","o":["An Automation runbook (for example AWS-CreateImage based) scheduled with EventBridge or a maintenance window","Run Command with a shell script","Session Manager","Parameter Store"],"a":[0],"e":"Automation runbooks define multi-step workflows across AWS APIs, support approvals and branching, and can be scheduled, which fits repetitive operational procedures."},{"id":"soa-dep14","d":"dep","q":"Applications in dev, test, and prod environments need configuration values (such as feature flags and endpoints) retrieved at runtime, organized per environment, with some values encrypted. Which service and structure should be used?","o":["Systems Manager Parameter Store with a hierarchy such as /app/prod/db-endpoint and SecureString parameters for secrets","Environment variables baked into the AMI","A text file in a public S3 bucket","Hard-coded values in the application"],"a":[0],"e":"Parameter Store supports hierarchical names, GetParametersByPath, and SecureString encryption with KMS, with IAM policies scoped to paths."},{"id":"soa-dep15","d":"dep","q":"An auditor asks for an inventory of installed applications and their versions across all EC2 instances, updated regularly without logging in to the instances. Which feature provides this?","o":["Systems Manager Inventory, with results queryable in Resource Data Sync and Athena","Amazon Inspector","AWS Config aggregator","CloudWatch agent metrics"],"a":[0],"e":"SSM Inventory collects metadata such as installed applications, OS, and network configuration from managed instances on a schedule."},{"id":"soa-dep16","d":"dep","q":"A company wants to build hardened, patched AMIs automatically every month, test them, and distribute them to several accounts and Regions, replacing a manual process. Which service should be used?","o":["EC2 Image Builder pipelines","AWS CodeBuild","Elastic Beanstalk","AWS Backup"],"a":[0],"e":"Image Builder automates image creation with build and test components, scheduling, and distribution settings across accounts and Regions."},{"id":"soa-dep17","d":"dep","q":"An AMI encrypted with a customer managed KMS key must be shared with another AWS account so it can launch instances from it. Which steps are required? (Choose TWO.)","o":["Modify the AMI's launch permissions to include the target account","Update the KMS key policy to allow the target account to use the key (and create grants)","Make the AMI public","Copy the AMI to the target account's Region using the default AWS managed key","Disable encryption on the AMI"],"a":[0,1],"e":"Sharing an encrypted AMI needs both the AMI launch permission and permission on the KMS key for the recipient. AMIs encrypted with the AWS managed default key cannot be shared at all."},{"id":"soa-dep18","d":"dep","q":"A company still uses launch configurations for its Auto Scaling groups and wants to use multiple instance types, Spot and On-Demand mixes, and the newest EC2 features. What should the engineer do?","o":["Migrate the Auto Scaling groups to launch templates","Create more launch configurations","Switch to Elastic Beanstalk","Use a Dedicated Host"],"a":[0],"e":"Launch templates are versioned and support mixed instances policies and newer features; launch configurations are legacy and cannot be created in new accounts."},{"id":"soa-dep19","d":"dep","q":"A CloudFormation template must create a resource type that CloudFormation does not natively support, by calling a third-party API during stack creation and deletion. How can this be done within the stack?","o":["Implement a Lambda-backed custom resource that handles Create, Update, and Delete events","Create the resource manually after the stack finishes","Use a wait condition","Use a nested stack"],"a":[0],"e":"Custom resources let CloudFormation invoke a Lambda function (or SNS topic) with the lifecycle event and wait for a response, extending templates to any API."},{"id":"soa-dep20","d":"dep","q":"A company deploys an application to an Auto Scaling group with AWS CodeDeploy. It wants new versions deployed to a fresh set of instances and traffic shifted on the load balancer only after they are healthy, with easy rollback. Which CodeDeploy deployment type should be used?","o":["Blue/green deployment","In-place deployment with the AllAtOnce configuration","In-place deployment with the OneAtATime configuration","Rolling deployment with batch size 1"],"a":[0],"e":"CodeDeploy blue/green for EC2 provisions replacement instances, deploys to them, reroutes the load balancer, and keeps the original instances for a configurable period for rollback."},{"id":"soa-dep21","d":"dep","q":"Teams in an organization keep launching resources without the required cost-center tag. The company wants to detect untagged resources continuously and automatically notify the owner. Which solution should be used?","o":["An AWS Config required-tags managed rule with an EventBridge rule on non-compliance events targeting SNS","CloudTrail Insights","A Trusted Advisor check","A CloudWatch alarm on billing"],"a":[0],"e":"The required-tags Config rule evaluates resources for specific tag keys, and compliance-change events can trigger notifications or automatic remediation."},{"id":"soa-dep22","d":"dep","q":"A company must apply the same set of 40 AWS Config rules to every account in its organization and track compliance centrally. Which feature is designed for this?","o":["Organization conformance packs deployed from the management (or delegated administrator) account","Manually created rules in each account","CloudFormation templates emailed to each team","AWS Trusted Advisor"],"a":[0],"e":"Conformance packs bundle Config rules and remediation actions into a single deployable unit that can be applied across an organization, with aggregated compliance in the Config aggregator."},{"id":"soa-dep23","d":"dep","q":"A team runs a containerized application on Amazon ECS and wants every new container image automatically checked for known vulnerabilities when it is pushed, before deployment. Which feature should be enabled?","o":["Amazon ECR image scanning (basic or enhanced scanning with Inspector) with scan on push","ECS Exec","CloudWatch Container Insights","ECS Service Connect"],"a":[0],"e":"ECR scan-on-push analyzes images for CVEs when they are pushed to the repository, and enhanced scanning (Amazon Inspector) can continuously rescan images."},{"id":"soa-dep24","d":"dep","q":"A Lambda function behind an API must be updated with a new version, sending 10% of traffic to the new code first and the rest to the old code, then shifting fully if error rates stay low. Which Lambda feature enables this?","o":["Publish a version and use an alias with weighted routing between the two versions","Edit the $LATEST code in place","Duplicate the function with a new name","Increase reserved concurrency"],"a":[0],"e":"Lambda aliases can split traffic between two published versions by weight, which supports canary and linear deployments (and CodeDeploy can automate the shifting with alarms)."},{"id":"soa-dep25","d":"dep","q":"An EC2 instance's root EBS volume is almost full. The engineer increased the volume size in the console, but the operating system still reports the old size. What must be done next?","o":["Extend the partition and the file system inside the OS (for example growpart and resize2fs or xfs_growfs)","Stop and start the instance","Create a new volume and copy the data","Detach and reattach the volume"],"a":[0],"e":"EBS volume modifications grow the block device while in use, but the partition table and file system must be extended inside the guest OS before the space is visible."},{"id":"soa-dep26","d":"dep","q":"A company wants to bring existing manually created resources (an S3 bucket and a DynamoDB table) under CloudFormation management without recreating them. Which feature should be used?","o":["CloudFormation resource import","Drift detection","StackSets","A custom resource"],"a":[0],"e":"Resource import lets you add existing resources to a new or existing stack by providing a template that describes them and their identifiers."},{"id":"soa-dep27","d":"dep","q":"A development team wants to provision Amazon EC2 instances and RDS databases only from a set of pre-approved, version-controlled templates, with guardrails on size and tagging, while not having direct permissions to create those resources themselves. Which service should the CloudOps team use to offer this?","o":["AWS Service Catalog portfolios with products and launch constraints","AWS Marketplace","AWS Elastic Beanstalk","AWS CodeCommit"],"a":[0],"e":"Service Catalog lets administrators publish approved products with launch roles and constraints, so end users can deploy them without holding the underlying IAM permissions."},{"id":"soa-dep28","d":"dep","q":"A CloudFormation stack that manages a production VPC must never be deleted by accident, even by an administrator running a cleanup script. What should be enabled?","o":["Stack termination protection","A DeletionPolicy on each resource","A stack policy","Drift detection"],"a":[0],"e":"Termination protection makes DeleteStack fail until it is explicitly disabled. DeletionPolicy only controls what happens to individual resources when the stack is deleted."},{"id":"soa-sec01","d":"sec","q":"A security review found that an EC2 application could be tricked via server-side request forgery into reading temporary credentials from the instance metadata service. Which change mitigates this with no code changes to the IAM role setup?","o":["Require IMDSv2 (session-oriented, token-based) on the instances and launch templates and disable IMDSv1","Remove the instance role","Block port 80 on the security group","Enable detailed monitoring"],"a":[0],"e":"IMDSv2 requires a PUT request to obtain a session token with a hop limit, which blocks the simple GET-based SSRF path that leaks credentials from IMDSv1."},{"id":"soa-sec02","d":"sec","q":"EC2 instances in a private subnet access Amazon S3 through a gateway VPC endpoint. The security team wants those instances to be able to reach only one specific bucket through the endpoint. What should be configured?","o":["A VPC endpoint policy that allows access only to the specific bucket ARN","A security group on the endpoint","A network ACL deny for S3 IP ranges","S3 Transfer Acceleration"],"a":[0],"e":"Gateway endpoint policies restrict which S3 actions and resources can be reached through the endpoint, complementing bucket policies and IAM."},{"id":"soa-sec03","d":"sec","q":"A company must rotate the key material of its customer managed KMS keys every year with no application changes and no re-encryption of existing data. What should the engineer do?","o":["Enable automatic key rotation on the customer managed keys","Create a new key each year and re-encrypt all data","Delete and recreate the keys","Switch to AWS owned keys"],"a":[0],"e":"KMS automatic rotation generates new backing key material on a schedule while keeping the key ID and old material available to decrypt existing ciphertext."},{"id":"soa-sec04","d":"sec","q":"An application on EC2 reads a database password from AWS Secrets Manager. The password must be rotated every 30 days without downtime, and the application must always obtain the current value. Which approach should be used?","o":["Enable Secrets Manager automatic rotation with the RDS rotation Lambda function and have the application fetch the secret at runtime (with caching)","Store the password in the AMI","Rotate manually and redeploy the application","Store the password in a public S3 object"],"a":[0],"e":"Secrets Manager rotation updates the database credential and the secret together. Fetching at runtime (for example with the Secrets Manager caching client) ensures the app uses the latest value."},{"id":"soa-sec05","d":"sec","q":"An organization requires CloudTrail logs from all Regions in all accounts to be delivered to a central S3 bucket, with proof that the log files have not been altered. Which configuration meets this?","o":["An organization trail with multi-Region logging and log file validation enabled, delivering to a central bucket with a restrictive bucket policy","A single-Region trail in each account","CloudWatch Logs with 1-day retention","VPC Flow Logs to S3"],"a":[0],"e":"Organization trails cover every member account; multi-Region covers all Regions; log file validation creates signed digest files that detect tampering."},{"id":"soa-sec06","d":"sec","q":"When Amazon GuardDuty detects an EC2 instance communicating with a known command-and-control server, the security team wants the instance isolated automatically within minutes. Which solution should be implemented?","o":["An EventBridge rule on GuardDuty findings of that type that invokes a Lambda function (or SSM Automation) to replace the instance's security group with an isolation group","A daily report emailed to the team","A CloudWatch alarm on CPU","Manual review of GuardDuty findings weekly"],"a":[0],"e":"GuardDuty findings are published to EventBridge. Automated response via Lambda or Systems Manager Automation can quarantine the instance for forensics."},{"id":"soa-sec07","d":"sec","q":"A compliance team needs continuous vulnerability assessment of EC2 instances and container images, with findings prioritized by CVSS and exploitability, without manual scans. Which service should be enabled?","o":["Amazon Inspector","Amazon Macie","AWS Shield","AWS Artifact"],"a":[0],"e":"Inspector continuously scans EC2 (via the SSM Agent), ECR images, and Lambda functions for software vulnerabilities and unintended network exposure."},{"id":"soa-sec08","d":"sec","q":"A web server in a public subnet has a security group allowing inbound TCP 80 from 0.0.0.0/0, and the subnet's network ACL allows inbound TCP 80 and all outbound traffic. Clients on the internet still cannot connect. Which cause should the engineer check FIRST?","o":["The instance has no public or Elastic IP address, or the subnet's route table has no 0.0.0.0/0 route to an internet gateway","The security group needs an explicit outbound rule for port 80 because security groups are stateless","The network ACL needs an inbound allow for ephemeral ports","Port 80 is reserved by AWS"],"a":[0],"e":"Security groups are stateful, so the inbound allow covers responses, and the NACL already allows all outbound traffic. With the firewall layers correct, the usual culprits are a missing public IP or a missing route to the internet gateway."},{"id":"soa-sec09","d":"sec","q":"The security team wants to find out which IAM roles and S3 buckets are accessible from outside the organization's zone of trust, and to review findings as policies change. Which service should be used?","o":["IAM Access Analyzer","AWS Trusted Advisor","Amazon Inspector","AWS Config"],"a":[0],"e":"Access Analyzer analyzes resource policies to identify external access, generates findings continuously, and can also validate policies and generate least-privilege policies from CloudTrail."},{"id":"soa-sec10","d":"sec","q":"A company wants to prevent member accounts from disabling GuardDuty, deleting CloudTrail trails, or leaving the organization, regardless of the permissions their administrators have. Which mechanism enforces this?","o":["Service control policies (SCPs) attached to the organizational units","IAM policies in each account","AWS Config rules","Permissions boundaries"],"a":[0],"e":"SCPs set the maximum permissions for accounts in an organization and apply to all principals, including account administrators (but not the management account)."},{"id":"soa-sec11","d":"sec","q":"A website behind an Application Load Balancer must serve HTTPS with a certificate that renews automatically, and all HTTP requests must be redirected to HTTPS. Which configuration meets this? (Choose TWO.)","o":["Request a public certificate in AWS Certificate Manager and attach it to an HTTPS:443 listener","Add an HTTP:80 listener with a default action that redirects to HTTPS:443","Install a self-signed certificate on each EC2 instance","Create a Route 53 health check","Enable AWS Shield Advanced"],"a":[0,1],"e":"ACM certificates on an ALB listener renew automatically. A redirect action on the HTTP listener forces clients to HTTPS without touching the instances."},{"id":"soa-sec12","d":"sec","q":"A company must ensure that all new objects in a bucket are encrypted with a customer managed KMS key, while keeping the KMS request cost low for a bucket that receives millions of objects. What should the engineer configure?","o":["Default bucket encryption with SSE-KMS using the customer managed key and S3 Bucket Keys enabled","SSE-S3 default encryption","Client-side encryption only","Enable versioning"],"a":[0],"e":"Default encryption applies SSE-KMS to every new object automatically, and S3 Bucket Keys reduce KMS requests (and cost) by using a bucket-level data key."},{"id":"soa-sec13","d":"sec","q":"A company requires that every new EBS volume and snapshot created in a Region is encrypted, even if a user forgets to select encryption. Which setting enforces this?","o":["Enable EBS encryption by default for the Region in the EC2 account settings","Create an IAM policy that denies ec2:CreateVolume","Encrypt volumes manually after creation","Enable S3 default encryption"],"a":[0],"e":"EBS encryption by default is a per-Region account setting that encrypts all new volumes and snapshot copies with the chosen default KMS key."},{"id":"soa-sec14","d":"sec","q":"Auditors require a record of every interactive shell command administrators run on EC2 instances. The company also wants to remove SSH key management and open inbound ports. Which solution meets these requirements?","o":["Use Systems Manager Session Manager with session logging to CloudWatch Logs or S3 and remove inbound SSH rules","Use a bastion host with shared keys","Record terminal sessions locally on each instance","Use EC2 Instance Connect with port 22 open to the internet"],"a":[0],"e":"Session Manager provides IAM-controlled access over the SSM channel with full session transcripts, so inbound ports and SSH keys are no longer needed."},{"id":"soa-sec15","d":"sec","q":"Whenever an S3 bucket is made public in the account, the company wants it detected and automatically returned to private within minutes. Which solution should be implemented?","o":["An AWS Config rule (s3-bucket-public-read-prohibited) with an automatic remediation action using an SSM Automation document","A monthly Trusted Advisor review","A CloudWatch alarm on bucket size","An S3 lifecycle rule"],"a":[0],"e":"Config rules can trigger Systems Manager Automation runbooks as remediation, for example to re-apply Block Public Access when a bucket is found non-compliant."},{"id":"soa-sec16","d":"sec","q":"A security policy states that IAM user access keys older than 90 days must be identified and that all IAM users must use MFA for console access. Which combination helps enforce and verify this? (Choose TWO.)","o":["Generate the IAM credential report regularly (or use the access-keys-rotated Config rule) to find old keys","Attach an IAM policy that denies most actions unless aws:MultiFactorAuthPresent is true","Enable S3 Versioning","Enable GuardDuty","Use Reserved Instances"],"a":[0,1],"e":"The credential report and Config rules surface key age; an MFA-conditioned deny policy ensures users cannot do meaningful work without MFA."},{"id":"soa-sec17","d":"sec","q":"An application in a private subnet cannot reach an RDS database in another subnet. The engineer wants to confirm whether packets are being rejected at the network layer and by which rule set. Which data source shows rejected traffic?","o":["VPC Flow Logs filtered for REJECT records on the relevant ENIs","CloudTrail management events","RDS Enhanced Monitoring","S3 server access logs"],"a":[0],"e":"Flow logs record ACCEPT and REJECT decisions per flow with source, destination, and port, which pinpoints security group or NACL blocks."},{"id":"soa-sec18","d":"sec","q":"A public web application behind CloudFront and an ALB is being probed with common attack patterns such as SQL injection and known bad bots. The company wants protection with minimal rule-writing. What should be configured?","o":["AWS WAF web ACL with AWS Managed Rules (for example the Core rule set and Known Bad Inputs) associated with the CloudFront distribution","AWS Shield Standard only","Security group rules blocking port 80","CloudFront geo restriction"],"a":[0],"e":"WAF managed rule groups are maintained by AWS and provide broad coverage against OWASP-style attacks and bad bots without writing custom rules."},{"id":"soa-sec19","d":"sec","q":"A company's Route 53 hosted zones, CloudFront distributions, and Elastic IPs must be protected against large DDoS attacks, and the company wants to be reimbursed for scaling costs caused by attacks. Which service provides this?","o":["AWS Shield Advanced","AWS Shield Standard","AWS WAF","Amazon GuardDuty"],"a":[0],"e":"Shield Advanced covers those resource types with enhanced detection, access to the Shield Response Team, and DDoS cost protection."},{"id":"soa-sec20","d":"sec","q":"An operations team must demonstrate that no S3 bucket contains unencrypted customer PII and receive alerts when new sensitive data appears. Which service automates this discovery?","o":["Amazon Macie","Amazon GuardDuty","AWS Audit Manager","AWS CloudTrail"],"a":[0],"e":"Macie discovers and classifies sensitive data in S3 using machine learning and managed data identifiers, and publishes findings to Security Hub and EventBridge."},{"id":"soa-sec21","d":"sec","q":"An Amazon RDS for MySQL instance is reachable from the internet, which violates policy. The database is needed only by EC2 instances in the same VPC. Which changes should be made? (Choose TWO.)","o":["Disable public accessibility on the DB instance and place it in private subnets","Restrict the DB security group inbound rule to the application servers' security group","Enable Multi-AZ","Enable automated backups","Add a NAT gateway"],"a":[0,1],"e":"Publicly accessible RDS instances get public DNS resolution; turning that off and limiting the security group source to the app tier removes internet exposure."},{"id":"soa-net01","d":"net","q":"An engineer creates a /28 subnet expecting 16 usable IP addresses, but only 11 instances can be launched. Why?","o":["AWS reserves the first four and the last IP address in every subnet","The subnet is in a different Availability Zone from the instances","Elastic IPs consume subnet addresses","The VPC CIDR is too small"],"a":[0],"e":"In each subnet AWS reserves the network address, VPC router, DNS, a future-use address, and the broadcast address, so a /28 yields 11 usable IPs."},{"id":"soa-net02","d":"net","q":"An EC2 instance in a subnet has a public IP address but cannot be reached from the internet, and cannot reach the internet. The security group and NACL allow the traffic. What is MOST likely missing?","o":["A route for 0.0.0.0/0 to an internet gateway in the subnet's route table (or the internet gateway itself)","A NAT gateway","An Elastic Network Interface","A VPC endpoint"],"a":[0],"e":"A subnet is public only if its route table sends internet-bound traffic to an attached internet gateway. Without that route, a public IP alone does nothing."},{"id":"soa-net03","d":"net","q":"A company replaced its NAT gateway with a NAT instance to save cost, but private instances still cannot reach the internet through it, although routing and security groups are correct. What must be changed on the NAT instance?","o":["Disable the source/destination check on the NAT instance's network interface","Assign a larger instance type","Enable detailed monitoring","Move the NAT instance to a private subnet"],"a":[0],"e":"EC2 instances drop traffic not addressed to them unless source/destination checking is disabled, which is required for a NAT instance to forward packets."},{"id":"soa-net04","d":"net","q":"VPC A is peered with VPC B, and VPC B is peered with VPC C. Instances in VPC A cannot reach VPC C. Why?","o":["VPC peering is not transitive; A needs its own peering connection with C (or a Transit Gateway)","The peering connection needs a NAT gateway","VPC C must be in another Region","Security groups cannot span peering connections"],"a":[0],"e":"Peering connects exactly two VPCs. Traffic cannot route through an intermediate VPC; use direct peering for each pair or a Transit Gateway for hub-and-spoke."},{"id":"soa-net05","d":"net","q":"Two VPCs with CIDRs 10.0.0.0/16 and 10.0.0.0/16 need to communicate. The engineer tries to create a VPC peering connection and it fails. What is the reason?","o":["VPC peering does not support overlapping CIDR blocks","Peering requires both VPCs to be in the same account","Peering requires a Direct Connect connection","The VPCs are too large"],"a":[0],"e":"Overlapping or matching CIDR ranges cannot be peered because routes would be ambiguous. One VPC needs a different CIDR, or use PrivateLink for specific services."},{"id":"soa-net06","d":"net","q":"A company uses a Transit Gateway to connect production VPCs, development VPCs, and an on-premises network. Development VPCs must be able to reach on-premises but must never reach production VPCs. How should this be enforced?","o":["Use separate Transit Gateway route tables for production and development attachments so development has no route to production","Add deny rules to the Transit Gateway","Peer the development VPCs to each other","Delete the production attachments"],"a":[0],"e":"Transit Gateway route tables control which attachments can reach which routes. Segmenting with multiple route tables isolates environments while sharing the on-premises path."},{"id":"soa-net07","d":"net","q":"A company is setting up an AWS Site-to-Site VPN between its office and a VPC. Which components are required on the AWS side and for routing? (Choose TWO.)","o":["A customer gateway resource representing the on-premises device","A virtual private gateway (or Transit Gateway) attached to the VPC with routes propagated or added for the on-premises CIDR","An internet gateway on the private subnets","A NAT gateway in each AZ","A CloudFront distribution"],"a":[0,1],"e":"A Site-to-Site VPN connects a customer gateway to a virtual private gateway or Transit Gateway, and the VPC route tables must route the on-premises prefixes to it (statically or via BGP propagation)."},{"id":"soa-net08","d":"net","q":"A Site-to-Site VPN connection shows one tunnel UP and one tunnel DOWN. What does this normally mean and what should the engineer do?","o":["Each VPN connection has two tunnels for redundancy; configure the on-premises device to bring up both tunnels so a single tunnel failure does not cause an outage","The VPN is broken and must be recreated","Only one tunnel is ever used; nothing is needed","The virtual private gateway must be replaced"],"a":[0],"e":"AWS provides two tunnel endpoints per VPN connection. Running with one tunnel down works but removes redundancy; both should be configured, ideally with BGP."},{"id":"soa-net09","d":"net","q":"A company has AWS Direct Connect and needs private access to VPC resources, plus access to public AWS endpoints such as S3 over the same connection. Which virtual interfaces should be created? (Choose TWO.)","o":["A private virtual interface to the VPC (via a virtual private gateway or Direct Connect gateway)","A public virtual interface for public AWS service endpoints","An internet gateway VIF","A NAT VIF","A CloudFront VIF"],"a":[0,1],"e":"Private VIFs reac
