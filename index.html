<style>
/* Layout: an exam console. Hub of exam cards; inside an exam, a sticky status bar (counter, timer, submit), one question column, and a question-map rail that docks right on wide screens and folds under the question on phones. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf1; --fg:#172029; --muted:#5d6b7a; --line:#d3dae3;
  --accent:#b35f06; --accent-soft:#fdf0dc; --accent-ink:#ffffff; --ink-on:#ffffff;
  --good:#1b7f4c; --good-soft:#e0f3e8; --bad:#b5342b; --bad-soft:#fbe4e1; --warn:#9a6b00; --warn-soft:#fff3cc;
  --d1:#2a63b8; --d2:#b8347a; --d3:#6a45c4; --d4:#1f7f7a; --d5:#a85a1a; --d6:#5c7a1e;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141b; --surface:#161e27; --surface-2:#1f2935; --fg:#e4eaf1; --muted:#97a6b6; --line:#2a3644;
    --accent:#f0a33b; --accent-soft:#3a2a12; --accent-ink:#1a1206; --ink-on:#0e141b;
    --good:#45cf86; --good-soft:#143224; --bad:#ff7b6e; --bad-soft:#3b1f1c; --warn:#f3c452; --warn-soft:#3a2f10;
    --d1:#6ea0ec; --d2:#ea7ab8; --d3:#a98cf0; --d4:#5cc7c0; --d5:#f0a06a; --d6:#a9cc5a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#161e27; --surface-2:#1f2935; --fg:#e4eaf1; --muted:#97a6b6; --line:#2a3644;
  --accent:#f0a33b; --accent-soft:#3a2a12; --accent-ink:#1a1206; --ink-on:#0e141b;
  --good:#45cf86; --good-soft:#143224; --bad:#ff7b6e; --bad-soft:#3b1f1c; --warn:#f3c452; --warn-soft:#3a2f10;
  --d1:#6ea0ec; --d2:#ea7ab8; --d3:#a98cf0; --d4:#5cc7c0; --d5:#f0a06a; --d6:#a9cc5a;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(30px,5vw,44px);font-weight:700;letter-spacing:-.02em}
h2{font-size:22px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button{font:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:28px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.lede{font-size:17px;max-width:62ch;color:var(--muted)}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.crumb:hover{color:var(--fg)}

/* buttons */
.btn{font-weight:600;font-size:14px;padding:10px 16px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.opt:focus-visible,.cell:focus-visible,.chipbtn:focus-visible,summary:focus-visible,input:focus-visible,.crumb:focus-visible,.ecard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.on{border-color:var(--warn);background:var(--warn-soft);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.panel h2{margin-bottom:6px}

/* hub */
.vendor{margin-top:8px}
.vendor h2{margin-bottom:12px}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ecard{display:flex;flex-direction:column;gap:10px;text-align:left;padding:18px 18px 16px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface);color:inherit;cursor:pointer;min-width:0}
.ecard:hover{border-color:var(--muted)}
.ecard .code{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.ecard .ename{font-size:17px;font-weight:600;line-height:1.25;text-wrap:balance}
.ecard .fmt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ecard .wmini{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px}
.ecard .wmini i{display:block;height:100%}
.ecard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.ecard .foot b{color:var(--fg);font-family:var(--font-mono);font-weight:600}

/* exam start */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 24px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fact b{display:block;font-family:var(--font-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.fact span{font-size:13px;color:var(--muted)}
.wbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin-top:14px}
.wbar i{display:block;height:100%}
.wlegend{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px 20px;margin-top:14px;font-size:14px}
.wlegend ul{margin:0;padding:0;display:contents}
.wlegend li{display:flex;align-items:center;gap:10px;list-style:none;min-width:0}
.wlegend li span.t{flex:1;min-width:0}
.swatch{width:12px;height:12px;border-radius:3px;flex:none}
.wlegend .n{font-family:var(--font-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.mode{display:block;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--radius);cursor:pointer;background:var(--surface)}
.mode:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.mode .t{display:flex;align-items:center;gap:10px;font-weight:600}
.mode input{margin:0;accent-color:var(--accent)}
.mode p{font-size:14px;color:var(--muted);margin-top:6px;margin-left:26px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.check input{accent-color:var(--accent);margin:0}
.resume{border-color:var(--accent)}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:0 0 8px}
.hist td{padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.hist td.r,.hist th.r{text-align:right}
.pill{display:inline-block;font-family:var(--font-mono);font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.pill.pass{background:var(--good-soft);color:var(--good)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.loading{padding:40px 0;color:var(--muted);text-align:center}

/* exam top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px;flex-wrap:wrap}
.counter{font-family:var(--font-mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.counter small{color:var(--muted);font-weight:400}
.timer{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;padding:5px 10px;border-radius:6px;background:var(--surface-2)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.grow{flex:1}
.progress{height:3px;background:var(--surface-2)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}

/* exam body */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:24px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px)}
.rail details{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px 16px}
.rail summary{list-style:none;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.rail summary::-webkit-details-marker{display:none}
.rail summary .tog{display:none;font-size:13px;color:var(--muted);font-weight:400}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px;margin-top:12px}
.cell{aspect-ratio:1;font-family:var(--font-mono);font-size:12px;border:1.5px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;position:relative;padding:0;font-variant-numeric:tabular-nums}
.cell.ans{background:var(--surface-2);color:var(--fg);border-color:var(--surface-2)}
.cell.good{background:var(--good-soft);border-color:var(--good);color:var(--fg)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--fg)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--fg)}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--line);display:inline-block;position:relative}
.legend i.ans{background:var(--surface-2);border-color:var(--surface-2)}
.legend i.flag::after{content:"";position:absolute;top:1px;right:1px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.legend i.good{background:var(--good-soft);border-color:var(--good)}
.legend i.bad{background:var(--bad-soft);border-color:var(--bad)}
.railstats{display:flex;gap:14px;margin-top:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.railstats b{color:var(--fg);font-family:var(--font-mono);font-weight:600}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chip{font-family:var(--font-mono);font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.d{border-color:transparent;color:var(--ink-on);background:var(--dc);font-weight:500}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.stem{font-size:18px;line-height:1.5;margin:0 0 18px;font-weight:500;max-width:68ch}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left;color:inherit;width:100%;font-size:15.5px;line-height:1.45}
.opt:hover{border-color:var(--muted)}
.opt .k{font-family:var(--font-mono);font-size:13px;font-weight:600;width:26px;height:26px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;margin-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.good .k{background:var(--good);border-color:var(--good);color:var(--ink-on)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:var(--ink-on)}
.opt.lock{cursor:default}
.opt.lock:hover{border-color:var(--line)}
.opt.lock.good:hover{border-color:var(--good)}
.opt.lock.bad:hover{border-color:var(--bad)}
.opt .tag{margin-left:auto;font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;align-self:center}
.opt.good .tag{color:var(--good)}
.opt.bad .tag{color:var(--bad)}
.expl{margin-top:18px;padding:16px 18px;border-radius:8px;background:var(--surface-2);max-width:70ch}
.expl .eyebrow{margin-bottom:6px}
.expl.ok .eyebrow{color:var(--good)}
.expl.miss .eyebrow{color:var(--bad)}
.expl p{font-size:15px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.actions .grow{flex:1}
.hint{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
kbd{font-family:var(--font-mono);font-size:11px;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--surface)}

/* review before submit */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:16px 0}
.sum{padding:12px 14px;border-radius:8px;background:var(--surface-2)}
.sum b{display:block;font-family:var(--font-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.sum span{font-size:13px;color:var(--muted)}
.sum.warn b{color:var(--warn)}
.confirm{margin-top:16px;padding:14px 16px;border-radius:8px;background:var(--warn-soft);border:1px solid var(--warn);display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* results */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:620px){.score{grid-template-columns:minmax(0,1fr)}}
.ring{display:block;max-width:100%}
.verdict{font-family:var(--font-mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.verdict.pass{color:var(--good)}
.verdict.fail{color:var(--bad)}
.bigline{font-size:24px;font-weight:600;margin:4px 0 8px}
.kv{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.kv b{color:var(--fg);font-weight:600}
.dbars{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;margin-bottom:6px}
.dname{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.dnum{font-family:var(--font-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{position:relative;height:12px;border-radius:6px;background:var(--surface-2);overflow:visible}
.track i{display:block;height:100%;border-radius:6px}
.track b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.55}
.note{font-size:14px;color:var(--muted);max-width:70ch}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
.chipbtn{font-family:var(--font-mono);font-size:12px;padding:5px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chipbtn.on{border-color:var(--fg);color:var(--fg)}
.rv{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:8px}
.rv summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:12px 14px}
.rv summary::-webkit-details-marker{display:none}
.rv .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
.rv.ok .dot{background:var(--good)}
.rv.miss .dot{background:var(--bad)}
.rv .rn{font-family:var(--font-mono);font-size:12px;color:var(--muted);flex:none;width:34px}
.rv .rt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.rv[open] .rt{white-space:normal}
.rv .fl{color:var(--warn);font-size:12px;font-family:var(--font-mono);flex:none}
.rbody{padding:0 14px 16px}
.rbody .stem{font-size:16px}
.rbody .opts{gap:8px}
.rbody .opt{font-size:14.5px;padding:10px 12px}
@media (max-width:899px){
  .exam{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .rail summary .tog{display:inline}
  .hide-sm{display:none}
  .stem{font-size:17px}
}
@media (prefers-reduced-motion: reduce){ .progress i{transition:none} }
</style>

<script>window.__BANKS = {"clf":[{"id":"cc01","d":"cc","q":"A company is moving from its own data center to AWS. Instead of buying servers ahead of projected peak load, it will pay only for the capacity it actually uses. Which advantage of cloud computing does this describe?","o":["Trade fixed expense for variable expense","Increase speed and agility","Go global in minutes","Benefit from massive economies of scale"],"a":[0],"e":"Paying for what you consume instead of investing up front in hardware is the first of the six advantages of cloud computing: trade capital (fixed) expense for variable expense."},{"id":"cc02","d":"cc","q":"Which of the following is NOT one of the six pillars of the AWS Well-Architected Framework?","o":["Operational Excellence","Reliability","Scalability","Sustainability"],"a":[2],"e":"The six pillars are Operational Excellence, Security, Reliability, Performance Efficiency, Cost Optimization, and Sustainability. Scalability is a property that well-architected workloads have, not a pillar."},{"id":"cc03","d":"cc","q":"A company keeps its core database in an on-premises data center but runs its web tier on Amazon EC2, with a VPN connecting the two environments. Which cloud deployment model is this?","o":["Public cloud","Private cloud","Hybrid cloud","Multi-cloud"],"a":[2],"e":"A hybrid deployment connects infrastructure in the cloud with resources that stay on premises. Multi-cloud would mean using more than one public cloud provider."},{"id":"cc04","d":"cc","q":"A retail website automatically adds Amazon EC2 instances during a flash sale and removes them when traffic drops. Which cloud concept does this BEST illustrate?","o":["Fault tolerance","Elasticity","Durability","Agility"],"a":[1],"e":"Elasticity is acquiring resources as demand rises and releasing them when it falls, automatically. Scalability is the ability to grow; elasticity is the dynamic matching of resources to load."},{"id":"cc05","d":"cc","q":"Which statement about AWS Availability Zones is correct?","o":["An Availability Zone is a single data center in one Region","An Availability Zone is one or more discrete data centers with redundant power, networking, and connectivity inside a Region","Availability Zones are the same thing as edge locations","Each AWS Region contains exactly one Availability Zone"],"a":[1],"e":"An AZ is one or more physically separate data centers with independent power and networking. Every Region has multiple AZs connected by low-latency links, which is what lets you build highly available architectures."},{"id":"cc06","d":"cc","q":"Which AWS services use edge locations to serve users with low latency? (Choose TWO.)","o":["Amazon CloudFront","Amazon Route 53","Amazon EC2","Amazon RDS","AWS CloudFormation"],"a":[0,1],"e":"CloudFront caches content at edge locations and Route 53 answers DNS queries from them. EC2 and RDS run inside Availability Zones, and CloudFormation is a regional provisioning service."},{"id":"cc07","d":"cc","q":"Which perspective of the AWS Cloud Adoption Framework (AWS CAF) focuses on culture, leadership, and workforce transformation?","o":["Business","People","Governance","Platform"],"a":[1],"e":"The six CAF perspectives are Business, People, Governance, Platform, Security, and Operations. People covers organizational change, culture, and skills."},{"id":"cc08","d":"cc","q":"A company wants its application to stay available even if an entire data center fails. What should it do?","o":["Run the application in one Availability Zone on larger instances","Deploy the application across multiple Availability Zones in a Region","Turn on detailed monitoring in Amazon CloudWatch","Purchase Reserved Instances"],"a":[1],"e":"Spreading resources across multiple AZs is the standard way to survive the loss of a data center. Bigger instances, monitoring, and pricing options do nothing for availability."},{"id":"cc09","d":"cc","q":"A development team wants a failure in one component of its application to have minimal impact on the other components. Which design principle should it apply?","o":["Tight coupling","Loose coupling","Vertical scaling","Manual provisioning"],"a":[1],"e":"Loosely coupled components, for example connected through Amazon SQS or SNS, can fail and recover independently, so a fault in one does not cascade through the whole system."},{"id":"cc10","d":"cc","q":"Why can AWS offer lower pay-as-you-go prices than most companies could achieve on their own?","o":["AWS runs on older, cheaper hardware","AWS benefits from massive economies of scale","AWS requires customers to pay up front","AWS limits how many customers can use each Region"],"a":[1],"e":"Usage from hundreds of thousands of customers is aggregated in the cloud, so AWS achieves economies of scale that translate into lower pay-as-you-go prices."},{"id":"cc11","d":"cc","q":"Which pillar of the AWS Well-Architected Framework covers a workload's ability to recover from disruptions and dynamically acquire resources to meet demand?","o":["Performance Efficiency","Operational Excellence","Reliability","Cost Optimization"],"a":[2],"e":"Reliability is about performing the intended function correctly and consistently, including recovering from failures and scaling to meet demand. Performance Efficiency is about using resources efficiently."},{"id":"cc12","d":"cc","q":"A company wants to move an application to AWS with as few changes as possible, migrating its virtual machines as they are. Which migration strategy is this?","o":["Refactor","Replatform","Rehost","Retire"],"a":[2],"e":"Rehost, often called lift and shift, moves applications without modification. Replatform makes a few cloud optimizations along the way; refactor re-architects the application."},{"id":"cc13","d":"cc","q":"A company must keep some workloads on premises for data residency reasons but wants to use the same AWS APIs, tools, and services on that on-premises hardware. Which offering should it use?","o":["AWS Local Zones","AWS Wavelength","AWS Outposts","AWS Direct Connect"],"a":[2],"e":"Outposts delivers AWS infrastructure and services into the customer's own facility. Local Zones place AWS infrastructure in metro areas, and Wavelength embeds AWS compute in 5G networks."},{"id":"cc14","d":"cc","q":"Which of the following are characteristics of serverless computing on AWS? (Choose TWO.)","o":["No servers to provision or manage","Scales automatically with usage","The customer patches the underlying operating system","Capacity must be reserved in advance","Workloads run on a single dedicated host"],"a":[0,1],"e":"Serverless services such as AWS Lambda remove server management, scale automatically, and bill only for what is used. AWS handles the underlying OS and capacity."},{"id":"cc15","d":"cc","q":"Which advantage of cloud computing lets a company deploy an application to users on another continent within minutes?","o":["Go global in minutes","Benefit from massive economies of scale","Stop guessing capacity","Stop spending money running and maintaining data centers"],"a":[0],"e":"With Regions around the world, deploying an application closer to customers in a new geography takes minutes, which is the advantage AWS calls 'go global in minutes'."},{"id":"cc16","d":"cc","q":"Which AWS tool helps a company review a workload against AWS architectural best practices and identify high-risk issues?","o":["AWS Trusted Advisor","AWS Well-Architected Tool","AWS Config","AWS Health Dashboard"],"a":[1],"e":"The Well-Architected Tool walks you through a structured review of a workload against the six pillars. Trusted Advisor runs automated checks on your account but is not an architecture review."},{"id":"sec01","d":"sec","q":"Under the AWS shared responsibility model, which of the following is the responsibility of AWS?","o":["Patching the guest operating system on Amazon EC2 instances","Configuring security groups","Physical security of the data centers","Encrypting customer data at rest"],"a":[2],"e":"AWS is responsible for security OF the cloud: facilities, hardware, networking, and the virtualization layer. The customer is responsible for security IN the cloud: their data, configuration, and access."},{"id":"sec02","d":"sec","q":"A company runs a workload on Amazon EC2. Which tasks are the customer's responsibility under the shared responsibility model? (Choose TWO.)","o":["Applying security patches to the guest operating system","Replacing failed physical disks in the host server","Managing IAM users and their permissions","Maintaining the hypervisor","Securing the physical network cabling"],"a":[0,2],"e":"For EC2, the customer owns everything from the guest OS upward: patching, application security, data, and identity and access management. Hardware, hypervisor, and physical network belong to AWS."},{"id":"sec03","d":"sec","q":"Compared with running a database on Amazon EC2, which responsibility shifts from the customer to AWS when using Amazon RDS?","o":["Managing database user accounts and permissions","Patching the database engine and underlying operating system","Classifying and encrypting customer data","Configuring which networks can reach the database"],"a":[1],"e":"With a managed service, AWS takes on more of the operational work, including OS and engine patching and automated backups. The customer still controls data, access, and network rules."},{"id":"sec04","d":"sec","q":"Which practices are recommended for securing the AWS account root user? (Choose TWO.)","o":["Enable multi-factor authentication (MFA) on the root user","Share the root credentials with the operations team","Use the root user for day-to-day administration","Create IAM users or roles for everyday tasks instead of using the root user","Store root access keys in application code"],"a":[0,3],"e":"Lock the root user down with MFA, avoid creating root access keys, and use it only for the few tasks that require it. Daily work should go through IAM identities with least-privilege permissions."},{"id":"sec05","d":"sec","q":"An application on an Amazon EC2 instance needs to read objects from an Amazon S3 bucket. What is the MOST secure way to grant this access?","o":["Store an IAM user's access keys in the application's configuration file","Attach an IAM role with the required S3 permissions to the EC2 instance","Make the S3 bucket publicly readable","Use the account's root user credentials in the application"],"a":[1],"e":"An IAM role attached to the instance provides temporary credentials that AWS rotates automatically, so no long-term keys are stored on the instance."},{"id":"sec06","d":"sec","q":"A company has 50 developers who all need the same set of permissions. What is the recommended way to manage this in IAM?","o":["Attach the policy to each IAM user individually","Create an IAM group, attach the policy to the group, and add the users to it","Share a single IAM user among all developers","Give every developer the AdministratorAccess policy"],"a":[1],"e":"Groups let you manage permissions for many users in one place. Shared users destroy accountability, and administrator access violates least privilege."},{"id":"sec07","d":"sec","q":"A company uses AWS Organizations. The security team wants to prevent anyone in any member account from disabling AWS CloudTrail, even users with administrator permissions in that account. What should it use?","o":["IAM identity-based policies","Service control policies (SCPs)","Amazon S3 bucket policies","AWS Config rules"],"a":[1],"e":"SCPs are organization-level guardrails that cap what identities in member accounts can do, regardless of their IAM permissions. Config can detect the change but cannot prevent it."},{"id":"sec08","d":"sec","q":"A company needs to create and control the encryption keys that protect its data across multiple AWS services, with every use of a key logged. Which service should it use?","o":["AWS Certificate Manager","AWS Key Management Service (AWS KMS)","AWS Secrets Manager","Amazon Cognito"],"a":[1],"e":"KMS creates and manages encryption keys that integrate with most AWS services, and every key use is recorded in CloudTrail. Certificate Manager handles TLS certificates; Secrets Manager stores secrets such as passwords."},{"id":"sec09","d":"sec","q":"Which AWS service provides automatic protection against the most common DDoS attacks at no additional cost?","o":["AWS Shield Standard","AWS WAF","Amazon GuardDuty","Amazon Inspector"],"a":[0],"e":"Shield Standard is enabled for every AWS customer for free. Shield Advanced is a paid tier that adds enhanced detection, response support, and DDoS cost protection."},{"id":"sec10","d":"sec","q":"A web application behind an Application Load Balancer is receiving SQL injection and cross-site scripting attempts. Which service can filter these requests?","o":["AWS Shield Standard","AWS WAF","Amazon Macie","AWS Firewall Manager"],"a":[1],"e":"AWS WAF inspects web requests and blocks common exploits such as SQL injection and XSS. Firewall Manager centrally manages WAF rules across accounts but is not the filter itself."},{"id":"sec11","d":"sec","q":"An auditor asks a company for AWS's SOC 2 and PCI DSS compliance reports. Where can the company download them?","o":["AWS Trusted Advisor","AWS Artifact","AWS Config","AWS CloudTrail"],"a":[1],"e":"AWS Artifact is the self-service portal for AWS compliance reports and agreements. The other services do not provide third-party audit reports."},{"id":"sec12","d":"sec","q":"Which service continuously monitors an AWS account for malicious activity by analyzing CloudTrail events, VPC Flow Logs, and DNS logs with threat intelligence and machine learning?","o":["Amazon Inspector","Amazon GuardDuty","Amazon Macie","AWS Security Hub"],"a":[1],"e":"GuardDuty is the intelligent threat detection service. Inspector finds software vulnerabilities, Macie finds sensitive data in S3, and Security Hub aggregates findings from all of them."},{"id":"sec13","d":"sec","q":"A company wants to automatically scan its Amazon EC2 instances and container images for software vulnerabilities and unintended network exposure. Which service should it use?","o":["Amazon Inspector","Amazon GuardDuty","AWS Shield","AWS Artifact"],"a":[0],"e":"Inspector continuously scans EC2 instances, container images in Amazon ECR, and Lambda functions for known vulnerabilities and network reachability issues."},{"id":"sec14","d":"sec","q":"A company stores customer records in Amazon S3 and must find buckets that contain personally identifiable information (PII). Which service uses machine learning to do this?","o":["Amazon GuardDuty","Amazon Macie","Amazon Detective","AWS WAF"],"a":[1],"e":"Macie discovers and classifies sensitive data such as PII and financial information in S3, and reports buckets that are unencrypted or publicly accessible."},{"id":"sec15","d":"sec","q":"A security team needs to find out who made the API call that terminated an Amazon EC2 instance, when it happened, and from which IP address. Which service provides this?","o":["Amazon CloudWatch","AWS CloudTrail","AWS Config","VPC Flow Logs"],"a":[1],"e":"CloudTrail records account activity as API events, including the caller identity, time, and source IP. CloudWatch handles metrics and logs, Config tracks configuration changes, and Flow Logs capture network traffic metadata."},{"id":"sec16","d":"sec","q":"Which statements about security groups and network ACLs are correct? (Choose TWO.)","o":["Security groups are stateful","Network ACLs operate at the instance level","Network ACLs are stateless","Security groups support explicit deny rules","Security groups operate at the subnet level"],"a":[0,2],"e":"Security groups work at the instance level, are stateful, and only have allow rules. Network ACLs work at the subnet level, are stateless, and support both allow and deny rules."},{"id":"sec17","d":"sec","q":"A company wants to run penetration tests against its own Amazon EC2 instances and Amazon RDS databases. Which statement is true?","o":["Penetration testing is never permitted on AWS","The company must get written approval from AWS before every test","The company may test these services without prior approval, as long as it follows the AWS customer support policy for penetration testing","Only AWS staff may perform penetration tests"],"a":[2],"e":"AWS permits customers to run security assessments against a list of services, including EC2, RDS, CloudFront, Aurora, API Gateway, Lambda, Lightsail, and Elastic Beanstalk, without prior approval. DDoS simulations and some other activities are prohibited or require approval."},{"id":"sec18","d":"sec","q":"An application needs to store a database password and rotate it automatically on a schedule. Which service is designed for this?","o":["AWS KMS","AWS Secrets Manager","AWS Certificate Manager","AWS Artifact"],"a":[1],"e":"Secrets Manager stores secrets and can rotate them automatically, with built-in integration for Amazon RDS. Systems Manager Parameter Store can hold secrets too but has no built-in rotation."},{"id":"sec19","d":"sec","q":"A company must ensure that every Amazon EBS volume in its account is encrypted and wants to be notified whenever a non-compliant volume is created. Which service evaluates resource configurations against rules like this?","o":["AWS Config","AWS CloudTrail","Amazon Inspector","AWS Trusted Advisor"],"a":[0],"e":"AWS Config records resource configurations over time and evaluates them against Config rules, flagging non-compliant resources. CloudTrail records who did what; it does not evaluate compliance."},{"id":"tech01","d":"tech","q":"A company needs to store millions of images that a web application will serve over HTTP. Which service is the MOST appropriate?","o":["Amazon EBS","Amazon S3","Amazon EFS","Amazon RDS"],"a":[1],"e":"S3 is object storage built for virtually unlimited amounts of unstructured data served over HTTP. EBS is block storage for a single EC2 instance; EFS is a shared file system."},{"id":"tech02","d":"tech","q":"Which storage service provides a shared file system that many Linux Amazon EC2 instances can mount at the same time?","o":["Amazon EBS","Amazon S3","Amazon EFS","Amazon FSx for Windows File Server"],"a":[2],"e":"EFS is an elastic NFS file system that thousands of Linux instances can mount concurrently. FSx for Windows provides SMB file shares for Windows workloads."},{"id":"tech03","d":"tech","q":"Data must be retained for 7 years for compliance and is almost never accessed. Retrieval within 12 hours is acceptable. Which Amazon S3 storage class is the MOST cost-effective?","o":["S3 Standard","S3 Standard-IA","S3 Glacier Deep Archive","S3 Intelligent-Tiering"],"a":[2],"e":"Glacier Deep Archive is the lowest-cost storage class, with standard retrieval within 12 hours. Standard-IA gives millisecond access but costs far more for long-term archives."},{"id":"tech04","d":"tech","q":"A company needs a managed relational database for a transactional application and wants AWS to handle backups, patching, and failover. Which service should it use?","o":["Amazon DynamoDB","Amazon RDS","Amazon Redshift","Amazon ElastiCache"],"a":[1],"e":"RDS is the managed relational database service, supporting engines such as MySQL, PostgreSQL, Oracle, and SQL Server, with Multi-AZ failover and automated backups."},{"id":"tech05","d":"tech","q":"An application needs single-digit millisecond latency at any scale and stores data as key-value items with a flexible schema. Which service fits BEST?","o":["Amazon RDS for MySQL","Amazon DynamoDB","Amazon Redshift","Amazon Neptune"],"a":[1],"e":"DynamoDB is the serverless key-value and document database built for consistent single-digit millisecond performance at any scale. Neptune is a graph database; Redshift is a data warehouse."},{"id":"tech06","d":"tech","q":"A company wants to run complex analytical SQL queries across petabytes of structured data collected from many sources. Which service is a managed data warehouse?","o":["Amazon Redshift","Amazon RDS","Amazon DynamoDB","Amazon ElastiCache"],"a":[0],"e":"Redshift is the petabyte-scale data warehouse for analytics (OLAP). RDS is for transactional workloads (OLTP), and ElastiCache is an in-memory cache."},{"id":"tech07","d":"tech","q":"A company wants to run Docker containers without provisioning or managing any Amazon EC2 instances. Which option should it use?","o":["Amazon ECS with the EC2 launch type","AWS Fargate","Amazon EC2 Auto Scaling","AWS Elastic Beanstalk on EC2"],"a":[1],"e":"Fargate is the serverless compute engine for containers that works with both Amazon ECS and Amazon EKS, so there are no instances to manage."},{"id":"tech08","d":"tech","q":"Which service runs code in response to events, such as an object being uploaded to Amazon S3, without provisioning servers and charges only for the compute time consumed?","o":["Amazon EC2","AWS Lambda","AWS Batch","Amazon Lightsail"],"a":[1],"e":"Lambda runs functions in response to events and bills per request and per millisecond of execution. Functions can run for up to 15 minutes."},{"id":"tech09","d":"tech","q":"A company wants to register a domain name and route users to its application using DNS. Which service should it use?","o":["Amazon CloudFront","Amazon Route 53","AWS Global Accelerator","Amazon VPC"],"a":[1],"e":"Route 53 is the highly available DNS service that also offers domain registration and routing policies such as latency-based and failover routing."},{"id":"tech10","d":"tech","q":"Amazon EC2 instances in a private subnet must download software updates from the internet but must NOT be reachable from the internet. What should the company add?","o":["A route from the private subnet to an internet gateway","A NAT gateway in a public subnet, with a route to it from the private subnet","A VPC peering connection","An Elastic IP address on each instance"],"a":[1],"e":"A NAT gateway allows outbound-only internet access from private subnets. Routing to an internet gateway, or giving instances public IPs, would expose them inbound."},{"id":"tech11","d":"tech","q":"A company needs a dedicated, private network connection from its data center to AWS that does not travel over the public internet. Which service provides this?","o":["AWS Site-to-Site VPN","AWS Direct Connect","Amazon CloudFront","AWS Transit Gateway"],"a":[1],"e":"Direct Connect is a dedicated physical link into AWS. A Site-to-Site VPN is encrypted but still runs over the public internet."},{"id":"tech12","d":"tech","q":"A web application must handle variable traffic and stay available if an Amazon EC2 instance fails. Which services should be combined to achieve this? (Choose TWO.)","o":["Elastic Load Balancing","Amazon EC2 Auto Scaling","Amazon Route 53 Resolver","AWS Snowball","Amazon Athena"],"a":[0,1],"e":"Auto Scaling replaces unhealthy instances and adjusts capacity to demand; Elastic Load Balancing spreads traffic across the healthy instances in multiple AZs."},{"id":"tech13","d":"tech","q":"An order-processing application should place incoming orders in a queue so a backend worker can process them at its own pace, and no order may be lost if the worker is briefly unavailable. Which service should it use?","o":["Amazon SNS","Amazon SQS","Amazon Kinesis","AWS Step Functions"],"a":[1],"e":"SQS is a durable message queue that decouples producers from consumers; messages wait until a worker retrieves and deletes them. SNS pushes messages to subscribers and does not hold them for later."},{"id":"tech14","d":"tech","q":"Which service pushes a notification to many subscribers (email, SMS, AWS Lambda, Amazon SQS) when an event occurs, using a publish/subscribe model?","o":["Amazon SQS","Amazon SNS","Amazon SES","AWS Config"],"a":[1],"e":"SNS is the pub/sub messaging service: one published message fans out to all subscribed endpoints. SES is for sending email at scale, not general notifications."},{"id":"tech15","d":"tech","q":"A DevOps engineer wants to be alerted when the average CPU utilization of an Amazon EC2 instance exceeds 80% for 5 minutes. Which service provides this?","o":["AWS CloudTrail","Amazon CloudWatch","AWS Config","AWS X-Ray"],"a":[1],"e":"CloudWatch collects metrics and lets you create alarms that trigger actions or notifications when a threshold is breached. X-Ray traces requests through distributed applications."},{"id":"tech16","d":"tech","q":"A company wants to define its infrastructure (VPCs, EC2 instances, RDS databases) in template files that can be version-controlled and deployed repeatedly across accounts. Which service does this?","o":["AWS CloudFormation","AWS Elastic Beanstalk","AWS CodeDeploy","AWS Systems Manager"],"a":[0],"e":"CloudFormation is the infrastructure-as-code service: JSON or YAML templates describe resources, and stacks create, update, or delete them consistently."},{"id":"tech17","d":"tech","q":"A developer wants to deploy a Java web application and have AWS automatically handle capacity provisioning, load balancing, scaling, and health monitoring, while keeping access to the underlying resources. Which service should the developer use?","o":["AWS Lambda","AWS Elastic Beanstalk","Amazon Lightsail","AWS CloudFormation"],"a":[1],"e":"Elastic Beanstalk takes application code and provisions the environment around it, while leaving the EC2 instances and other resources visible and under the developer's control."},{"id":"tech18","d":"tech","q":"A company needs to move 80 TB of data from its data center to Amazon S3. Its internet connection is slow and the transfer must finish within two weeks. Which option is MOST appropriate?","o":["Upload directly over the internet with the AWS CLI","AWS Snowball Edge","AWS Storage Gateway","Amazon Kinesis Data Streams"],"a":[1],"e":"The Snow Family provides physical devices for offline bulk transfer. A Snowball Edge holds tens of terabytes and avoids weeks of saturating a slow link."},{"id":"tech19","d":"tech","q":"A company wants to migrate its on-premises Oracle database to Amazon Aurora PostgreSQL with minimal downtime. Which services should it use? (Choose TWO.)","o":["AWS Database Migration Service (AWS DMS)","AWS Schema Conversion Tool (AWS SCT)","AWS Snowmobile","Amazon Athena","AWS Glue"],"a":[0,1],"e":"SCT converts the Oracle schema and code to the PostgreSQL dialect; DMS then replicates the data, including ongoing changes, so the source keeps running during migration."},{"id":"tech20","d":"tech","q":"A data analyst wants to run SQL queries directly on log files stored in Amazon S3 without loading them into a database. Which service should be used?","o":["Amazon Redshift","Amazon Athena","Amazon RDS","Amazon EMR"],"a":[1],"e":"Athena is serverless interactive query over data in S3 using standard SQL, billed per query by data scanned. Nothing needs to be loaded or provisioned."},{"id":"tech21","d":"tech","q":"A company wants to automatically extract text and form data from scanned documents. Which AWS service should it use?","o":["Amazon Rekognition","Amazon Textract","Amazon Polly","Amazon Comprehend"],"a":[1],"e":"Textract extracts printed text, handwriting, and form fields from scanned documents. Rekognition analyzes images and video, Polly turns text into speech, and Comprehend finds meaning in text."},{"id":"tech22","d":"tech","q":"An administrator needs to patch hundreds of Amazon EC2 instances on a schedule and run commands across them without logging in to each one. Which service should be used?","o":["AWS Systems Manager","AWS CloudFormation","Amazon Inspector","AWS Config"],"a":[0],"e":"Systems Manager provides Patch Manager, Run Command, and Session Manager for operating fleets of instances at scale, both in AWS and on premises."},{"id":"bill01","d":"bill","q":"A company runs a batch data-processing job that can be interrupted and restarted without any problem. Which Amazon EC2 purchasing option offers the LOWEST cost for this workload?","o":["On-Demand Instances","Reserved Instances","Spot Instances","Dedicated Hosts"],"a":[2],"e":"Spot Instances use spare capacity at discounts of up to 90% but can be reclaimed with a two-minute warning, which is fine for fault-tolerant, flexible workloads."},{"id":"bill02","d":"bill","q":"A production workload will run continuously on Amazon EC2 for the next three years. Which options would reduce the cost compared with On-Demand pricing? (Choose TWO.)","o":["Reserved Instances","Savings Plans","Spot Instances","Dedicated Hosts","On-Demand Capacity Reservations"],"a":[0,1],"e":"Reserved Instances and Savings Plans trade a one- or three-year commitment for discounts of up to 72%. Spot cannot guarantee a steady-state workload, Dedicated Hosts cost more, and Capacity Reservations alone are billed at On-Demand rates."},{"id":"bill03","d":"bill","q":"A company has several AWS accounts and wants a single bill plus volume discounts calculated across all of them. What should it use?","o":["AWS Cost Explorer","Consolidated billing in AWS Organizations","AWS Budgets","Cost allocation tags"],"a":[1],"e":"Consolidated billing in Organizations combines usage from all member accounts into one bill for the management account, so tiered pricing and discounts apply to the combined usage."},{"id":"bill04","d":"bill","q":"A finance manager wants an email when the month's AWS spend is forecast to exceed USD 10,000. Which service should be used?","o":["AWS Cost Explorer","AWS Budgets","AWS Pricing Calculator","AWS Cost and Usage Report"],"a":[1],"e":"Budgets lets you set cost or usage thresholds and sends alerts on actual or forecasted spend. Cost Explorer visualizes past costs, the Pricing Calculator estimates planned ones, and the CUR is the raw detailed data."},{"id":"bill05","d":"bill","q":"Which AWS service gives real-time recommendations to reduce cost, such as pointing out idle load balancers and underutilized Amazon EC2 instances?","o":["AWS Trusted Advisor","AWS Pricing Calculator","AWS Artifact","AWS Config"],"a":[0],"e":"Trusted Advisor checks your account against best practices in cost optimization, performance, security, fault tolerance, service limits, and operational excellence. The full set of checks requires Business, Enterprise On-Ramp, or Enterprise Support."},{"id":"bill06","d":"bill","q":"A company requires a designated Technical Account Manager (TAM), concierge support, and a 15-minute response time for business-critical system-down cases. Which AWS Support plan provides this?","o":["Developer","Business","Enterprise On-Ramp","Enterprise"],"a":[3],"e":"Enterprise Support includes a designated TAM and 15-minute response for business-critical outages. Enterprise On-Ramp offers a shared pool of TAMs and 30-minute response; Business has a 1-hour response for production outages and no TAM."},{"id":"bill07","d":"bill","q":"Which of the following data transfers is free of charge on AWS?","o":["Data transferred out from Amazon EC2 to the internet","Data transferred in from the internet to Amazon EC2","Data transferred between Availability Zones in the same Region","Data transferred between AWS Regions"],"a":[1],"e":"Inbound data transfer from the internet is free. Outbound to the internet, traffic between AZs, and traffic between Regions are all charged."},{"id":"bill08","d":"bill","q":"A company wants to see its AWS costs broken down by department and project. What should it do FIRST?","o":["Create a separate AWS account for every department","Apply cost allocation tags to resources and activate them in the Billing console","Enable AWS Shield Advanced","Buy Reserved Instances for each department"],"a":[1],"e":"Cost allocation tags, once activated in the Billing console, let Cost Explorer and the Cost and Usage Report group spend by tag values such as department or project."},{"id":"cc17","d":"cc","q":"A company is choosing an AWS Region for a new application. Which factors should influence the decision? (Choose TWO.)","o":["Data sovereignty and compliance requirements for where data is stored","Proximity to end users to reduce latency","The number of IAM users the company has","Whether the company uses Terraform or CloudFormation","The time zone of the company's headquarters"],"a":[0,1],"e":"Region choice is driven by compliance and data residency, latency to users, service availability in the Region, and pricing. Tooling choice and IAM user counts have no bearing on it."},{"id":"cc18","d":"cc","q":"A company uses Amazon RDS so that AWS manages the database engine, operating system, and underlying hardware while the company manages its data and schema. Which cloud service model does this BEST represent?","o":["Infrastructure as a Service (IaaS)","Platform as a Service (PaaS)","Software as a Service (SaaS)","Function as a Service (FaaS)"],"a":[1],"e":"With PaaS the provider manages the hardware, OS, and runtime platform and the customer focuses on applications and data. EC2 is IaaS; an application you only log in to, such as a hosted email product, is SaaS."},{"id":"cc19","d":"cc","q":"Which pillar of the AWS Well-Architected Framework focuses on minimizing the environmental impact of running cloud workloads?","o":["Cost Optimization","Performance Efficiency","Sustainability","Operational Excellence"],"a":[2],"e":"Sustainability was added as the sixth pillar in 2021. It covers understanding impact, maximizing utilization, and adopting more efficient hardware and managed services."},{"id":"cc20","d":"cc","q":"A team wants to run its operations as code, make frequent small reversible changes, and learn from operational failures. Which Well-Architected pillar describes these design principles?","o":["Operational Excellence","Reliability","Security","Performance Efficiency"],"a":[0],"e":"Those are three of the Operational Excellence design principles: perform operations as code, make frequent small reversible changes, refine procedures often, anticipate failure, and learn from all operational failures."},{"id":"cc21","d":"cc","q":"An application handles a steady load for most of the year but cannot predict demand during product launches. Which advantage of cloud computing addresses this problem MOST directly?","o":["Stop guessing capacity","Benefit from massive economies of scale","Go global in minutes","Stop spending money running data centers"],"a":[0],"e":"Stop guessing capacity: in the cloud you scale up and down as needed within minutes instead of buying for a peak you have to forecast."},{"id":"cc22","d":"cc","q":"Which statements correctly describe horizontal and vertical scaling? (Choose TWO.)","o":["Vertical scaling means changing to a larger or smaller instance size","Horizontal scaling means adding or removing instances","Horizontal scaling always requires downtime","Vertical scaling is unlimited on AWS","Horizontal scaling is only possible with Reserved Instances"],"a":[0,1],"e":"Scaling up (vertical) resizes a single instance and usually needs a restart; scaling out (horizontal) adds instances behind a load balancer and is what Auto Scaling does."},{"id":"cc23","d":"cc","q":"A company wants to move from a monolithic application to many small, independently deployable services that communicate over well-defined APIs. What is this architectural approach called?","o":["Monolithic architecture","Microservices architecture","Client-server architecture","Mainframe architecture"],"a":[1],"e":"Microservices break an application into small autonomous services that can be built, deployed, and scaled independently, often with containers or Lambda."},{"id":"cc24","d":"cc","q":"Which perspective of the AWS Cloud Adoption Framework (AWS CAF) covers building the cloud platform itself, including infrastructure, application patterns, and data engineering?","o":["Business","Governance","Platform","Operations"],"a":[2],"e":"The Platform perspective focuses on building an enterprise-grade, scalable hybrid cloud platform. Governance covers program management and cloud financial management; Operations covers running the workloads."},{"id":"cc25","d":"cc","q":"During a migration review a company decides to replace its self-hosted CRM with a subscription-based SaaS product instead of moving it to EC2. Which migration strategy is this?","o":["Rehost","Replatform","Repurchase","Retain"],"a":[2],"e":"Repurchase (drop and shop) means moving to a different product, typically SaaS. Retain keeps the application where it is; retire decommissions it."},{"id":"cc26","d":"cc","q":"A company wants to run latency-sensitive applications for users in a large city that does not have an AWS Region, while still using AWS services and APIs. Which option extends AWS infrastructure into that metropolitan area?","o":["AWS Local Zones","AWS Outposts","Amazon CloudFront","AWS Direct Connect"],"a":[0],"e":"Local Zones place compute, storage, and database services close to large population centers. Outposts goes into the customer's own facility; CloudFront caches content but does not run general workloads."},{"id":"cc27","d":"cc","q":"Which deployment option embeds AWS compute and storage inside telecommunications providers' 5G networks for ultra-low-latency mobile applications?","o":["AWS Local Zones","AWS Wavelength","AWS Outposts","AWS Snowcone"],"a":[1],"e":"Wavelength Zones sit at the edge of 5G networks so that application traffic never leaves the carrier network. Local Zones are metro-area extensions; Outposts are on-premises racks."},{"id":"cc28","d":"cc","q":"A finance team wants to compare the cost of running a workload on premises with running it on AWS, including hardware, power, cooling, and staff. What is this kind of comparison called?","o":["Return on investment (ROI)","Total cost of ownership (TCO)","Capital expenditure (CapEx)","Operating expense (OpEx)"],"a":[1],"e":"TCO includes all direct and indirect costs of owning and running infrastructure over its life, which is what makes an honest on-premises versus cloud comparison possible."},{"id":"cc29","d":"cc","q":"What is the difference between high availability and fault tolerance?","o":["They are the same concept with different names","High availability minimizes downtime; fault tolerance means the system keeps operating with no interruption even when components fail","Fault tolerance applies only to storage; high availability applies only to compute","High availability requires a single Availability Zone"],"a":[1],"e":"A highly available system recovers quickly (brief disruption acceptable). A fault-tolerant system has enough redundancy that a component failure causes no interruption at all, which costs more."},{"id":"cc30","d":"cc","q":"A company wants the ability to experiment with a new service for a few hours and then shut it down without any long-term commitment. Which cloud characteristic makes this practical?","o":["Pay-as-you-go pricing","Reserved capacity","Dedicated hardware","Long-term contracts"],"a":[0],"e":"Pay-as-you-go lets you provision resources, use them, and release them while paying only for consumption, which lowers the cost of experimentation and increases agility."},{"id":"cc31","d":"cc","q":"A company wants to discover its on-premises servers, collect their utilization data, and plan a migration to AWS. Which service helps with this discovery phase?","o":["AWS Application Discovery Service","AWS Database Migration Service","AWS Snowball","AWS Application Migration Service"],"a":[0],"e":"Application Discovery Service gathers server configuration, usage, and dependency data and feeds it to Migration Hub. Application Migration Service performs the actual lift-and-shift of servers."},{"id":"sec20","d":"sec","q":"Which IAM policy type is attached directly to a resource such as an Amazon S3 bucket and specifies who can access that resource?","o":["Identity-based policy","Resource-based policy","Service control policy","Permissions boundary"],"a":[1],"e":"Resource-based policies (for example S3 bucket policies) are attached to the resource and name the principals allowed to use it. Identity-based policies are attached to users, groups, or roles."},{"id":"sec21","d":"sec","q":"A company wants employees to sign in once with their corporate identity provider and then access multiple AWS accounts and business applications. Which service provides this?","o":["Amazon Cognito","AWS IAM Identity Center","AWS Directory Service","AWS Secrets Manager"],"a":[1],"e":"IAM Identity Center (formerly AWS SSO) provides single sign-on to multiple AWS accounts and cloud applications and integrates with external identity providers. Cognito is for customer-facing application sign-in."},{"id":"sec22","d":"sec","q":"A mobile application needs user sign-up, sign-in, and social login with Google and Facebook. Which AWS service should the developers use?","o":["AWS IAM","Amazon Cognito","AWS IAM Identity Center","AWS Organizations"],"a":[1],"e":"Cognito user pools provide sign-up and sign-in for application users, including social and enterprise identity federation. IAM is for managing access to AWS resources, not for end users of your app."},{"id":"sec23","d":"sec","q":"Which principle states that identities should be granted only the permissions required to perform their tasks and nothing more?","o":["Defense in depth","Separation of duties","Least privilege","Shared responsibility"],"a":[2],"e":"Least privilege is a core IAM best practice: start with minimal permissions and add more only when needed. IAM Access Analyzer can help identify unused permissions."},{"id":"sec24","d":"sec","q":"A company needs a free public SSL/TLS certificate for its website, which is served through an Application Load Balancer and Amazon CloudFront, with automatic renewal. Which service should it use?","o":["AWS Key Management Service","AWS Certificate Manager","AWS CloudHSM","AWS Secrets Manager"],"a":[1],"e":"ACM provisions, manages, and renews public certificates at no cost for use with integrated services such as ELB, CloudFront, and API Gateway."},{"id":"sec25","d":"sec","q":"A regulated company must use dedicated, single-tenant hardware security modules that it controls exclusively for its cryptographic keys. Which service meets this requirement?","o":["AWS KMS","AWS CloudHSM","AWS Certificate Manager","Amazon Macie"],"a":[1],"e":"CloudHSM provides dedicated FIPS 140-2 Level 3 validated hardware security modules that only the customer controls. KMS uses shared, AWS-managed HSMs behind the scenes."},{"id":"sec26","d":"sec","q":"A security team wants a single dashboard that aggregates findings from Amazon GuardDuty, Amazon Inspector, Amazon Macie, and third-party tools, and checks the account against security standards such as CIS benchmarks. Which service provides this?","o":["AWS Security Hub","AWS Config","AWS CloudTrail","Amazon Detective"],"a":[0],"e":"Security Hub centralizes findings across accounts and services and runs automated checks against standards. Detective helps investigate findings; it does not aggregate them."},{"id":"sec27","d":"sec","q":"After GuardDuty reports a suspicious finding, an analyst wants to visualize the related CloudTrail events, VPC Flow Logs, and resource relationships over time to understand the root cause. Which service is built for this investigation?","o":["Amazon Detective","AWS Security Hub","AWS Artifact","Amazon Inspector"],"a":[0],"e":"Detective automatically collects and links log data into a graph model so analysts can investigate the scope and root cause of security findings."},{"id":"sec28","d":"sec","q":"A company with dozens of AWS accounts wants to centrally configure and enforce AWS WAF rules, Shield Advanced protections, and security group policies across all of them. Which service should it use?","o":["AWS Firewall Manager","AWS Network Firewall","AWS Config","AWS Control Tower"],"a":[0],"e":"Firewall Manager is the central management service for WAF, Shield Advanced, security groups, and Network Firewall policies across an AWS Organization."},{"id":"sec29","d":"sec","q":"A company wants a managed, stateful network firewall that inspects traffic entering and leaving its VPCs, with intrusion prevention and domain filtering. Which service should it deploy?","o":["AWS WAF","AWS Network Firewall","AWS Shield Standard","Security groups"],"a":[1],"e":"Network Firewall is a managed VPC-level firewall with stateful rules, IPS, and domain filtering. WAF protects web applications at layer 7; security groups are basic instance-level allow lists."},{"id":"sec30","d":"sec","q":"A company wants to make sure that no Amazon S3 bucket in its account can be made publicly accessible, even if a developer misconfigures a bucket policy. What should the company enable?","o":["S3 Versioning","S3 Block Public Access at the account level","S3 Transfer Acceleration","S3 Object Lock"],"a":[1],"e":"Block Public Access settings override bucket policies and ACLs that would grant public access. Applied at the account level, they protect every bucket in the account."},{"id":"sec31","d":"sec","q":"A company has an application running on AWS Lambda. Under the shared responsibility model, which of the following is the customer's responsibility?","o":["Patching the operating system that runs the Lambda functions","Managing the function code and the IAM permissions it uses","Maintaining the physical servers","Updating the Lambda runtime environment infrastructure"],"a":[1],"e":"For serverless services AWS manages the infrastructure, OS, and runtime platform. The customer is still responsible for their code, its dependencies, data, and the IAM role the function assumes."},{"id":"sec32","d":"sec","q":"A security team wants to capture metadata about the IP traffic going to and from network interfaces in a VPC, to troubleshoot connectivity and detect unusual traffic. What should it enable?","o":["AWS CloudTrail","VPC Flow Logs","Amazon CloudWatch Logs Insights","AWS Config"],"a":[1],"e":"VPC Flow Logs record accepted and rejected traffic metadata (source, destination, ports, protocol) and can be delivered to CloudWatch Logs or S3."},{"id":"sec33","d":"sec","q":"A company wants to find out which S3 buckets, IAM roles, and KMS keys are shared with external accounts or the public, based on analysis of their policies. Which capability should it use?","o":["IAM Access Analyzer","IAM credential report","AWS Trusted Advisor","Amazon Macie"],"a":[0],"e":"IAM Access Analyzer uses automated reasoning to identify resources shared with an external entity. The credential report lists users and credential status, not resource sharing."},{"id":"sec34","d":"sec","q":"An administrator needs a report listing every IAM user in the account and the status of their passwords, access keys, and MFA devices. What should the administrator generate?","o":["An IAM credential report","A CloudTrail event history export","An AWS Config snapshot","A Cost and Usage Report"],"a":[0],"e":"The IAM credential report is a downloadable CSV listing all users and the age and status of their credentials, useful for audits and key-rotation reviews."},{"id":"sec35","d":"sec","q":"A company must continuously collect evidence and map its AWS usage to a compliance framework such as PCI DSS or HIPAA to simplify audits. Which service automates this?","o":["AWS Artifact","AWS Audit Manager","AWS Config","Amazon Inspector"],"a":[1],"e":"Audit Manager continuously collects evidence from AWS usage and maps it to prebuilt frameworks to produce audit-ready reports. Artifact provides AWS's own compliance reports."},{"id":"sec36","d":"sec","q":"Which actions can only be performed by the AWS account root user? (Choose TWO.)","o":["Changing the AWS Support plan","Closing the AWS account","Creating an IAM user","Launching an Amazon EC2 instance","Creating an S3 bucket"],"a":[0,1],"e":"Only the root user can close the account, change the support plan, change account settings such as the email address, and a few other account-level tasks. Everything else should be done with IAM identities."},{"id":"sec37","d":"sec","q":"Which AWS service or feature helps protect data in transit between a user's browser and an application on AWS?","o":["Amazon EBS encryption","HTTPS with TLS certificates from AWS Certificate Manager","Amazon S3 server-side encryption","AWS KMS envelope encryption"],"a":[1],"e":"Encryption in transit is provided by TLS (HTTPS). EBS, S3 server-side encryption, and KMS envelope encryption protect data at rest."},{"id":"sec38","d":"sec","q":"An application running on EC2 needs temporary, limited-privilege credentials to call AWS APIs on behalf of a user authenticated by an external identity provider. Which service issues these temporary credentials?","o":["AWS Security Token Service (AWS STS)","AWS Secrets Manager","AWS Certificate Manager","Amazon Macie"],"a":[0],"e":"STS issues short-lived credentials for federated users and for assumed roles. Roles for EC2, cross-account access, and identity federation all rely on STS under the hood."},{"id":"sec39","d":"sec","q":"Which AWS service helps a company set up a secure, multi-account AWS environment with preconfigured guardrails based on best practices?","o":["AWS Control Tower","AWS Config","AWS Service Catalog","AWS Trusted Advisor"],"a":[0],"e":"Control Tower automates landing-zone setup on top of AWS Organizations, with preventive and detective guardrails. Config and Trusted Advisor evaluate existing resources but do not build the environment."},{"id":"tech23","d":"tech","q":"A scientific application needs an EC2 instance family optimized for compute-intensive workloads such as batch processing and high-performance computing. Which instance family should the team choose?","o":["General purpose (M, T)","Compute optimized (C)","Memory optimized (R, X)","Storage optimized (I, D)"],"a":[1],"e":"C-family instances have a high ratio of vCPU to memory for compute-bound workloads. R and X families suit in-memory databases; I and D families suit high sequential or random local disk I/O."},{"id":"tech24","d":"tech","q":"A company needs a MySQL-compatible relational database with higher throughput than standard MySQL on RDS, storage that grows automatically, and replication across three Availability Zones. Which service fits BEST?","o":["Amazon Aurora","Amazon DynamoDB","Amazon Redshift","Amazon Neptune"],"a":[0],"e":"Aurora is AWS's cloud-native relational engine compatible with MySQL and PostgreSQL, with up to five times MySQL throughput and six-way storage replication across three AZs."},{"id":"tech25","d":"tech","q":"A web application makes repeated reads of the same product catalog data from its database, and latency is increasing. Which service adds an in-memory caching layer to reduce database load?","o":["Amazon ElastiCache","Amazon Redshift","Amazon EFS","AWS Storage Gateway"],"a":[0],"e":"ElastiCache (Redis or Memcached) stores frequently read data in memory for sub-millisecond reads, offloading the database."},{"id":"tech26","d":"tech","q":"A company wants to model relationships between users, products, and purchases as a highly connected graph for recommendations. Which purpose-built database should it use?","o":["Amazon Neptune","Amazon DocumentDB","Amazon Timestream","Amazon QLDB"],"a":[0],"e":"Neptune is the managed graph database for highly connected datasets. DocumentDB is a document (MongoDB-compatible) store, Timestream is for time series, and QLDB is an immutable ledger."},{"id":"tech27","d":"tech","q":"A business analyst wants to build interactive dashboards and visualizations from data in Amazon Redshift and Amazon S3, shared with the leadership team. Which service should be used?","o":["Amazon QuickSight","Amazon Athena","AWS Glue","Amazon Kinesis"],"a":[0],"e":"QuickSight is the serverless business intelligence service for dashboards and visual analysis. Athena queries data, Glue prepares and catalogs it, and Kinesis ingests streams."},{"id":"tech28","d":"tech","q":"A data engineering team needs a serverless service to discover, catalog, clean, and transform data from S3 before loading it into a data warehouse. Which service is designed for this ETL work?","o":["AWS Glue","Amazon EMR","Amazon QuickSight","AWS Batch"],"a":[0],"e":"Glue is the serverless data integration (ETL) service with a Data Catalog and crawlers. EMR runs managed big-data frameworks such as Spark on clusters you size."},{"id":"tech29","d":"tech","q":"A company needs to ingest and process a continuous stream of clickstream events from its website in real time. Which service is built for this?","o":["Amazon Kinesis","Amazon SQS","AWS Glue","Amazon Athena"],"a":[0],"e":"Kinesis Data Streams captures and processes streaming data in real time at scale. SQS is a queue for discrete messages, not continuous high-volume streams with multiple consumers."},{"id":"tech30","d":"tech","q":"A developer wants to orchestrate a multi-step workflow of Lambda functions with branching, retries, and error handling, defined visually. Which service should be used?","o":["AWS Step Functions","Amazon SQS","Amazon EventBridge","AWS Batch"],"a":[0],"e":"Step Functions coordinates distributed application components into visual workflows with state, branching, and retries. EventBridge routes events; SQS queues messages."},{"id":"tech31","d":"tech","q":"A company wants a serverless event bus that routes events from AWS services, its own applications, and SaaS partners to targets based on rules. Which service provides this?","o":["Amazon EventBridge","Amazon SNS","AWS Step Functions","Amazon Kinesis Data Firehose"],"a":[0],"e":"EventBridge is the serverless event bus with content-based routing rules and SaaS integrations. SNS is pub/sub fan-out without rule-based filtering of event content at the same depth."},{"id":"tech32","d":"tech","q":"A development team wants to publish a REST API that fronts AWS Lambda functions, with throttling, API keys, and caching, without running any servers. Which service should it use?","o":["Amazon API Gateway","Elastic Load Balancing","Amazon CloudFront","AWS AppSync"],"a":[0],"e":"API Gateway creates, publishes, and secures REST, HTTP, and WebSocket APIs at any scale. AppSync is for GraphQL APIs."},{"id":"tech33","d":"tech","q":"A team wants a fully managed continuous delivery pipeline that automatically builds, tests, and deploys code every time a commit is pushed. Which service orchestrates the pipeline stages?","o":["AWS CodePipeline","AWS CodeBuild","AWS CodeDeploy","AWS CodeArtifact"],"a":[0],"e":"CodePipeline models and automates the release workflow. CodeBuild compiles and tests, CodeDeploy deploys to targets, and CodeArtifact stores packages."},{"id":"tech34","d":"tech","q":"A developer prefers to define AWS infrastructure in TypeScript or Python instead of writing YAML templates by hand. Which AWS tool lets them do this while still deploying through CloudFormation?","o":["AWS Cloud Development Kit (AWS CDK)","AWS Elastic Beanstalk","AWS OpsWorks","AWS Systems Manager"],"a":[0],"e":"The CDK lets you define infrastructure in familiar programming languages and synthesizes CloudFormation templates for deployment."},{"id":"tech35","d":"tech","q":"A small business wants a simple virtual private server with a bundled OS, database, and predictable low monthly price, without learning VPC and EC2 details. Which service fits?","o":["Amazon Lightsail","AWS Elastic Beanstalk","Amazon EC2 Dedicated Hosts","AWS Fargate"],"a":[0],"e":"Lightsail offers preconfigured virtual servers, databases, and storage at fixed monthly prices for simple workloads. Beanstalk is for deploying application code with more AWS exposure."},{"id":"tech36","d":"tech","q":"A company wants to run Kubernetes on AWS without managing the Kubernetes control plane. Which service should it use?","o":["Amazon EKS","Amazon ECS","Amazon ECR","AWS Batch"],"a":[0],"e":"EKS is the managed Kubernetes service: AWS runs the control plane; you run workloads on EC2 nodes or Fargate. ECS is AWS's own orchestrator; ECR is the container image registry."},{"id":"tech37","d":"tech","q":"Which service stores, manages, and scans Docker container images for use by Amazon ECS and Amazon EKS?","o":["Amazon ECR","AWS CodeArtifact","Amazon S3","AWS Fargate"],"a":[0],"e":"Elastic Container Registry (ECR) is the managed container image registry with image scanning. CodeArtifact stores software packages such as npm and Maven artifacts."},{"id":"tech38","d":"tech","q":"An administrator wants to keep a point-in-time copy of an Amazon EBS volume that can be used to create new volumes in another Availability Zone. What should the administrator create?","o":["An EBS snapshot","An Amazon Machine Image (AMI)","An S3 lifecycle rule","An EFS mount target"],"a":[0],"e":"EBS snapshots are incremental backups stored in S3 that can be used to create volumes in any AZ of the Region, or copied to other Regions."},{"id":"tech39","d":"tech","q":"A company wants to protect objects in Amazon S3 from accidental deletion or overwrite by keeping every version of each object. Which feature should it enable?","o":["S3 Versioning","S3 Transfer Acceleration","S3 Intelligent-Tiering","S3 Select"],"a":[0],"e":"Versioning preserves every version of an object, so an overwrite or delete can be reversed. Combined with MFA Delete it also guards against malicious deletion."},{"id":"tech40","d":"tech","q":"A company wants objects uploaded to S3 to move automatically to a cheaper storage class after 30 days and be deleted after 365 days. Which feature should it configure?","o":["S3 Lifecycle rules","S3 Versioning","S3 Replication","S3 Object Lock"],"a":[0],"e":"Lifecycle rules automate transitions between storage classes and expiration of objects based on age."},{"id":"tech41","d":"tech","q":"A company has many VPCs across several accounts and wants to connect all of them, plus its on-premises network, through a single central hub instead of many peering connections. Which service should it use?","o":["AWS Transit Gateway","VPC peering","AWS PrivateLink","Internet gateway"],"a":[0],"e":"Transit Gateway acts as a regional hub that connects VPCs and on-premises networks in a hub-and-spoke model. VPC peering is one-to-one and does not scale to many VPCs."},{"id":"tech42","d":"tech","q":"A company wants to improve the availability and performance of a global application that uses TCP and UDP traffic by routing users through the AWS global network to the nearest healthy endpoint, using static anycast IP addresses. Which service should it use?","o":["AWS Global Accelerator","Amazon CloudFront","Amazon Route 53","AWS Direct Connect"],"a":[0],"e":"Global Accelerator provides static IPs and routes traffic over the AWS backbone to the optimal regional endpoint. CloudFront caches HTTP content at the edge rather than accelerating arbitrary TCP/UDP."},{"id":"tech43","d":"tech","q":"A company wants its on-premises applications to keep using local file shares while the data is stored durably in Amazon S3. Which service provides this hybrid storage?","o":["AWS Storage Gateway","Amazon EFS","AWS Snowball","AWS DataSync"],"a":[0],"e":"Storage Gateway (File, Volume, or Tape Gateway) connects on-premises environments to cloud storage with local caching. DataSync is for scheduled bulk transfers rather than ongoing hybrid access."},{"id":"tech44","d":"tech","q":"A company wants one place to centrally configure and manage backups for EBS volumes, RDS databases, DynamoDB tables, and EFS file systems across accounts. Which service should it use?","o":["AWS Backup","Amazon S3 Glacier","AWS Storage Gateway","Amazon Data Lifecycle Manager"],"a":[0],"e":"AWS Backup centralizes backup policies, schedules, and retention across many AWS services and accounts. Data Lifecycle Manager handles EBS snapshots and AMIs only."},{"id":"tech45","d":"tech","q":"Which AWS services would a company use to build and deploy generative AI applications using foundation models from multiple providers, without managing infrastructure? (Choose TWO.)","o":["Amazon Bedrock","Amazon SageMaker","Amazon Rekognition","Amazon Polly","AWS Batch"],"a":[0,1],"e":"Bedrock gives API access to foundation models from Amazon and other providers; SageMaker is the broader platform for building, training, and deploying custom models. Rekognition and Polly are pre-trained single-purpose AI services."},{"id":"tech46","d":"tech","q":"A call-center application needs to convert recorded customer calls into text and then determine the sentiment of each call. Which services should be combined? (Choose TWO.)","o":["Amazon Transcribe","Amazon Comprehend","Amazon Polly","Amazon Translate","Amazon Lex"],"a":[0,1],"e":"Transcribe converts speech to text; Comprehend analyzes text for sentiment, entities, and key phrases. Polly is text-to-speech, Translate converts languages, and Lex builds chatbots."},{"id":"tech47","d":"tech","q":"A developer wants to trace requests as they travel through a distributed application built on API Gateway, Lambda, and DynamoDB, to find which component adds latency. Which service should be used?","o":["AWS X-Ray","Amazon CloudWatch Logs","AWS CloudTrail","AWS Config"],"a":[0],"e":"X-Ray provides end-to-end request tracing and a service map that shows latency and errors per component. CloudWatch Logs stores log output but does not correlate requests across services."},{"id":"tech48","d":"tech","q":"Where can an administrator see personalized alerts about AWS service events and scheduled changes, such as planned EC2 maintenance, that affect their specific account resources?","o":["AWS Health Dashboard","AWS Trusted Advisor","AWS CloudTrail","Amazon CloudWatch"],"a":[0],"e":"The AWS Health Dashboard (account view) shows events relevant to your resources, including scheduled maintenance. The public service status page shows overall service health without account context."},{"id":"tech49","d":"tech","q":"A company wants to provide employees with secure, managed virtual Windows or Linux desktops that they can access from any de
